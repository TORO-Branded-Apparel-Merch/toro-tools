<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TORO Rep Portal</title>
<style>
:root {
  --red:#BC112A; --red-dark:#9e0f22; --red-light:#fff0f2;
  --red-gradient:linear-gradient(160deg,#BC112A 0%,#E9553A 100%);
  --green:#1a7f4b; --green-bg:#e8f5ee; --orange:#C46A1E; --orange-bg:#fff3e0;
  --bg:#F5F5F7; --surface:#fff; --border:#E2E3E6;
  --text:#1a1a1f; --text2:#444; --text3:#888;
}

* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:var(--bg); color:var(--text); font-size:13px; }
.header { background:var(--red-gradient); color:white; padding:12px 24px; display:flex; align-items:center; justify-content:space-between; box-shadow:0 2px 8px rgba(0,0,0,.15); }
.header h1 { font-size:16px; font-weight:bold; }
.header .sub { font-size:11px; color:#aaa; }
.container { max-width:1100px; margin:0 auto; padding:16px 24px; }
.cloud-note { font-size:11px; color:#666; background:#eef6ff; border:1px solid #b8d4f0; border-radius:4px; padding:7px 12px; margin-bottom:14px; }
.cloud-note.err { background:#fff3f3; border-color:#fcc; }
.kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:10px; margin-bottom:18px; }
.kpi { background:white; border:1px solid #ddd; border-radius:6px; padding:14px; }
.kpi .val { font-size:22px; font-weight:bold; }
.kpi .lbl { font-size:10px; color:#888; text-transform:uppercase; letter-spacing:.5px; margin-top:2px; }
.kpi .cmp { font-size:11px; margin-top:4px; }
.green { color:var(--green); } .red { color:var(--red); } .orange { color:var(--orange); } .muted { color:#999; }
.card { background:white; border:1px solid #ddd; border-radius:6px; margin-bottom:18px; overflow:hidden; }
.card-head { padding:10px 14px; background:#f7f7f8; border-left:4px solid var(--red); font-weight:700; font-size:13px; display:flex; justify-content:space-between; align-items:center; cursor:pointer; user-select:none; }
.card-head .arrow { color:#888; font-size:11px; margin-right:8px; }
.card.collapsed .card-body, .card.collapsed .filters { display:none; }
.goal-bar-wrap { background:#eee; border-radius:6px; height:22px; position:relative; overflow:hidden; margin:8px 0 4px; }
.goal-bar { height:100%; border-radius:6px; background:#1a7f4b; transition:width .4s; min-width:2px; }
.goal-bar.behind { background:var(--orange); }
.goal-pace { position:absolute; top:0; bottom:0; width:2px; background:#1a1a1a; opacity:.45; }
.goal-bar-label { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); font-size:11px; font-weight:700; color:#1a1a1a; text-shadow:0 0 3px white; }
.card-body { padding:0; }
table { width:100%; border-collapse:collapse; font-size:12px; }
th { text-align:left; padding:8px 12px; background:#fafafa; border-bottom:2px solid #ddd; font-size:10px; text-transform:uppercase; letter-spacing:.4px; color:#666; cursor:pointer; user-select:none; }
td { padding:8px 12px; border-bottom:1px solid #eee; }
tr:hover td { background:#fafcff; }
.r { text-align:right; } .bold { font-weight:600; }
.empty { padding:24px; text-align:center; color:#999; }
.filters { display:flex; gap:10px; flex-wrap:wrap; padding:12px 14px; background:#fafafa; border-bottom:1px solid #eee; align-items:flex-end; }
.fg label { display:block; font-size:10px; text-transform:uppercase; color:#888; margin-bottom:3px; letter-spacing:.4px; }
input, select { padding:6px 8px; border:1px solid #ccc; border-radius:3px; font-size:12px; }
button { padding:7px 14px; background:var(--red-gradient); color:white; border:none; border-radius:4px; font-size:12px; cursor:pointer; font-weight:600; }
button.secondary { background:white; color:var(--text); border:1px solid #ccc; }
button:hover { opacity:.85; }
a { color:#2f6fb2; text-decoration:none; }
.rep-picker { max-width:420px; margin:60px auto; background:white; border:1px solid #ddd; border-radius:8px; padding:28px; text-align:center; }
.rep-picker button { display:block; width:100%; margin:6px 0; padding:11px; background:white; color:#1a1a1a; border:1px solid #ccc; font-size:13px; }
.rep-picker button:hover { background:var(--red); border-color:var(--red); color:white; opacity:1; }
.print-only { display:none; }
@media print {
  body { background:white; font-size:11px; }
  .header, .cloud-note, .filters, button, select, input, #ytdNote, .kpis { display:none !important; }
  .container { max-width:none; padding:0; }
  .card { border:none; margin:0; box-shadow:none; }
  .card-head { background:none; border-left:none; padding:4px 0; font-size:15px; }
  body[data-print] .card { display:none; }
  body[data-print] .card.print-target { display:block; }
  .print-only { display:block; font-size:11px; color:#555; margin-bottom:10px; }
  td, th { padding:4px 8px; }
  a { color:#1a1a1a; text-decoration:none; }
  tr { page-break-inside:avoid; }
}
</style>
</head>

// Reverse cp1252 mapping for the 0x80-0x9F range (chars that map above U+00FF)
const CP1252_REV = {'\u20AC':0x80,'\u201A':0x82,'\u0192':0x83,'\u201E':0x84,'\u2026':0x85,'\u2020':0x86,'\u2021':0x87,'\u02C6':0x88,'\u2030':0x89,'\u0160':0x8A,'\u2039':0x8B,'\u0152':0x8C,'\u017D':0x8E,'\u2018':0x91,'\u2019':0x92,'\u201C':0x93,'\u201D':0x94,'\u2022':0x95,'\u2013':0x96,'\u2014':0x97,'\u02DC':0x98,'\u2122':0x99,'\u0161':0x9A,'\u203A':0x9B,'\u0153':0x9C,'\u017E':0x9E,'\u0178':0x9F};

function fixMojibake(text) {
  if (!text || typeof text !== 'string') return text;
  // Only attempt when the string looks like cp1252-mangled UTF-8
  if (!/[\u00C2-\u00F4\u0152-\u0192\u2013-\u2122]/.test(text)) return text;
  try {
    const bytes = new Uint8Array(text.length);
    for (let i = 0; i < text.length; i++) {
      const ch = text[i], code = text.charCodeAt(i);
      bytes[i] = CP1252_REV[ch] !== undefined ? CP1252_REV[ch] : (code & 0xff);
    }
    const decoded = new TextDecoder('utf-8', { fatal: true }).decode(bytes);
    return decoded;
  } catch (e) { return text; }
}

function parseCSVLine(line) {
  const result = [];
  let cur = '';
  let inQ = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (c === '"') {
      if (inQ && line[i+1] === '"') { cur += '"'; i++; }
      else inQ = !inQ;
    } else if (c === ',' && !inQ) { result.push(cur); cur = ''; }
    else cur += c;
  }
  result.push(cur);
  return result;
}

function parseCSV(text) {
  text = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
  const rawLines = text.split('\n');
  const lines = [];
  let buf = '';
  for (const line of rawLines) {
    buf += (buf ? '\n' : '') + line;
    if ((buf.match(/"/g) || []).length % 2 === 0) { lines.push(buf); buf = ''; }
  }
  if (buf) lines.push(buf);
  if (!lines.length) return [];
  const headers = parseCSVLine(lines[0]).map(h => h.trim());
  const data = [];
  for (let i = 1; i < lines.length; i++) {
    if (!lines[i].trim()) continue;
    const vals = parseCSVLine(lines[i]);
    const obj = {};
    headers.forEach((h, idx) => { obj[h] = fixMojibake((vals[idx] || '').trim()); });
    data.push(obj);
  }
  return data;
}

// ─── DATA CLEANING ──────────────────────────────────────────────────────────
// Handles both the old 9-column export and the new master list (24 columns).
// Dates may arrive as "YYYY-MM-DD HH:MM:SS" strings, JS Dates (from xlsx), or
// Excel serial numbers.
function toDate(v) {
  // Duck-typed Date check (robust across JS contexts)
  if (v && typeof v === 'object' && typeof v.getFullYear === 'function' && !isNaN(v.getTime())) {
    return new Date(v.getFullYear(), v.getMonth(), v.getDate());
  }
  if (typeof v === 'number' && v > 20000 && v < 60000) {
    // Excel serial date (days since 1899-12-30)
    const d = new Date(Math.round((v - 25569) * 86400 * 1000));
    return new Date(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate());
  }
  if (typeof v === 'string' && v) {
    const parts = v.split(' ')[0].split('-');
    if (parts.length === 3) return new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
  }
  return null;
}

function toBool(v) {
  if (typeof v === 'boolean') return v;
  return String(v).trim().toUpperCase() === 'TRUE';
}

// Extract the numeric Printavo invoice id from the Invoice URL
function printavoId(url) {
  const m = String(url || '').match(/invoices\/(\d+)/);

function cleanAndNormalize(rawData) {
  return rawData

      if (/archiv/i.test(status)) return false; // Archived Quotes, Merch Store archives
      if (!VALID_REPS.includes(String(row['Owner'] || '').trim())) return false;
      if (!row['Customer Company'] || !String(row['Customer Company']).trim()) return false;
      const amt = parseFloat(row['Total'] || 0);
      if (isNaN(amt) || amt <= 0) return false;
      return true;
    })
    .map(row => {
      const date = toDate(row['Invoice Date']);
      if (!date) return null;
      const year = date.getFullYear(), month = date.getMonth();
      if (year < 2020 || year > 2030) return null;
      return {
        invoice_date: date,
        invoice_number: String(row['Invoice #'] ?? ''),
        client_name: String(row['Customer Company']).trim(),
        client_full_name: row['Customer Full Name'] ? String(row['Customer Full Name']).trim() : '',
        client_email: String(row['Customer Email'] || ''),
        rep: String(row['Owner']).trim(),
        total: parseFloat(row['Total']),
        product: String(row['Nickname'] || '(none)'),
        status: String(row['Invoice Status'] || '').trim(),
        year, month, quarter: Math.floor(month / 3) + 1,
        // New master-list fields (blank/defaults when loading the old export)
        customer_id: String(row['Customer Id'] || ''),

        pv_id: printavoId(row['Invoice URL']),
        ship_city: String(row['Shipping City'] || '').trim(),

      };
    })
    .filter(Boolean);
}

let db = null;
const CLOUD_COLLECTION = 'report_builder';
const CHUNK_LIMIT = 800 * 1024; // stay under Firestore's 1MB doc limit

function cloudEnabled() { return db !== null; }

function setCloudStatus(msg, isError) {

function initFirebase() {
  try {
    if (typeof firebase === 'undefined') return; // SDK blocked/offline
    if (!FIREBASE_CONFIG.projectId || FIREBASE_CONFIG.projectId.startsWith('PASTE_')) {

// Merge key: Printavo invoice id (globally unique). Falls back to
// invoice # + date + total for old-format records without URLs.
function recordKey(r) {
  if (r.pv_id) return 'pv:' + r.pv_id;
  return `${r.invoice_number}|${r.invoice_date ? r.invoice_date.getTime() : ''}|${r.total}`;
}

function mergeData(existing, incoming) {
  // If the incoming file is the new format but existing cloud data is the old
  // format (no Printavo ids), replace wholesale to avoid duplicate orders
  const incHasIds = incoming.length && incoming.filter(r => r.pv_id).length / incoming.length > 0.5;
  const exHasIds  = existing.length && existing.filter(r => r.pv_id).length / existing.length > 0.5;
  if (incHasIds && !exHasIds && existing.length) return [...incoming];

  const map = new Map();
  existing.forEach(r => map.set(recordKey(r), r));
  incoming.forEach(r => map.set(recordKey(r), r)); // new data wins on same key
  return [...map.values()];
}

// Compact serialization: array-of-arrays with date as yyyy-mm-dd string
function serializeData(data) {
  return data.map(r => [
    r.invoice_date ? `${r.invoice_date.getFullYear()}-${String(r.invoice_date.getMonth()+1).padStart(2,'0')}-${String(r.invoice_date.getDate()).padStart(2,'0')}` : '',
    r.invoice_number, r.client_name, r.client_full_name, r.client_email,
    r.rep, r.total, r.product, r.status,
    r.customer_id || '', r.paid === null ? '' : (r.paid ? 1 : 0), r.outstanding || 0,
    r.term_days || 0, r.payment_term || '', r.delivery || '', r.po || '',
    r.pv_id || '', r.ship_city || '', r.ship_state || ''
  ]);
}

function deserializeData(rows) {
  return rows.map(a => {
    const parts = (a[0] || '').split('-');
    let date = null, year = 0, month = 0, quarter = 0;
    if (parts.length === 3) {
      year = parseInt(parts[0]); month = parseInt(parts[1]) - 1;
      date = new Date(year, month, parseInt(parts[2]));
      quarter = Math.floor(month / 3) + 1;
    }
    return {
      invoice_date: date, invoice_number: a[1], client_name: a[2],
      client_full_name: a[3], client_email: a[4], rep: a[5],
      total: a[6], product: a[7], status: a[8],
      customer_id: a[9] || '',
      paid: a[10] === '' || a[10] === undefined ? null : !!a[10],
      outstanding: a[11] || 0,
      term_days: a[12] || 0, payment_term: a[13] || '',
      delivery: a[14] || '', po: a[15] || '',
      pv_id: a[16] || '', ship_city: a[17] || '', ship_state: a[18] || '',
      year, month, quarter,
    };
  }).filter(r => r.year >= 2020 && r.year <= 2030);
}

async function saveToCloud() {
  if (!cloudEnabled()) return;
  try {
    const rows = serializeData(allData);
    // Chunk rows so each doc's JSON stays under the limit
    const chunks = [];
    let current = [], size = 2;
    for (const row of rows) {
      const rowSize = JSON.stringify(row).length + 1;
      if (size + rowSize > CHUNK_LIMIT && current.length) {
        chunks.push(current); current = []; size = 2;
      }
      current.push(row); size += rowSize;
    }
    if (current.length) chunks.push(current);

    const batchWrites = [];
    chunks.forEach((chunk, i) => {
      batchWrites.push(db.collection(CLOUD_COLLECTION).doc('chunk_' + i).set({ rows: JSON.stringify(chunk) }));
    });
    await Promise.all(batchWrites);

    // Clean up any leftover chunks from a previous larger dataset
    const meta = await db.collection(CLOUD_COLLECTION).doc('meta').get();
    const oldCount = meta.exists ? (meta.data().chunkCount || 0) : 0;
    for (let i = chunks.length; i < oldCount; i++) {
      await db.collection(CLOUD_COLLECTION).doc('chunk_' + i).delete();
    }

    await db.collection(CLOUD_COLLECTION).doc('meta').set({
      chunkCount: chunks.length,
      recordCount: allData.length,
      updatedAt: new Date().toISOString(),
    });
    setCloudStatus(`Synced ${allData.length.toLocaleString()} orders to cloud (updated ${new Date().toLocaleString()})`);
  } catch (e) {
    console.error('Cloud save failed:', e);
    setCloudStatus('Cloud sync failed: ' + e.message + ' (data still works locally)', true);
  }
}

// Push group selections to the shared settings doc so the whole team gets them
async function saveGroupsToCloud() {

  try {
    await db.collection(CLOUD_COLLECTION).doc('settings').set({
      groupKeys: [...activeGroupKeys],
      updatedAt: new Date().toISOString(),
    }, { merge: true });
  } catch (e) { console.error('Group sync failed:', e); }
}

// UI-agnostic cloud loader: returns { data, meta } or null
async function loadCloudData() {
  if (!cloudEnabled()) return null;
  try {
    const meta = await db.collection(CLOUD_COLLECTION).doc('meta').get();
    if (!meta.exists) return null;
    const { chunkCount, recordCount, updatedAt } = meta.data();
    const reads = [];
    for (let i = 0; i < chunkCount; i++) reads.push(db.collection(CLOUD_COLLECTION).doc('chunk_' + i).get());
    const docs = await Promise.all(reads);
    let rows = [];
    docs.forEach(d => { if (d.exists) rows = rows.concat(JSON.parse(d.data().rows)); });
    return { data: deserializeData(rows), meta: { recordCount, updatedAt } };
  } catch (e) {
    console.error('Cloud load failed:', e);
    setCloudStatus('Could not load from cloud: ' + e.message, true);
    return null;
  }
}

  const y = curYear();

  const rows = [];

  for (let m = 0; m < 12; m++) {

    const q = mo.filter(r => stageOf(r)==='quoted').reduce((s,r)=>s+r.total,0);
    const b = mo.filter(r => stageOf(r)==='booked').reduce((s,r)=>s+r.total,0);
    const c = mo.filter(r => stageOf(r)==='completed').reduce((s,r)=>s+r.total,0);
    tot.quoted += q; tot.booked += b; tot.completed += c;
    rows.push(`<tr>

      <td class="r muted">${$c(q)}</td>

      <td class="r green bold">${$c(c)}</td>
      <td class="r bold">${$c(q+b+c)}</td>

}

}

// ─── MY GOALS (v2: booked + invoiced, monthly/annual, seasonal split) ───────
let goalsCache = {};        // full goals doc
let goalView = 'monthly';   // 'monthly' | 'annual'
let goalDetails = false;    // expanded details
let goalEditing = null;     // null | 'annual' | 'month'

// Booked = approved-or-beyond (includes completed). Invoiced = completed.
function monthActual(y, m) {
  const mo = myData.filter(r => r.year === y && r.month === m);
  return {
    bkd: mo.filter(r => stageOf(r) !== 'quoted').reduce((s,r) => s+r.total, 0),
    inv: mo.filter(r => isComplete(r)).reduce((s,r) => s+r.total, 0),
  };
}
function ytdActual(y, throughMonth, dayFrac) {
  let bkd = 0, inv = 0;
  for (let m = 0; m <= throughMonth; m++) { const a = monthActual(y, m); bkd += a.bkd; inv += a.inv; }
  return { bkd, inv };
}

// Seasonal weights: personal curve if the rep has 8+ active months in 2024-25,
// else the company curve. Personal curves are blended 75/25 with company to smooth gaps.
function seasonalWeights() {
  const base = allData.filter(r => (r.year === 2024 || r.year === 2025) && isComplete(r));
  const coMo = Array(12).fill(0);
  base.forEach(r => coMo[r.month] += r.total);
  const coTot = coMo.reduce((a,b) => a+b, 0) || 1;
  const co = coMo.map(v => v/coTot);

  const mine = base.filter(r => r.rep === myRep);
  const myMo = Array(12).fill(0);
  mine.forEach(r => myMo[r.month] += r.total);
  const myTot = myMo.reduce((a,b) => a+b, 0);
  const activeMonths = myMo.filter(v => v > 0).length;

  // Reps whose pre-tenure history is not their own use the company curve
  const FORCE_COMPANY_CURVE = ['Lexi Martinez'];
  if (!FORCE_COMPANY_CURVE.includes(myRep) && myTot > 0 && activeMonths >= 8) {
    const raw = myMo.map((v,i) => 0.75*(v/myTot) + 0.25*co[i]);
    const rTot = raw.reduce((a,b) => a+b, 0);
    return { w: raw.map(v => v/rTot), source: 'your seasonal history' };
  }
  return { w: co, source: 'company seasonal curve (until you have a full year of history)' };
}

function migrateGoals(entry) {
  // Current format: annual[year] = number (booked), months["YYYY-MM"] = number (booked)
  if (!entry) return { annual: {}, months: {} };
  const num = v => typeof v === 'number' ? v : (v && (v.bkd || v.inv)) || 0;
  const annual = {}, months = {};
  if (entry.annual || entry.months) {
    Object.entries(entry.annual || {}).forEach(([y, v]) => { const n = num(v); if (n) annual[y] = n; });
    Object.entries(entry.months || {}).forEach(([k, v]) => { const n = num(v); if (n) months[k] = n; });
    return { annual, months };
  }
  Object.entries(entry).forEach(([k, v]) => {
    if (/^\d{4}-\d{2}$/.test(k) && typeof v === 'number') months[k] = v;
  });
  return { annual, months };
}

function myGoals() {
  goalsCache[myRep] = migrateGoals(goalsCache[myRep]);
  return goalsCache[myRep];
}

// Target for a month: explicit override, else annual x seasonal weight
function monthlyTarget(y, m, weights) {
  const g = myGoals();
  const key = `${y}-${String(m+1).padStart(2,'0')}`;
  if (g.months[key]) return { bkd: g.months[key], src: 'override' };
  if (g.annual[y]) return { bkd: g.annual[y] * weights.w[m], src: 'annual' };
  return null;
}

async function loadGoals() {
  if (!cloudEnabled()) return;
  try {
    const doc = await db.collection(CLOUD_COLLECTION).doc('goals').get();
    if (doc.exists) goalsCache = doc.data() || {};
  } catch (e) { console.error('Goals load failed:', e); }
}

async function persistMyGoals() {
  renderGoal();
  if (!cloudEnabled()) return;
  try {
    await db.collection(CLOUD_COLLECTION).doc('goals').set({ [myRep]: myGoals() }, { merge: true });
  } catch (e) { setCloudStatus('Could not save goal: ' + e.message, true); }
}

function setGoalView(v) { goalView = v; goalEditing = null; renderGoal(); }
function toggleGoalDetails() { goalDetails = !goalDetails; renderGoal(); }

function annualSuggestion() {
  // Trailing 12 months invoiced; fallback to annualized run-rate
  const latest = goalMonthAnchor().latest;
  const cutoff = new Date(latest); cutoff.setFullYear(cutoff.getFullYear() - 1);
  const t12 = myData.filter(r => stageOf(r) !== 'quoted' && r.invoice_date >= cutoff).reduce((s,r) => s+r.total, 0);
  if (t12 > 0) {
    const span = Math.min(365, (latest - myData.reduce((m,r) => r.invoice_date < m ? r.invoice_date : m, latest)) / 86400000);
    if (span >= 300) return { amount: Math.round(t12), why: `trailing 12 months (${$c0(t12)})` };
    const annualized = t12 / span * 365;
    return { amount: Math.round(annualized), why: `current run rate, annualized (${$c0(annualized)})` };
  }
  return { amount: '', why: '' };
}

function goalMonthAnchor() {
  const latest = allData.reduce((m,r) => r.invoice_date > m ? r.invoice_date : m, allData[0].invoice_date);
  return { y: latest.getFullYear(), m: latest.getMonth(), latest };
}

function miniRow(label, act, goal, paceFrac) {
  if (!goal || goal <= 0) return '';
  const pct = act/goal*100;
  const ahead = pct >= paceFrac*100;
  return `<div style="display:flex;align-items:center;gap:10px;margin:5px 0;">
    <div style="width:62px;font-size:12px;font-weight:600;">${label}</div>
    <div style="width:190px;font-size:12px;text-align:right;">${$c0(act)} / ${$c0(goal)}</div>
    <div class="goal-bar-wrap" style="flex:1;height:16px;margin:0;">
      <div class="goal-bar ${ahead ? '' : 'behind'}" style="width:${Math.min(pct,100)}%;"></div>
      <div class="goal-pace" style="left:${Math.min(paceFrac*100,100)}%;"></div>
    </div>
    <div style="width:44px;font-size:12px;font-weight:700;" class="${ahead ? 'green' : 'orange'}">${pct.toFixed(0)}%</div>
  </div>`;
}

function renderGoal() {
  const { y, m, latest } = goalMonthAnchor();
  const g = myGoals();
  const weights = seasonalWeights();
  const hasAnnual = !!g.annual[y];
  const target = monthlyTarget(y, m, weights);

  document.getElementById('goalMonthLabel').textContent =
    goalView === 'monthly' ? `${MONTHS_FULL[m]} ${y}` : `${y} Annual`;
  document.getElementById('goalToggle').innerHTML = `
    <button class="secondary" style="${goalView==='monthly' ? 'background:var(--red);color:#fff;border-color:var(--red);' : ''}" onclick="setGoalView('monthly')">Monthly</button>
    <button class="secondary" style="${goalView==='annual' ? 'background:var(--red);color:#fff;border-color:var(--red);' : ''}" onclick="setGoalView('annual')">Annual</button>`;

  const body = document.getElementById('goalBody');

  // ── Setter (no goals yet, or explicitly editing annual) ──
  if ((!hasAnnual && !target) || goalEditing === 'annual') {
    const sug = annualSuggestion();
    const cur = g.annual[y] || 0;
    body.innerHTML = `
      <div style="font-size:13px;margin-bottom:8px;">Set your ${y} annual booked sales target. Monthly targets are derived from the ${weights.source}. Individual months can be adjusted afterward.</div>
      ${sug.why ? `<div style="font-size:11px;color:#888;margin-bottom:8px;">Reference: ${sug.why}.</div>` : ''}
      ${sug.amount ? `<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;">
        ${[['Match',0],['Steady +5%',5],['Healthy +10%',10],['Aggressive +20%',20]].map(([l,p]) => {
          const amt = Math.round(sug.amount*(1+p/100));
          return `<button class="secondary" style="display:flex;flex-direction:column;align-items:center;padding:8px 14px;line-height:1.4;"
            onclick="document.getElementById('gaBkd').value='${amt}'">
            <span style="font-weight:700;">${l}</span><span style="font-size:13px;font-weight:700;">${$c0(amt)}</span></button>`;
        }).join('')}
      </div>` : ''}
      <div style="display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end;">
        <div><label style="display:block;font-size:10px;text-transform:uppercase;color:#888;margin-bottom:3px;">Annual Booked Goal</label>
          <span style="font-weight:700;">$</span> <input type="text" id="gaBkd" value="${(typeof cur === 'number' && cur) || sug.amount || ''}" style="width:110px;font-weight:700;"></div>
        <button onclick="saveAnnualGoal()">Save Annual Goal</button>
        ${hasAnnual ? '<button class="secondary" onclick="goalEditing=null;renderGoal()">Cancel</button>' : ''}
      </div>`;
    return;
  }

  // ── Month override editor ──
  if (goalEditing === 'month') {
    const t = target || { bkd: '' };
    body.innerHTML = `
      <div style="font-size:13px;margin-bottom:8px;">Adjust the ${MONTHS_FULL[m]} booked target. This overrides the derived amount for this month only.</div>
      <div style="display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end;">
        <div><label style="display:block;font-size:10px;text-transform:uppercase;color:#888;margin-bottom:3px;">Booked Target (${MONTHS[m]})</label>
          <span style="font-weight:700;">$</span> <input type="text" id="gmBkd" value="${Math.round(t.bkd) || ''}" style="width:100px;font-weight:700;"></div>
        <button onclick="saveMonthOverride()">Save ${MONTHS[m]}</button>
        <button class="secondary" onclick="goalEditing=null;renderGoal()">Cancel</button>
      </div>`;
    return;
  }

  // ── Snapshot views ──
  const daysInMonth = new Date(y, m+1, 0).getDate();
  let html = '';

  if (goalView === 'monthly') {
    const act = monthActual(y, m);
    const paceFrac = latest.getDate()/daysInMonth;
    html = miniRow('Booked', act.bkd, target ? target.bkd : 0, paceFrac)
         + `<div style="font-size:11px;color:#888;margin:4px 0 0 72px;">Invoiced this month: ${$c0(act.inv)} (tracked at the company level)</div>`;
    if (!target) html = '<div style="font-size:12px;color:#888;">No target set for this month.</div>';
    if (goalDetails && target) {
      const pipe = myData.filter(r => r.year === y && r.month === m && stageOf(r) === 'quoted').reduce((s,r) => s+r.total, 0);
      html += `<div style="font-size:11px;color:#888;margin-top:8px;">
        Target ${target.src === 'override' ? 'set manually for this month' : `derived from your annual goal via the ${weights.source}`}.
        ${pipe > 0 ? `Quoted (not yet booked) this month: ${$c0(pipe)}.` : ''}
      </div>${breakdownTable(y, weights)}`;
    }
  } else {
    // Annual: pace = seasonal weight of elapsed months + partial current month
    let paceFrac = 0;
    for (let i = 0; i < m; i++) paceFrac += weights.w[i];
    paceFrac += weights.w[m] * (latest.getDate()/daysInMonth);
    const a = g.annual[y];
    const ytd = ytdActual(y, m);
    if (a) {
      html = miniRow('Booked', ytd.bkd, a, paceFrac)
           + `<div style="font-size:11px;color:#888;margin:4px 0 0 72px;">Invoiced YTD: ${$c0(ytd.inv)} (tracked at the company level)</div>`;
      if (goalDetails) {
        const proj = paceFrac > 0.02 ? ytd.bkd/paceFrac : 0;
        html += `<div style="font-size:11px;color:#888;margin-top:8px;">
          Pace follows the ${weights.source}: ${(paceFrac*100).toFixed(0)}% of the year's expected volume has elapsed.
          ${proj ? `Current booked pace projects to ${$c0(proj)} for the full year.` : ''}
        </div>${breakdownTable(y, weights)}`;
      }
    } else {
      html = `<div style="font-size:12px;color:#888;">No annual goal set. <a href="javascript:void(0)" onclick="goalEditing='annual';renderGoal()">Set ${y} targets</a></div>`;
    }
  }

  body.innerHTML = html + `
    <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;">
      <button class="secondary" onclick="toggleGoalDetails()">${goalDetails ? 'Hide' : 'Show'} details</button>
      ${target || g.annual[y] ? `<button class="secondary" onclick="goalEditing='month';renderGoal()">Adjust ${MONTHS[m]}</button>` : ''}
      <button class="secondary" onclick="goalEditing='annual';renderGoal()">${hasAnnual ? 'Edit' : 'Set'} annual goals</button>
    </div>`;
}

function breakdownTable(y, weights) {
  const g = myGoals();
  if (!g.annual[y] && !Object.keys(g.months).some(k => k.startsWith(y+'-'))) return '';
  const rows = [];
  for (let m = 0; m < 12; m++) {
    const t = monthlyTarget(y, m, weights);
    if (!t) continue;
    const act = monthActual(y, m);
    rows.push(`<tr><td>${MONTHS[m]}${t.src === 'override' ? ' *' : ''}</td>
      <td class="r">${$c0(t.bkd)}</td><td class="r">${$c0(act.bkd)}</td>
      <td class="r muted">${$c0(act.inv)}</td></tr>`);
  }
  return `<div style="margin-top:10px;"><table style="font-size:11px;">
    <thead><tr><th>Month</th><th class="r">Booked Target</th><th class="r">Booked Actual</th><th class="r">Invoiced (ref)</th></tr></thead>
    <tbody>${rows.join('')}</tbody></table>
    <div style="font-size:10px;color:#999;padding:4px 2px;">* manually adjusted month</div></div>`;
}

function saveAnnualGoal() {
  const bkd = parseFloat(document.getElementById('gaBkd').value.replace(/[$,]/g, ''));
  if (!bkd || bkd <= 0) { alert('Enter an annual booked goal'); return; }
  const { y } = goalMonthAnchor();
  myGoals().annual[y] = Math.round(bkd);
  goalEditing = null;
  persistMyGoals();
}

function saveMonthOverride() {
  const bkd = parseFloat(document.getElementById('gmBkd').value.replace(/[$,]/g, ''));
  if (!bkd || bkd <= 0) { alert('Enter a booked target'); return; }
  const { y, m } = goalMonthAnchor();
  myGoals().months[`${y}-${String(m+1).padStart(2,'0')}`] = Math.round(bkd);
  goalEditing = null;
  persistMyGoals();
}

function renderKPIs() {
  const y = curYear(), ly = y - 1;
  const info = getYtdCutoff(y, ly);
  const cutoff = info ? info.cutoff : null;

  const cur = myData.filter(r => r.year === y && isComplete(r));
  const prior = myData.filter(r => r.year === ly && isComplete(r) && (!cutoff || r.invoice_date <= cutoff));

  const rev = cur.reduce((s,r) => s+r.total, 0);
  const lyRev = prior.reduce((s,r) => s+r.total, 0);
  const orders = cur.length;
  const clients = new Set(cur.map(r => r.client_name)).size;
  const avg = orders ? rev/orders : 0;
  const ar = myData.filter(r => r.paid === false && r.outstanding > 0);
  const arTotal = ar.reduce((s,r) => s+r.outstanding, 0);
  const bookedOpen = myData.filter(r => stageOf(r) === 'booked');
  const bookedTotal = bookedOpen.reduce((s,r) => s+r.total, 0);

  const chg = lyRev > 0 ? ((rev-lyRev)/lyRev*100) : null;

    `<div class="cmp ${chg >= 0 ? 'green' : 'red'}">${chg >= 0 ? '▲' : '▼'} ${Math.abs(chg).toFixed(1)}% vs ${ly}${info ? ' YTD' : ''}</div>`;

  document.getElementById('ytdNote').textContent = info ? `Comparisons use Jan 1 - ${MONTHS[info.latest.getMonth()]} ${info.latest.getDate()} of both years` : '';

    <div class="kpi"><div class="val">${$c0(rev)}</div><div class="lbl">${y} Revenue (completed)</div>${chgHtml}</div>
    <div class="kpi"><div class="val">${orders}</div><div class="lbl">Orders</div><div class="cmp muted">${prior.length} in ${ly}${info ? ' YTD' : ''}</div></div>
    <div class="kpi"><div class="val">${clients}</div><div class="lbl">Clients</div></div>
    <div class="kpi"><div class="val">${$c0(avg)}</div><div class="lbl">Avg Order</div></div>
    <div class="kpi"><div class="val" style="color:#2f6fb2;">${$c0(bookedTotal)}</div><div class="lbl">Booked - In Progress</div><div class="cmp muted">${bookedOpen.length} committed order${bookedOpen.length === 1 ? '' : 's'}</div></div>
    <div class="kpi"><div class="val ${arTotal > 0 ? 'orange' : 'green'}">${$c0(arTotal)}</div><div class="lbl">My Open AR</div><div class="cmp muted">${ar.length} unpaid invoice${ar.length === 1 ? '' : 's'}</div></div>
  `;
}

function renderMonthly() {
  const y = curYear(), ly = y - 1;
  const cur = myData.filter(r => r.year === y && isComplete(r));
  const prior = myData.filter(r => r.year === ly && isComplete(r));

  const rows = [];
  let prevRev = null;
  for (let m = 0; m < 12; m++) {
    const mo = cur.filter(r => r.month === m);
    const lyMo = prior.filter(r => r.month === m);
    const rev = mo.reduce((s,r) => s+r.total, 0);
    const lyRev = lyMo.reduce((s,r) => s+r.total, 0);
    if (!mo.length && !lyMo.length) { prevRev = mo.length ? rev : prevRev; continue; }

    const yoy = lyRev > 0 ? (rev-lyRev)/lyRev*100 : null;
    const mom = (prevRev !== null && prevRev > 0) ? (rev-prevRev)/prevRev*100 : null;
    rows.push(`<tr>
      <td class="bold">${MONTHS[m]}</td>
      <td class="r bold">${$c(rev)}</td>
      <td class="r">${mo.length}</td>
      <td class="r muted">${$c(lyRev)}</td>
      <td class="r ${yoy === null ? 'muted' : yoy >= 0 ? 'green' : 'red'}">${yoy === null ? '-' : (yoy >= 0 ? '+' : '') + yoy.toFixed(1) + '%'}</td>
      <td class="r ${mom === null ? 'muted' : mom >= 0 ? 'green' : 'red'}">${mom === null ? '-' : (mom >= 0 ? '+' : '') + mom.toFixed(1) + '%'}</td>
    </tr>`);
    prevRev = rev;
  }
  const totRev = cur.reduce((s,r) => s+r.total, 0);
  document.getElementById('monthlyTable').innerHTML = `<table>
    <thead><tr><th>Month</th><th class="r">${y} Revenue</th><th class="r">Orders</th><th class="r">${ly} Same Month</th><th class="r">vs ${ly} (YoY)</th><th class="r">vs Prior Month (MoM)</th></tr></thead>
    <tbody>${rows.join('') || '<tr><td colspan="6" class="empty">No completed orders yet this year</td></tr>'}</tbody>
    ${rows.length ? `<tfoot><tr style="background:#fafafa;font-weight:700;"><td>Total</td><td class="r">${$c(totRev)}</td><td class="r">${cur.length}</td><td colspan="3"></td></tr></tfoot>` : ''}
  </table>`;
}

let currentOrders = [];

function renderOrders() {
  const from = document.getElementById('f-from').value ? new Date(document.getElementById('f-from').value) : null;
  const to = document.getElementById('f-to').value ? new Date(document.getElementById('f-to').value + 'T23:59:59') : null;
  const inv = document.getElementById('f-inv').value.toLowerCase().trim();
  const client = document.getElementById('f-client').value.toLowerCase().trim();
  const completedOnly = document.getElementById('f-completed').checked;

  currentOrders = myData.filter(r => {
    if (from && r.invoice_date < from) return false;
    if (to && r.invoice_date > to) return false;
    if (inv && !String(r.invoice_number).toLowerCase().includes(inv)) return false;
    if (client && !r.client_name.toLowerCase().includes(client)) return false;
    if (completedOnly && !isComplete(r)) return false;
    return true;
  });

  sortAndDrawOrders();
}

function sortOrders(col, type) {
  if (orderSort.col === col) orderSort.dir = orderSort.dir === 'asc' ? 'desc' : 'asc';
  else { orderSort.col = col; orderSort.dir = type === 'text' ? 'asc' : 'desc'; }
  sortAndDrawOrders();
}

function sortAndDrawOrders() {
  const { col, dir } = orderSort;
  const mult = dir === 'asc' ? 1 : -1;
  currentOrders.sort((a,b) => {
    let av = a[col], bv = b[col];
    if (av instanceof Date) return (av - bv) * mult;
    if (typeof av === 'number' && typeof bv === 'number') return (av - bv) * mult;
    return String(av ?? '').localeCompare(String(bv ?? '')) * mult;
  });

  const arrow = c => orderSort.col === c ? (orderSort.dir === 'asc' ? ' ↑' : ' ↓') : '';
  const total = currentOrders.reduce((s,r) => s+r.total, 0);

  document.getElementById('ordersTable').innerHTML = `
    <div style="padding:8px 14px;font-size:11px;color:#666;background:#fafafa;border-bottom:1px solid #eee;">
      ${currentOrders.length} orders · ${$c(total)} total. Invoice numbers link to Printavo.
    </div>
    <table>
    <thead><tr>
      <th onclick="sortOrders('invoice_date','date')">Date${arrow('invoice_date')}</th>
      <th onclick="sortOrders('invoice_number','text')">Invoice #${arrow('invoice_number')}</th>
      <th onclick="sortOrders('client_name','text')">Company${arrow('client_name')}</th>
      <th onclick="sortOrders('client_full_name','text')">Contact${arrow('client_full_name')}</th>
      <th class="r" onclick="sortOrders('total','num')">Amount${arrow('total')}</th>
      <th onclick="sortOrders('paid','num')">Paid${arrow('paid')}</th>
      <th onclick="sortOrders('status','text')">Status${arrow('status')}</th>
    </tr></thead>
    <tbody>${currentOrders.map(r => `<tr>
      <td>${fdate(r.invoice_date)}</td>
      <td>${pvLink(r)}</td>
      <td class="bold">${r.client_name}</td>
      <td class="muted">${r.client_full_name || '-'}</td>
      <td class="r bold">${$c(r.total)}</td>
      <td>${r.paid === null ? '<span class="muted">n/a</span>' : r.paid ? '<span class="green bold">✓</span>' : '<span class="red bold">✗ ' + (r.outstanding > 0 ? $c(r.outstanding) : '') + '</span>'}</td>
      <td style="font-size:11px;">${r.status}</td>
    </tr>`).join('') || '<tr><td colspan="7" class="empty">No orders match</td></tr>'}</tbody>
  </table>`;
}

function clearFilters() {
  const years = [...new Set(myData.map(r => r.year))].sort((a,b) => b-a);
  document.getElementById('f-from').value = `${years[0]}-01-01`;
  const latest = allData.reduce((m,r) => r.invoice_date > m ? r.invoice_date : m, allData[0].invoice_date);
  document.getElementById('f-to').value = latest.toISOString().slice(0,10);
  document.getElementById('f-inv').value = '';
  document.getElementById('f-client').value = '';
  document.getElementById('f-completed').checked = false;
  renderOrders();
}

function tableToCSV(containerId) {
  const table = document.querySelector('#' + containerId + ' table');
  if (!table) return '';
  let csv = [...table.querySelectorAll('thead th')].map(th => '"' + th.textContent.replace(/[↑↓↗]/g,'').trim() + '"').join(',') + '\n';
  table.querySelectorAll('tbody tr').forEach(tr => {
    csv += [...tr.querySelectorAll('td')].map(td => '"' + td.textContent.replace(/[↗]/g,'').trim() + '"').join(',') + '\n';
  });
  return csv;
}

function dl(csv, name) {
  const blob = new Blob([csv], { type: 'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${name}_${myRep.replace(/ /g,'_')}_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
}

function exportMonthly() { dl(tableToCSV('monthlyTable'), 'monthly_performance'); }
function exportOrders() { dl(tableToCSV('ordersTable'), 'orders'); }

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
