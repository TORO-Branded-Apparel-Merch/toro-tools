<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weekly Rep Cheat Sheet</title>
<style>
:root {
  --red:#BC112A; --red-dark:#9e0f22; --red-light:#fff0f2;
  --red-gradient:linear-gradient(160deg,#BC112A 0%,#E9553A 100%);
  --green:#1a7f4b; --green-bg:#e8f5ee; --orange:#C46A1E; --orange-bg:#fff3e0;
  --bg:#F5F5F7; --surface:#fff; --border:#E2E3E6;
  --text:#1a1a1f; --text2:#444; --text3:#888;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg); color: var(--text); font-size: 13px;
}
.header {
  background: var(--red-gradient); color: #fff;
  box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  padding: 10px 16px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px;
}
.header h1 { font-size: 16px; font-weight: bold; display: flex; align-items: center; gap: 12px; }
.header .controls { display: flex; align-items: center; gap: 8px; }
.header select {
  padding: 6px 10px; border-radius: 6px; border: none; font-size: 13px; font-weight: 600; color: var(--text);
}
.header button {
  padding: 6px 14px; border-radius: 6px; border: 1px solid rgba(255,255,255,.5);
  background: rgba(255,255,255,.12); color: #fff; font-size: 13px; font-weight: 600; cursor: pointer;
}
.header button:hover { background: rgba(255,255,255,.22); }

.container { max-width: 1100px; margin: 0 auto; padding: 14px; }
#cloudStatus { display:none; padding: 8px 12px; border: 1px solid #b8d4f0; background: #eef6ff; border-radius: 6px; margin-bottom: 12px; font-size: 12px; }

.week-banner {
  background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
  padding: 12px 16px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px;
}
.week-banner .who { font-size: 17px; font-weight: 700; }
.week-banner .when { color: var(--text2); font-size: 12px; }
.week-banner .plan { font-size: 12px; color: var(--text2); }

.kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; margin-bottom: 14px; }
.kpi {
  background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px;
}
.kpi .label { font-size: 11px; text-transform: uppercase; letter-spacing: .4px; color: var(--text3); margin-bottom: 4px; }
.kpi .value { font-size: 20px; font-weight: 700; }
.kpi .sub { font-size: 11px; color: var(--text2); margin-top: 3px; }
.kpi .sub.green { color: var(--green); font-weight: 600; }
.kpi .sub.amber { color: var(--orange); font-weight: 600; }

.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 14px; overflow: hidden;
  page-break-inside: avoid;
}
.card-head {
  background: var(--red); color: #fff; padding: 8px 14px;
  display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap;
}
.card-head h2 { font-size: 13px; font-weight: 700; }
.card-head .hint { font-size: 11px; color: rgba(255,255,255,.85); }
.card-body { padding: 10px 14px; }
.card-body .empty { color: var(--text3); font-style: italic; padding: 6px 0; }

table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .3px; color: var(--text3); padding: 5px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
td { padding: 6px 8px; border-bottom: 1px solid #f0f0f2; vertical-align: top; }
tr:last-child td { border-bottom: none; }
td.num, th.num { text-align: right; white-space: nowrap; }
.client { font-weight: 600; }
.contact { font-size: 11px; color: var(--text2); }
.muted { color: var(--text3); font-size: 11px; }
.overdue { color: var(--red); font-weight: 600; }
.check-cell { text-align: center; white-space: nowrap; }
.check-cell label { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; color: var(--text2); margin: 0 4px; cursor: pointer; }
input[type=checkbox] { width: 15px; height: 15px; accent-color: var(--red); cursor: pointer; }
input[type=text].inline {
  border: 1px solid var(--border); border-radius: 4px; padding: 4px 6px; font-size: 12px; width: 100%;
}
input[type=text].short { width: 110px; }
a.pv { color: #2f6fb2; text-decoration: none; }

.footer-note { color: var(--text3); font-size: 11px; margin: 4px 0 20px; }

@media print {
  body { background: #fff; font-size: 10px; }
  .header .controls, #cloudStatus, .footer-note { display: none !important; }
  .header { background: var(--red) !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; padding: 6px 12px; }
  .header h1 { font-size: 13px; }
  .header img { height: 24px !important; }
  .card-head { -webkit-print-color-adjust: exact; print-color-adjust: exact; padding: 4px 10px; }
  .card-head h2 { font-size: 11px; }
  .card-head .hint { font-size: 9px; }
  .container { max-width: none; padding: 0; }
  .card { box-shadow: none; margin-bottom: 8px; border-radius: 4px; }
  .card-body { padding: 4px 10px; }
  th { font-size: 8px; padding: 2px 5px; }
  td { padding: 3px 5px; font-size: 10px; }
  .kpi-row { grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 8px; }
  .kpi { padding: 6px 10px; }
  .kpi .value { font-size: 15px; }
  .week-banner { padding: 6px 12px; margin-bottom: 8px; }
  .week-banner .who { font-size: 14px; }
  input[type=checkbox] { width: 12px; height: 12px; }
  input[type=text].inline { border-bottom: 1px solid #999; border-top: none; border-left: none; border-right: none; border-radius: 0; padding: 2px 4px; }
  a.pv { color: var(--text); }
  /* Print All Reps: each rep starts a fresh page, header repeats per sheet */
  .print-all .header { display: none; }
  .rep-sheet { page-break-after: always; break-after: page; }
  .rep-sheet:last-child { page-break-after: auto; break-after: auto; }
}
/* On screen, separate the stacked sheets in print-all preview */
.print-all .rep-sheet { border-bottom: 4px solid var(--red); margin-bottom: 24px; padding-bottom: 12px; }
.mini-head { display: none; }
.print-all .mini-head {
  display: flex; align-items: center; gap: 10px;
  background: var(--red); color: #fff; font-weight: 700; font-size: 13px;
  padding: 6px 12px; border-radius: 6px; margin-bottom: 8px;
  -webkit-print-color-adjust: exact; print-color-adjust: exact;
}
.print-all .mini-head img { height: 22px; border-radius: 4px; background: #fff; padding: 1px 5px; }
</style>
</head>

const COMPLETE_STATUSES = new Set(['ORDER COMPLETE - SYNC', 'Order Complete$$ - Closed - DO NOT USE']);
const isComplete = r => COMPLETE_STATUSES.has(r.status);
const QUOTED_STATUSES = new Set(['Quote', '🚀*QUOTE APPROVAL SENT', '🚀*REVISED QUOTE SENT', 'ART DECLINED']);
function stageOf(r) {

  if (QUOTED_STATUSES.has(r.status) || r.status.startsWith('Pre-Quote')) return 'quoted';
  return 'booked';

let db = null, allData = [], archivedData = [], completionStamps = {}, goalsDoc = {}, currentRep = null;

function initFirebase() {
  try {
    if (typeof firebase === 'undefined') return;
    firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.firestore();
  } catch (e) { console.error('Firebase init failed:', e); db = null; }
}

function parseISO(s) {
  if (!s || typeof s !== 'string') return null;
  const p = s.split('-');
  if (p.length !== 3) return null;
  return new Date(parseInt(p[0]), parseInt(p[1]) - 1, parseInt(p[2]));
}

// Statuses management wants flagged on every rep's sheet (pattern-matched so
// emoji prefixes and casing variations in Printavo still hit)
// Live production-pipeline statuses (from the Printavo workflow). An order in any
// of these is an active job with a real ship deadline. Matched by normalized
// substring so emoji/asterisk prefixes and minor punctuation differences still hit.
const PRODUCTION_STATUS_PATTERNS = [
  'quote approved', 'create proofs', 'create vector', 'create proof',
  'art wip', 'art - approval sent', 'art approval sent', 'revised art',
  'art on hold', 'art declined', 'art approved',
  'final sales rep review', 'send to clc', 'waiting on clc',
  'create dsts', 'preproduction', 'pre-production',
  'emb order', 'going to gsi', 'ready for production', 'sent to promo mfg',
  'in production',
];
function normStatus(s) {
  return String(s || '').toLowerCase().replace(/[^a-z0-9 ]+/g, ' ').replace(/\s+/g, ' ').trim();
}
function isProduction(r) {
  const n = normStatus(r.status);
  return PRODUCTION_STATUS_PATTERNS.some(p => n.includes(p));
}

const WATCH_STATUSES = [
  { re: /non.?term.*(payment|await)|await.*payment.*non.?term/i, label: 'Non-term awaiting payment' },
  { re: /on\s*hold/i, label: 'On hold' },
  { re: /art\s*declined/i, label: 'Art declined' },
  { re: /final\s*(sales\s*)?rep\s*review/i, label: 'Final sales rep review' },
  { re: /clc/i, label: 'Waiting on CLC approval' },
];
function watchLabel(status) {
  const hit = WATCH_STATUSES.find(w => w.re.test(status));
  return hit ? hit.label : null;
}

function deserializeData(rows) {
  return rows.map(a => {
    const parts = (a[0] || '').split('-');
    let date = null, year = 0, month = 0, quarter = 0;
    if (parts.length === 3) {
      year = parseInt(parts[0]); month = parseInt(parts[1]) - 1;
      date = new Date(year, month, parseInt(parts[2]));
      quarter = Math.floor(month / 3) + 1;
    }
    return {
      invoice_date: date, invoice_number: a[1], client_name: a[2],
      client_full_name: a[3], client_email: a[4], rep: a[5],
      total: a[6], product: a[7], status: a[8],
      customer_id: a[9] || '',
      paid: a[10] === '' || a[10] === undefined ? null : !!a[10],
      outstanding: a[11] || 0,
      term_days: a[12] || 0, payment_term: a[13] || '',
      delivery: a[14] || '', po: a[15] || '',
      pv_id: a[16] || '', ship_city: a[17] || '', ship_state: a[18] || '',
      due_date: parseISO(a[19]), created_date: parseISO(a[20]),
      prod_due_date: parseISO(a[21]),
      year, month, quarter,
    };
  }).filter(r => r.year >= 2020 && r.year <= 2030);
}

function setCloudStatus(msg, isError) {
  const bar = document.getElementById('cloudStatus');
  bar.style.display = 'block';
  bar.style.background = isError ? '#fff3f3' : '#eef6ff';
  bar.style.borderColor = isError ? '#fcc' : '#b8d4f0';
  document.getElementById('cloudStatusText').textContent = msg;
}

async function loadFromCloud() {
  if (!db) { setCloudStatus('Cloud unavailable. Open the Report Builder to check the connection.', true); return false; }
  try {
    const meta = await db.collection(CLOUD_COLLECTION).doc('meta').get();
    if (!meta.exists) { setCloudStatus('No data in the cloud yet. Upload the Printavo export on the Report Builder first.', true); return false; }
    const { chunkCount, updatedAt } = meta.data();
    const reads = [];
    for (let i = 0; i < chunkCount; i++) reads.push(db.collection(CLOUD_COLLECTION).doc('chunk_' + i).get());
    const docs = await Promise.all(reads);
    let rows = [];
    docs.forEach(d => { if (d.exists) rows = rows.concat(JSON.parse(d.data().rows)); });
    allData = deserializeData(rows);
    try {
      const adoc = await db.collection(CLOUD_COLLECTION).doc('archived').get();
      archivedData = adoc.exists ? deserializeData(JSON.parse(adoc.data().rows)) : [];
    } catch (e) { archivedData = []; }
    try {
      const cdoc = await db.collection(CLOUD_COLLECTION).doc('completions').get();
      completionStamps = cdoc.exists ? JSON.parse(cdoc.data().stamps || '{}') : {};
    } catch (e) { completionStamps = {}; }
    try {
      const gdoc = await db.collection(CLOUD_COLLECTION).doc('goals').get();
      goalsDoc = gdoc.exists ? gdoc.data() : {};
    } catch (e) { goalsDoc = {}; }
    setCloudStatus(`${allData.length.toLocaleString()} orders loaded - data updated ${new Date(updatedAt).toLocaleString()}`);
    return true;
  } catch (e) {
    console.error(e);
    setCloudStatus('Could not load from cloud: ' + e.message, true);
    return false;
  }
}

// ─── GOAL HELPERS (mirror of rep portal goals v2) ────────────────────────────
function goalSeasonalWeights(rep) {
  const base = allData.filter(r => (r.year === 2024 || r.year === 2025) && isComplete(r));
  const coMo = Array(12).fill(0);
  base.forEach(r => coMo[r.month] += r.total);
  const coTot = coMo.reduce((a,b) => a+b, 0) || 1;
  const co = coMo.map(v => v/coTot);
  const mine = base.filter(r => r.rep === rep);
  const myMo = Array(12).fill(0);
  mine.forEach(r => myMo[r.month] += r.total);
  const myTot = myMo.reduce((a,b) => a+b, 0);
  const FORCE_COMPANY_CURVE = ['Lexi Martinez'];
  if (!FORCE_COMPANY_CURVE.includes(rep) && myTot > 0 && myMo.filter(v => v > 0).length >= 8) {
    const raw = myMo.map((v,i) => 0.75*(v/myTot) + 0.25*co[i]);
    const rTot = raw.reduce((a,b) => a+b, 0);
    return raw.map(v => v/rTot);
  }
  return co;
}
function migrateGoalsEntry(entry) {
  if (!entry) return { annual: {}, months: {} };
  const num = v => typeof v === 'number' ? v : (v && (v.bkd || v.inv)) || 0;
  const annual = {}, months = {};
  if (entry.annual || entry.months) {
    Object.entries(entry.annual || {}).forEach(([y, v]) => { const n = num(v); if (n) annual[y] = n; });
    Object.entries(entry.months || {}).forEach(([k, v]) => { const n = num(v); if (n) months[k] = n; });
    return { annual, months };
  }
  Object.entries(entry).forEach(([k, v]) => {
    if (/^\d{4}-\d{2}$/.test(k) && typeof v === 'number') months[k] = v;
  });
  return { annual, months };
}
function goalTargetFor(rep, y, m) {
  const g = migrateGoalsEntry(goalsDoc[rep]);
  const key = `${y}-${String(m+1).padStart(2,'0')}`;
  if (g.months[key]) return g.months[key];
  if (g.annual[y]) return g.annual[y] * goalSeasonalWeights(rep)[m];
  return null;
}

const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function pvLink(r) {
  if (!r.pv_id) return r.invoice_number ? `#${esc(r.invoice_number)}` : '';
  return `<a class="pv" href="https://www.printavo.com/invoices/${r.pv_id}" target="_blank">#${esc(r.invoice_number)} &#8599;</a>`;
}
const daysBetween = (a, b) => Math.round((b - a) / 86400000);
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
function today0() { const t = new Date(); return new Date(t.getFullYear(), t.getMonth(), t.getDate()); }
function weekNumber(d) { return Math.floor(daysBetween(new Date(d.getFullYear(),0,1), d) / 7); }
function weekKey(d) { return `${d.getFullYear()}-W${String(weekNumber(d)).padStart(2,'0')}`; }
function rotate(arr, n) { if (!arr.length) return arr; const k = ((n % arr.length) + arr.length) % arr.length; return arr.slice(k).concat(arr.slice(0, k)); }
function contactLine(r) {
  const bits = [];
  if (r.client_full_name) bits.push(esc(r.client_full_name));
  if (r.client_email) bits.push(esc(r.client_email));
  return bits.join(' &middot; ') || '<span class="muted">no contact on file</span>';
}

// ─── CHECKBOX / INPUT PERSISTENCE (per rep, per week, this browser) ──────────
let weekState = {};

function loadWeekState() { try { weekState = JSON.parse(localStorage.getItem(stateKey()) || '{}'); } catch (e) { weekState = {}; } }
function saveWeekState() { try { localStorage.setItem(stateKey(), JSON.stringify(weekState)); } catch (e) {} }
function toggleCheck(id, el) { weekState[id] = el.checked; saveWeekState(); }
function saveText(id, el) { weekState[id] = el.value; saveWeekState(); }
const ck = id => weekState[id] ? 'checked' : '';
const tv = id => esc(weekState[id] || '');

// Stalled-quote decisions persist across weeks (per rep, this browser)
let quoteState = {};
function quoteKey() { return `toroCheatQuotes_${currentRep}`; }
function loadQuoteState() { try { quoteState = JSON.parse(localStorage.getItem(quoteKey()) || '{}'); } catch (e) { quoteState = {}; } }
function saveQuoteState() { try { localStorage.setItem(quoteKey(), JSON.stringify(quoteState)); } catch (e) {} }
function setQuoteDecision(id, decision, el) {
  quoteState[id] = el.checked ? decision : '';
  saveQuoteState();
  render(); // re-render so the paired checkbox unchecks
}
const qd = (id, decision) => quoteState[id] === decision ? 'checked' : '';

// ─── LIST BUILDERS ───────────────────────────────────────────────────────────
// Latest order (any stage) per client for this rep
function lastOrderByClient(repData) {
  const map = new Map();
  repData.forEach(r => {
    if (!r.invoice_date) return;
    const prev = map.get(r.client_name);
    if (!prev || r.invoice_date > prev.invoice_date) map.set(r.client_name, r);
  });
  return map;
}

// 1. Proactive: clients whose order LAST YEAR lands ~6 weeks from today (5-7 week window),
//    giving lead time to win the reorder. Skips clients who already ordered in the last 8 weeks.
function buildProactive(repData, t) {
  const lo = addDays(t, 35), hi = addDays(t, 49);
  const recentCut = addDays(t, -56);
  const recentClients = new Set(repData.filter(r => r.invoice_date && r.invoice_date >= recentCut && stageOf(r) !== 'quoted').map(r => r.client_name));
  const byClient = new Map();
  repData.forEach(r => {
    if (!r.invoice_date || stageOf(r) === 'quoted') return;
    const anniv = new Date(r.invoice_date.getFullYear() + 1, r.invoice_date.getMonth(), r.invoice_date.getDate());
    if (anniv < lo || anniv > hi) return;
    if (recentClients.has(r.client_name)) return;
    const prev = byClient.get(r.client_name);
    if (!prev || r.total > prev.total) byClient.set(r.client_name, r);
  });
  return [...byClient.values()].sort((a,b) => b.total - a.total);
}

// 2. Completed recently. Accuracy note: the Printavo export has no status-change
// timestamp, so we use the completion snapshot (date the Report Builder first saw
// the order finished) when available. Orders completed before snapshotting began
// have no stamp, so we fall back to invoice date for those. Window is 10 days.
function completionDate(r) {
  const key = r.pv_id || `${r.invoice_number}`;
  const stamp = completionStamps[key];
  if (stamp) { const p = stamp.split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }
  return null;
}
function buildCompletedLastWeek(repData, t) {
  const lo = addDays(t, -10);
  return repData
    .filter(r => isComplete(r))
    .map(r => ({ ...r, doneOn: completionDate(r) || r.invoice_date, stamped: !!completionDate(r) }))
    .filter(r => r.doneOn && r.doneOn > lo && r.doneOn <= t)
    .sort((a,b) => b.doneOn - a.doneOn);
}

// 3. Lost: quote-stage orders created 6-8 weeks back that never became orders
// (uses the Printavo Created Date when the export includes it; invoice date otherwise)
const originDate = r => r.created_date || r.invoice_date;
function buildLost(repData, t) {
  const lo = addDays(t, -56), hi = addDays(t, -42);
  return repData.filter(r => stageOf(r) === 'quoted' && originDate(r) && originDate(r) >= lo && originDate(r) <= hi)
    .sort((a,b) => b.total - a.total);
}

// Stuck orders: open orders (last 180 days) in a watch status, or past their due date
// Orders needing attention. Two independent flags:
//  - a watch status that stalls production (on hold, art declined, CLC, etc.)
//  - an in-progress order that has blown past its PRODUCTION due date (internal
//    shop deadline - distinct from the customer due date used for hard deadlines)
function buildStuck(repData, t) {
  const cut = addDays(t, -180);
  const out = [];
  repData.forEach(r => {
    if (isComplete(r) || !r.invoice_date || r.invoice_date < cut) return;
    const reasons = [];
    const wl = watchLabel(r.status);
    if (wl) reasons.push(wl);
    // Past production due date while still in an active production status
    if (isProduction(r) && stageOf(r) !== 'quoted' && r.prod_due_date && r.prod_due_date < t) {
      reasons.push(`${daysBetween(r.prod_due_date, t)} days past production due date`);
    }
    if (reasons.length) out.push({ ...r, reasons, prodLate: isProduction(r) && r.prod_due_date && r.prod_due_date < t });
  });
  return out.sort((a,b) => {
    if (a.prodLate !== b.prodLate) return a.prodLate ? -1 : 1;   // production-late first
    return b.total - a.total;
  });
}

// Hard deadlines: driven by the customer due date, which Printavo requires before
// a quote can start. An order is on this list when it's an active production job
// (not completed, not a quote) and its due date is within `daysAhead` or past due.
function buildDeadlines(repData, t, daysAhead) {
  const hi = addDays(t, daysAhead);
  return repData
    .filter(r => isProduction(r) && !isComplete(r) && stageOf(r) !== 'quoted' && r.due_date && r.due_date <= hi)
    .map(r => ({ ...r, daysLeft: daysBetween(t, r.due_date), hasDue: true }))
    .sort((a, b) => a.due_date - b.due_date);
}
function hasDueDates(repData) { return repData.some(r => r.due_date); }

// Stalled quotes: quote-stage orders older than 8 weeks - keep or archive?
function buildStalledQuotes(repData, t) {
  const cut = addDays(t, -56);
  return repData.filter(r => stageOf(r) === 'quoted' && originDate(r) && originDate(r) < cut)
    .sort((a,b) => originDate(a) - originDate(b));
}

// Archived quotes worth a second look: this rep's archived quotes (synced
// separately, last 18 months), skipping clients who ordered in the last 8 weeks
function buildArchivedQuotes(repData, rep, t) {
  const recentCut = addDays(t, -56);
  const recentClients = new Set(repData.filter(r => r.invoice_date && r.invoice_date >= recentCut && stageOf(r) !== 'quoted').map(r => r.client_name));
  const byClient = new Map();
  archivedData.forEach(r => {
    if (r.rep !== rep) return;
    if (recentClients.has(r.client_name)) return;
    const prev = byClient.get(r.client_name);
    if (!prev || r.total > prev.total) byClient.set(r.client_name, r);
  });
  return [...byClient.values()].sort((a,b) => b.total - a.total);
}

// 4. Reactivation: clients with completed history whose last order of any kind is 4+ months back
function buildReactivation(repData, t, excludeClients) {
  const cut = addDays(t, -120);
  const lastMap = lastOrderByClient(repData);
  const lifetime = new Map();
  repData.forEach(r => { if (isComplete(r)) lifetime.set(r.client_name, (lifetime.get(r.client_name) || 0) + r.total); });
  const out = [];
  lastMap.forEach((last, client) => {
    if (excludeClients.has(client)) return;
    if (!lifetime.has(client)) return;
    if (last.invoice_date > cut) return;
    out.push({ client, last, lifetime: lifetime.get(client) });
  });
  return out.sort((a,b) => b.lifetime - a.lifetime);
}

// 7. AR - management's rule: an invoice is only receivable when unpaid with a
// balance AND either completed (due per its Net terms) or in Non-Term Awaiting
// Payment (deposit due before production). Quotes and in-production Net-terms
// orders show "outstanding" in Printavo but nothing is owed yet.
const NTAP_RE = /non.?term.*(await|payment)/i;
const isTrueAR = r => r.paid === false && r.outstanding > 0 && (isComplete(r) || NTAP_RE.test(r.status));
function buildAR(repData, t) {
  return repData.filter(isTrueAR)
    .map(r => {
      const due = addDays(r.invoice_date, r.term_days || 0);
      return { ...r, due, daysPast: daysBetween(due, t) };
    })
    .sort((a,b) => b.daysPast - a.daysPast);
}

// ─── RENDER ──────────────────────────────────────────────────────────────────
function pickRep(rep) {
  if (!rep) return;
  currentRep = rep;
  try { localStorage.setItem('toroCheatRep', rep); } catch (e) {}
  loadWeekState();
  loadQuoteState();
  render();
}

function render() {
  document.getElementById('content').innerHTML = sheetHTML();
}

function sheetHTML() {
  const t = today0();
  const y = t.getFullYear();
  const rep = currentRep;
  const repData = allData.filter(r => r.rep === rep);
  const wk = weekNumber(t);

  // KPIs
  const completed = repData.filter(isComplete);
  const ytdComp = completed.filter(r => r.year === y);
  const ytdRevenue = ytdComp.reduce((s,r) => s + r.total, 0);
  const lyCutoff = new Date(y - 1, t.getMonth(), t.getDate(), 23, 59, 59);
  const lyYtd = completed.filter(r => r.year === y - 1 && r.invoice_date <= lyCutoff).reduce((s,r) => s + r.total, 0);
  const growthPct = lyYtd > 0 ? ((ytdRevenue - lyYtd) / lyYtd * 100) : null;
  const avgOrder = ytdComp.length ? ytdRevenue / ytdComp.length : 0;

  // Goal: annual booked goal + booked-YTD actual + pace-to-date target
  const g = migrateGoalsEntry(goalsDoc[rep]);
  const annualGoal = g.annual[y] || null;
  const hasAnyGoal = annualGoal || Object.keys(g.months).some(k => k.startsWith(y + '-'));
  const bookedYtd = repData.filter(r => r.year === y && stageOf(r) !== 'quoted').reduce((s,r) => s + r.total, 0);
  let paceTarget = null;
  if (hasAnyGoal) {
    paceTarget = 0;
    const daysInMonth = new Date(y, t.getMonth() + 1, 0).getDate();
    for (let m = 0; m <= t.getMonth(); m++) {
      const tgt = goalTargetFor(rep, y, m) || 0;
      paceTarget += m < t.getMonth() ? tgt : tgt * (t.getDate() / daysInMonth);
    }
  }
  const goalSub = !hasAnyGoal ? '<div class="sub">&ndash; no goal set (set one on your Sales Portal)</div>'
    : `<div class="sub ${bookedYtd >= paceTarget ? 'green' : 'amber'}">${$c0(bookedYtd)} booked YTD &middot; pace target ${$c0(paceTarget)}</div>`;

  // Call lists
  const proactiveAll = buildProactive(repData, t);
  const proactive = rotate(proactiveAll, wk * 5).slice(0, 5);
  const lastWeekAll = buildCompletedLastWeek(repData, t);
  const lastWeek = lastWeekAll.slice(0, 5);
  const lostAll = buildLost(repData, t);
  const lost = rotate(lostAll, wk * 3).slice(0, 3);
  const excl = new Set(proactive.map(r => r.client_name));
  const reactAll = buildReactivation(repData, t, excl);
  const react = rotate(reactAll, wk * 3).slice(0, 3);
  const archAll = buildArchivedQuotes(repData, rep, t);
  const arch = rotate(archAll, wk * 3).slice(0, 3);
  const ar = buildAR(repData, t);
  const arTotal = ar.reduce((s,r) => s + r.outstanding, 0);
  const arPastDue = ar.filter(r => r.daysPast > 0).reduce((s,r) => s + r.outstanding, 0);

  const dueDatesAvailable = hasDueDates(allData);
  const stuck = buildStuck(repData, t);
  const deadlines = buildDeadlines(repData, t, 10);
  const atRisk = deadlines.filter(r => r.daysLeft < 0).length;
  const stalledQuotes = buildStalledQuotes(repData, t);
  const undecided = stalledQuotes.filter(r => !quoteState[r.pv_id || r.invoice_number]).length;
  const dueDateNote = dueDatesAvailable ? null :
    'Customer due dates are not in the cloud data yet. Deploy the latest Report Builder and drop the Printavo export on it once - the export column is "Customer Due Date".';

  const callCount = proactive.length + lastWeek.length + lost.length + arch.length + react.length + 4;

  let html = `
  <div class="week-banner">
    <div>
      <div class="who">${esc(rep)}</div>
      <div class="when">Week of ${fdate(addDays(t, -t.getDay()))} &middot; printed ${fdate(t)}</div>
    </div>
    <div class="plan">This week's call plan: <strong>${callCount} calls</strong> &mdash; ${proactive.length} proactive &middot; ${lastWeek.length} follow-up &middot; ${lost.length} lost &middot; ${arch.length} archived &middot; ${react.length} reactivation &middot; 4 new prospects</div>
  </div>

  <div class="kpi-row">
    <div class="kpi">
      <div class="label">YTD Goal (Booked)</div>
      <div class="value">${annualGoal ? $c0(annualGoal) : '&ndash;'}</div>
      ${goalSub}
    </div>
    <div class="kpi">
      <div class="label">YTD Growth (Completed)</div>
      <div class="value">${growthPct === null ? '&ndash;' : (growthPct >= 0 ? '+' : '') + growthPct.toFixed(1) + '%'}</div>
      <div class="sub">${$c0(ytdRevenue)} vs ${$c0(lyYtd)} same time last year</div>
    </div>
    <div class="kpi">
      <div class="label">Average Sale Order</div>
      <div class="value">${$c0(avgOrder)}</div>
      <div class="sub">${ytdComp.length.toLocaleString()} completed orders in ${y}</div>
    </div>
    <div class="kpi">
      <div class="label">My Open AR</div>
      <div class="value">${$c0(arTotal)}</div>
      <div class="sub ${arPastDue > 0 ? 'amber' : 'green'}">${arPastDue > 0 ? $c0(arPastDue) + ' past due' : 'nothing past due'} &middot; ${ar.length} open invoice${ar.length === 1 ? '' : 's'}</div>
    </div>
  </div>`;

  // Hard deadlines - orders due in the next 10 days (by customer due date)
  html += card('Hard deadlines - next 10 days',
    atRisk > 0 ? `${atRisk} order${atRisk === 1 ? '' : 's'} past the customer due date - confirm firm in-hands, pickup, event, and ship dates on every row`
               : 'Confirm firm in-hands, pickup, event, and ship dates on every row',
    deadlines.length ? `<table><thead><tr><th>Client</th><th>Order</th><th>Status</th><th>Due date</th><th>Countdown</th><th class="num">Total</th><th class="check-cell">Date confirmed</th></tr></thead><tbody>${
      deadlines.map((r,i) => `<tr>
        <td class="client">${esc(r.client_name)}</td>
        <td>${pvLink(r)} <span class="muted">${esc(r.product)}</span></td>
        <td class="muted">${esc(r.status)}</td>
        <td>${fdate(r.due_date)}</td>
        <td class="${r.daysLeft <= 3 ? 'overdue' : ''}">${
          r.daysLeft < 0 ? Math.abs(r.daysLeft) + ' days PAST DUE'
          : r.daysLeft === 0 ? 'DUE TODAY'
          : r.daysLeft + ' days left'
        }</td>
        <td class="num">${$c(r.total)}</td>
        <td class="check-cell"><input type="checkbox" ${ck('dl'+i)} onchange="toggleCheck('dl${i}',this)"></td>
      </tr>`).join('')}</tbody></table>`
    : null, dueDateNote || 'No production orders due in the next ten days.');

  // Orders needing attention (watch statuses + past production due date)
  const prodLateCount = stuck.filter(r => r.prodLate).length;
  html += card('Orders needing attention',
    'Open orders stalled in a flagged status, or in production past their production due date, from the last six months'
      + (prodLateCount > 0 ? ` - ${prodLateCount} past the production due date` : ''),
    stuck.length ? `<table><thead><tr><th>Client</th><th>Order</th><th>Order date</th><th>Prod due</th><th>Status</th><th>Why it is flagged</th><th class="num">Total</th><th class="check-cell">Handled</th></tr></thead><tbody>${
      stuck.slice(0, 25).map((r,i) => `<tr>
        <td class="client">${esc(r.client_name)}</td>
        <td>${pvLink(r)} <span class="muted">${esc(r.product)}</span></td>
        <td>${fdate(r.invoice_date)}</td>
        <td class="${r.prodLate ? 'overdue' : 'muted'}">${r.prod_due_date ? fdate(r.prod_due_date) : '-'}</td>
        <td class="muted">${esc(r.status)}</td>
        <td class="overdue">${r.reasons.map(esc).join(' &middot; ')}</td>
        <td class="num">${$c(r.total)}</td>
        <td class="check-cell"><input type="checkbox" ${ck('stk'+i)} onchange="toggleCheck('stk${i}',this)"></td>
      </tr>`).join('')}</tbody></table>${stuck.length > 25 ? `<div class="muted" style="padding:6px 0;">Showing the top 25 of ${stuck.length} - clear these first.</div>` : ''}`
    : null, 'Nothing needs attention - no stalled orders and nothing past its production due date.');

  // 1. Proactive
  html += card('1. Proactive reorder calls', `Clients who ordered around this time last year - their reorder window opens in about six weeks (${proactiveAll.length} eligible)`,
    proactive.length ? `<table><thead><tr><th>Client</th><th>Contact</th><th>Last year's order</th><th class="num">Total</th><th class="check-cell">Called</th></tr></thead><tbody>${
      proactive.map((r,i) => `<tr>
        <td class="client">${esc(r.client_name)}</td>
        <td class="contact">${contactLine(r)}</td>
        <td>${fdate(r.invoice_date)} &middot; ${pvLink(r)} <span class="muted">${esc(r.product)}</span></td>
        <td class="num">${$c(r.total)}</td>
        <td class="check-cell"><input type="checkbox" ${ck('pro'+i)} onchange="toggleCheck('pro${i}',this)"></td>
      </tr>`).join('')}</tbody></table>`
    : null, 'No orders from last year land in the six-week window right now.');

  // 2. Completed last week
  const lastWeekEstimated = lastWeek.some(r => !r.stamped);
  html += card('2. Follow-up calls - orders completed in the last 10 days', 'Ask for a referral, ask for a review, and set a date to circle back for the next order',
    lastWeek.length ? `<table><thead><tr><th>Client</th><th>Contact</th><th>Completed</th><th>Order</th><th class="num">Total</th><th class="check-cell">Referral</th><th class="check-cell">Review</th><th>Circle back on</th></tr></thead><tbody>${
      lastWeek.map((r,i) => `<tr>
        <td class="client">${esc(r.client_name)}</td>
        <td class="contact">${contactLine(r)}</td>
        <td>${fdate(r.doneOn)}${r.stamped ? '' : ' <span class="muted">(est.)</span>'}</td>
        <td>${pvLink(r)} <span class="muted">${esc(r.product)}</span></td>
        <td class="num">${$c(r.total)}</td>
        <td class="check-cell"><input type="checkbox" ${ck('ref'+i)} onchange="toggleCheck('ref${i}',this)"></td>
        <td class="check-cell"><input type="checkbox" ${ck('rev'+i)} onchange="toggleCheck('rev${i}',this)"></td>
        <td><input type="text" class="inline short" placeholder="date" value="${tv('cb'+i)}" onchange="saveText('cb${i}',this)"></td>
      </tr>`).join('')}</tbody></table>${lastWeekEstimated ? '<div class="muted" style="padding:6px 0;">Dates marked (est.) use the invoice date - these orders completed before completion tracking began. New orders show the true completion date going forward.</div>' : ''}`
    : null, 'No orders completed in the last ten days.');

  // 3. Lost
  html += card('3. Lost orders to win back', `Quotes from six to eight weeks ago that never became orders (${lostAll.length} in the window)`,
    lost.length ? `<table><thead><tr><th>Client</th><th>Contact</th><th>Quote</th><th>Status</th><th class="num">Value</th><th class="check-cell">Called</th></tr></thead><tbody>${
      lost.map((r,i) => `<tr>
        <td class="client">${esc(r.client_name)}</td>
        <td class="contact">${contactLine(r)}</td>
        <td>${fdate(r.invoice_date)} &middot; ${pvLink(r)} <span class="muted">${esc(r.product)}</span></td>
        <td class="muted">${esc(r.status)}</td>
        <td class="num">${$c(r.total)}</td>
        <td class="check-cell"><input type="checkbox" ${ck('lost'+i)} onchange="toggleCheck('lost${i}',this)"></td>
      </tr>`).join('')}</tbody></table>`
    : null, 'No open quotes from the six-to-eight-week window.');

  // 4. Archived quotes worth a second look
  html += card('4. Archived quotes worth a second look', `Quotes archived in Printavo over the last 18 months - was the door really closed? (${archAll.length} eligible)`,
    arch.length ? `<table><thead><tr><th>Client</th><th>Contact</th><th>Quote</th><th>Status when archived</th><th class="num">Value</th><th class="check-cell">Called</th></tr></thead><tbody>${
      arch.map((r,i) => `<tr>
        <td class="client">${esc(r.client_name)}</td>
        <td class="contact">${contactLine(r)}</td>
        <td>${fdate(originDate(r))} &middot; ${pvLink(r)} <span class="muted">${esc(r.product)}</span></td>
        <td class="muted">${esc(r.status)}</td>
        <td class="num">${$c(r.total)}</td>
        <td class="check-cell"><input type="checkbox" ${ck('arc'+i)} onchange="toggleCheck('arc${i}',this)"></td>
      </tr>`).join('')}</tbody></table>`
    : null, archivedData.length ? 'No archived quotes to revisit - or every archived client has ordered recently.'
                                : 'Archived quotes are not in the cloud yet. Deploy Report Builder v2.4 and drop the export on it once - archives sync automatically from then on.');

  // 5. Reactivation
  html += card('5. Reactivation calls', `Past customers with no order in the last four months (${reactAll.length} eligible)`,

      react.map((x,i) => `<tr>

        <td class="num">${$c0(x.lifetime)}</td>
        <td class="check-cell"><input type="checkbox" ${ck('rea'+i)} onchange="toggleCheck('rea${i}',this)"></td>
      </tr>`).join('')}</tbody></table>`
    : null, 'Every client has ordered within the last four months.');

  // 5. New prospects (blank - filled in by the rep)
  html += card('6. New ideal-client prospect calls', 'Four new prospects that fit the ideal client profile - write them in',
    `<table><thead><tr><th style="width:24%">Company</th><th style="width:24%">Contact</th><th>Notes / next step</th><th class="check-cell">Called</th></tr></thead><tbody>${
      [0,1,2,3].map(i => `<tr>
        <td><input type="text" class="inline" value="${tv('pcN'+i)}" onchange="saveText('pcN${i}',this)"></td>
        <td><input type="text" class="inline" value="${tv('pcC'+i)}" onchange="saveText('pcC${i}',this)"></td>
        <td><input type="text" class="inline" value="${tv('pcX'+i)}" onchange="saveText('pcX${i}',this)"></td>
        <td class="check-cell"><input type="checkbox" ${ck('pc'+i)} onchange="toggleCheck('pc${i}',this)"></td>
      </tr>`).join('')}</tbody></table>`);

  // Stalled quotes - keep the pipeline clean
  html += card('Stalled quotes - keep or archive?',
    `Quotes older than eight weeks that never moved (${stalledQuotes.length} total, ${undecided} undecided) - revisit the live ones, archive the dead ones in Printavo`,
    stalledQuotes.length ? `<table><thead><tr><th>Client</th><th>Quote</th><th>Quote date</th><th>Age</th><th>Status</th><th class="num">Value</th><th class="check-cell">Revisit</th><th class="check-cell">Archive</th></tr></thead><tbody>${
      stalledQuotes.slice(0, 25).map(r => { const id = r.pv_id || r.invoice_number; return `<tr>
        <td class="client">${esc(r.client_name)}</td>
        <td>${pvLink(r)} <span class="muted">${esc(r.product)}</span></td>
        <td>${fdate(originDate(r))}</td>
        <td class="muted">${Math.round(daysBetween(originDate(r), t) / 7)} wks</td>
        <td class="muted">${esc(r.status)}</td>
        <td class="num">${$c(r.total)}</td>
        <td class="check-cell"><input type="checkbox" ${qd(id,'keep')} onchange="setQuoteDecision('${esc(id)}','keep',this)"></td>
        <td class="check-cell"><input type="checkbox" ${qd(id,'archive')} onchange="setQuoteDecision('${esc(id)}','archive',this)"></td>
      </tr>`; }).join('')}</tbody></table>${stalledQuotes.length > 25 ? `<div class="muted" style="padding:6px 0;">Showing the oldest 25 of ${stalledQuotes.length}.</div>` : ''}
      <div class="muted" style="padding:6px 0;">Marking Archive here records the decision - the quote still needs its status changed to an archive status in Printavo, which removes it from all reports on the next upload. Decisions carry over week to week.</div>`
    : null, 'No stalled quotes - the pipeline is clean.');

  // 6. AR
  html += card('7. My invoices currently due', `Truly due only: completed orders per terms + deposits awaiting payment - ${$c(arTotal)} outstanding`,
    ar.length ? `<table><thead><tr><th>Client</th><th>Invoice</th><th>Invoice date</th><th>Terms</th><th>Due</th><th>Aging</th><th class="num">Outstanding</th></tr></thead><tbody>${
      ar.map(r => `<tr>
        <td class="client">${esc(r.client_name)}</td>
        <td>${pvLink(r)}</td>
        <td>${fdate(r.invoice_date)}</td>
        <td class="muted">${esc(r.payment_term) || (r.term_days ? r.term_days + ' days' : 'Due on receipt')}</td>
        <td>${fdate(r.due)}</td>
        <td class="${r.daysPast > 0 ? 'overdue' : 'muted'}">${r.daysPast > 0 ? r.daysPast + ' days past due' : 'not yet due'}</td>
        <td class="num">${$c(r.outstanding)}</td>
      </tr>`).join('')}</tbody></table>`
    : null, 'No open invoices - everything is paid.');

  html += `<div class="footer-note">Revenue and growth use completed orders only, matching every other TORO report. Goals are booked goals set by each rep on their Sales Portal. Lost orders and stalled quotes are aged by Printavo's Created Date when the export includes it, otherwise by invoice date. Invoices due counts only money truly owed: completed orders (due per their payment terms) and Non-Term Awaiting Payment orders (deposit due before production) - quotes and in-production Net orders are excluded even though Printavo shows an outstanding amount on them. Archived quotes sync separately and never touch revenue reports. Checkmarks and notes save in this browser for the current week; stalled-quote decisions carry over.</div>`;

  return html;
}

// ─── PRINT ALL REPS (one page per rep) ───────────────────────────────────────
// All eight reps print in the batch. Abby and Kimberly aren't commission reps, but
// their sales data counts and Stephen wants their weekly sheets printed too.
const SALES_REPS = ['Abby Mendez','Amy Smith','Debra Guerra','Julia Howorth','Kimberly Black','Lexi Martinez','Shannon Bull','Stephen Rios'];
let restorePending = false;
function printAll() {
  if (!allData.length) return;
  const saveRep = currentRep;
  let out = '';
  SALES_REPS.forEach(r => {
    currentRep = r;
    loadWeekState();
    loadQuoteState();
    const logo = document.querySelector('.header img') ? document.querySelector('.header img').src : '';
    out += `<div class="rep-sheet"><div class="mini-head">${logo ? `<img src="${logo}" alt="TORO">` : ''} Weekly Rep Cheat Sheet</div>${sheetHTML()}</div>`;
  });
  document.body.classList.add('print-all');
  document.getElementById('content').innerHTML = out;
  restorePending = true;
  const restore = () => {
    if (!restorePending) return;
    restorePending = false;
    document.body.classList.remove('print-all');
    currentRep = saveRep;
    if (currentRep) { loadWeekState(); loadQuoteState(); render(); }
    else document.getElementById('content').innerHTML = `<div class="card"><div class="card-body">Select your name in the top right to build this week's cheat sheet.</div></div>`;
  };
  window.onafterprint = restore;
  setTimeout(() => { window.print(); setTimeout(restore, 1000); }, 60);
}

function card(title, hint, body, emptyMsg) {
  return `<div class="card">
    <div class="card-head"><h2>${title}</h2><span class="hint">${hint}</span></div>
    <div class="card-body">${body || `<div class="empty">${emptyMsg}</div>`}</div>
  </div>`;
}

// ─── INIT ────────────────────────────────────────────────────────────────────
async function init() {
  const pick = document.getElementById('repPick');
  VALID_REPS.forEach(r => {
    const o = document.createElement('option');
    o.value = r; o.textContent = r;
    pick.appendChild(o);
  });

  initFirebase();
  const ok = await loadFromCloud();
  if (!ok) { document.getElementById('content').innerHTML = ''; return; }

  const param = new URLSearchParams(location.search).get('rep');
  let remembered = null;
  try { remembered = localStorage.getItem('toroCheatRep'); } catch (e) {}
  const start = VALID_REPS.find(r => r === param) || VALID_REPS.find(r => r === remembered);
  if (start) {
    pick.value = start;
    pickRep(start);
  } else {
    document.getElementById('content').innerHTML = `<div class="card"><div class="card-body">Select your name in the top right to build this week's cheat sheet.</div></div>`;
  }
}
init();
</script>

</html>
