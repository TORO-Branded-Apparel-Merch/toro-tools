<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TORO Management Dashboard</title>
<style>
:root{
  --red:#BC112A;--red-dark:#9e0f22;--red-light:#fff0f2;
  --green:#1a7f4b;--green-bg:#e8f5ee;
  --orange:#C46A1E;
  --bg:#F5F5F7;--surface:#fff;--border:#E2E3E6;
  --text:#1a1a1f;--text2:#444;--text3:#888;
  --radius:10px;--radius-sm:6px;--border2:#ccc;--brown:#7B3F00;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
#gate{position:fixed;inset:0;background:#fff;display:flex;align-items:center;justify-content:center;z-index:10000;}
.gate-box{background:#fff;border:1px solid var(--border);border-radius:12px;padding:40px 36px;max-width:380px;width:90%;text-align:center;box-shadow:0 4px 24px rgba(0,0,0,0.08);}
.gate-box p{font-size:14px;color:var(--text3);margin-bottom:24px;}
.gate-box input{width:100%;padding:11px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:15px;margin-bottom:14px;}
.gate-box input:focus{outline:none;border-color:var(--red);}
.gate-box button{width:100%;padding:11px;background:var(--red);color:#fff;border:none;border-radius:var(--radius-sm);font-size:15px;font-weight:600;cursor:pointer;}
.gate-box .error{color:var(--red);font-size:13px;margin-top:8px;min-height:18px;}
.header{background:var(--red-gradient,linear-gradient(160deg,#BC112A 0%,#E9553A 100%));color:#fff;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,0.15);}
.header .hdr-right{display:flex;gap:10px;align-items:center;}
.hdr-btn{padding:6px 14px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;cursor:pointer;border:none;}
.tabs{background:#fff;border-bottom:1px solid var(--border);padding:0 20px;display:flex;gap:0;overflow-x:auto;}
.tab{padding:12px 18px;font-size:14px;font-weight:600;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;color:var(--text3);transition:all .15s;display:flex;align-items:center;gap:6px;}
.tab:hover{color:var(--red);}
.tab.active{color:var(--red);border-bottom-color:var(--red);}
.badge{background:var(--red);color:#fff;border-radius:10px;padding:1px 7px;font-size:11px;font-weight:700;}
.container{max-width:1100px;margin:0 auto;padding:20px 16px;}
.summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:24px;}
.summary-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;text-align:center;}
.summary-card .sc-val{font-size:24px;font-weight:700;color:var(--red);}
.summary-card .sc-lbl{font-size:12px;color:var(--text3);margin-top:4px;}
.rep-section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:20px;overflow:hidden;}
.rep-header{padding:14px 18px;background:#f8f8fa;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.rep-header h3{font-size:16px;font-weight:700;}
.rep-body{padding:12px 18px;}
.quote-row{display:grid;grid-template-columns:28px 2fr 1fr 1fr 1fr 1fr 1fr 1fr 60px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid #f5f5f5;font-size:13px;}
.quote-row-plain{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr 1fr 1fr 60px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid #f5f5f5;font-size:13px;}
.quote-row-plain:last-child{border-bottom:none;}
.bulk-bar{display:none;position:sticky;top:44px;z-index:90;background:#1e293b;color:#fff;padding:10px 16px;border-radius:8px;margin-bottom:12px;align-items:center;gap:10px;flex-wrap:wrap;}
.bulk-bar.active{display:flex;}
.bulk-bar-count{font-size:13px;font-weight:700;flex:1;}
.bulk-btn{padding:7px 14px;border:none;border-radius:6px;cursor:pointer;font-size:12px;font-weight:700;font-family:inherit;}
.quote-row:last-child{border-bottom:none;}
.th{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;}
.totals-row{padding:10px 0;font-size:13px;text-align:right;border-top:2px solid var(--border);margin-top:4px;}
.margin-badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;font-weight:700;}
.margin-ok{background:var(--green-bg);color:var(--green);}
.margin-low{background:#fff3e0;color:var(--orange);}
.margin-warn{background:var(--red-light);color:var(--red);}
.paid-indicator{display:inline-block;background:var(--green-bg);color:var(--green);padding:2px 10px;border-radius:10px;font-size:12px;font-weight:700;}
.btn{padding:8px 16px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all .15s;}
.btn-red{background:var(--red);color:#fff;}
.btn-green{background:var(--green);color:#fff;}
.btn-gray{background:#f0f0f0;color:var(--text2);border:1px solid var(--border);}
.btn-sm{padding:5px 11px;font-size:12px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px;}
#bam-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:9999;align-items:center;justify-content:center;}
#bam-overlay.open{display:flex;}
.sync-dot{width:8px;height:8px;border-radius:50%;background:#1a7f4b;display:inline-block;margin-right:6px;}
.sync-dot.syncing{background:#ffd54f;animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
.low-margin-note{background:#fff8e1;border-left:4px solid #ffd54f;padding:6px 10px;font-size:12px;color:#b8860b;margin-bottom:6px;border-radius:0 4px 4px 0;}
@media(max-width:700px){.quote-row{grid-template-columns:1fr 1fr;}}
</style>
</head>

function bamAlert(msg, cb) {
  document.getElementById('bam-msg').innerHTML = msg;
  const btns = document.getElementById('bam-btns');
  btns.innerHTML = '';
  const ok = document.createElement('button');
  ok.textContent = 'OK';
  ok.style.cssText = 'padding:8px 22px;background:#BC112A;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:14px;font-weight:600;';
  ok.onclick = () => { document.getElementById('bam-overlay').classList.remove('open'); if(cb) Promise.resolve(cb(true)).catch(e=>{ console.error('Action error:',e); bamAlert('Error: '+e.message); }); };
  btns.appendChild(ok);
  document.getElementById('bam-overlay').classList.add('open');
}
function bamConfirm(msg, cb) {
  document.getElementById('bam-msg').innerHTML = msg;
  const btns = document.getElementById('bam-btns');
  btns.innerHTML = '';
  const cancel = document.createElement('button');
  cancel.textContent = 'Cancel';
  cancel.style.cssText = 'padding:8px 18px;background:#f0f0f0;color:#333;border:none;border-radius:6px;cursor:pointer;font-size:14px;';
  cancel.onclick = () => { document.getElementById('bam-overlay').classList.remove('open'); if(cb) cb(false); };
  const ok = document.createElement('button');
  ok.textContent = 'Yes, continue';
  ok.style.cssText = 'padding:8px 18px;background:#BC112A;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:14px;font-weight:600;';
  ok.onclick = () => { document.getElementById('bam-overlay').classList.remove('open'); if(cb) Promise.resolve(cb(true)).catch(e=>{ console.error('Action error:',e); bamAlert('Error: '+e.message); }); };
  btns.appendChild(cancel);
  btns.appendChild(ok);
  document.getElementById('bam-overlay').classList.add('open');
}

function submitPw() {
  if(localStorage.getItem(LOCK_KEY)) { document.getElementById('pw-error').textContent='Account locked. Contact management.'; return; }
  const val = document.getElementById('pw-input').value;
  const attempts = parseInt(localStorage.getItem(ATTEMPTS_KEY)||'0');
  if(val === DASH_PW) {
    localStorage.removeItem(ATTEMPTS_KEY);
    localStorage.setItem('toro_session_dash', Date.now()+(4*60*60*1000));
    document.getElementById('gate').style.display='none';
    document.getElementById('app').style.display='';
    document.getElementById('version-label').textContent = DASH_VERSION;
    init();
  } else {
    const n=attempts+1;
    localStorage.setItem(ATTEMPTS_KEY,n);
    if(n>=5) { localStorage.setItem(LOCK_KEY,'1'); document.getElementById('pw-error').textContent='Account locked after 5 failed attempts.'; }
    else document.getElementById('pw-error').textContent=`Incorrect. ${5-n} attempt(s) remaining.`;
  }
}
document.getElementById('pw-input').addEventListener('keydown', e=>{ if(e.key==='Enter') submitPw(); });

// ── Firebase ───────────────────────────────────────────────────────────────
function fbSet(path, val) {
  const url = FIREBASE_DB_URL + '/' + path + '.json';
  const method = val === null ? 'DELETE' : 'PUT';
  const xhr = new XMLHttpRequest();
  xhr.open(method, url, true);
  xhr.setRequestHeader('Content-Type','application/json');
  xhr.onreadystatechange = () => {
    if(xhr.readyState !== 4) return;
    console.log('fbSet',method,path,'->',xhr.status);
    if(xhr.status < 200 || xhr.status >= 300) console.error('fbSet failed:', xhr.status, xhr.responseText);
  };
  xhr.onerror = () => console.error('fbSet network error:', path);
  xhr.send(val === null ? null : JSON.stringify(val));
}
function fbDel(path) { fbSet(path, null); }
function fbPatch(path, val) {
  const url = FIREBASE_DB_URL + '/' + path + '.json';
  const xhr = new XMLHttpRequest();
  xhr.open('PATCH', url, true);
  xhr.setRequestHeader('Content-Type','application/json');
  xhr.onreadystatechange = () => { if(xhr.readyState===4 && xhr.status>=300) console.error('fbPatch failed:', path, xhr.status); };
  xhr.send(JSON.stringify(val));
}
function fbGet(path) {
  return new Promise((resolve) => {
    const xhr = new XMLHttpRequest();
    xhr.open('GET', FIREBASE_DB_URL+'/'+path+'.json?timeout=10s', true);
    xhr.timeout = 12000;
    xhr.onreadystatechange = () => {
      if(xhr.readyState !== 4) return;
      if(xhr.status === 200) {
        try { resolve(JSON.parse(xhr.responseText)); }
        catch(e) { console.warn('fbGet parse error:',e.message); resolve(null); }
      } else {
        console.warn('fbGet failed:', xhr.status);
        resolve(null);
      }
    };
    xhr.onerror = () => { console.warn('fbGet network error'); resolve(null); };
    xhr.ontimeout = () => { console.warn('fbGet timeout'); resolve(null); };
    xhr.send();
  });
}
function fbListen(path, cb) {
  const es = new EventSource(FIREBASE_DB_URL + '/' + path + '.json');
  const handler = e => { try { cb(JSON.parse(e.data)); } catch(err) { console.error('fbListen parse error', err); } };
  es.addEventListener('put', handler);
  es.addEventListener('patch', handler);
  es.onerror = err => console.error('fbListen error', path, err);
  return es;
}
function fbKey(q) {
  if(q._fbKey) return q._fbKey;
  const raw = q.quoteNum || ('idx_' + Date.now());
  return raw.replace(/[.#$\/\[\]\s]/g, '_');
}
function quoteTotal(q, type) {
  if(type==='sell') return parseFloat(q.totalSell)||parseFloat(q.sell)||0;
  if(type==='net') return parseFloat(q.totalNetCost)||parseFloat(q.net)||0;
  return 0;
}
function quoteComm(q) {
  // Always recalculate from first principles -- don't trust stored totalRepComm
  // (older quotes may have been calculated with incorrect HO/low-margin math)
  const sell=quoteTotal(q,'sell'), net=quoteTotal(q,'net'), gp=sell-net;
  if(sell<=0||gp<=0) return 0;
  const margin=(gp/sell)*100;
  const split=q.commissionSplit||q.split||'standard';
  const repFrac=split==='ho_75_25'?0.25:split==='ho_50_50'?0.50:split==='ho_25_75'?0.75:1.0;
  const hasAM=q.hasAM||false;
  const AM_RATE=0.06;
  if(margin<30) {
    const houseFloor=sell*0.15;
    const repBase=gp-houseFloor;
    if(repBase<=0) return 0;
    const amEarns=hasAM?repBase*AM_RATE:0;
    return (repBase-amEarns)*repFrac;
  } else {
    const repOriginal=gp*0.50;
    const amEarns=hasAM?repOriginal*AM_RATE:0;
    return (repOriginal-amEarns)*repFrac;
  }
}
function marginBadge(net, sell) {
  if(!sell) return '';
  const m=(sell-net)/sell*100;
  const cls=m>=30?'margin-ok':m>=20?'margin-low':'margin-warn';
  return `<span class="margin-badge ${cls}">${m.toFixed(1)}%</span>`;
}
function setSyncing(on) {
  const dot=document.getElementById('sync-dot'), lbl=document.getElementById('sync-label');
  if(dot) dot.classList.toggle('syncing',on);
  if(lbl) lbl.textContent=on?'Syncing...':'Live';
}

// ── Load & Listeners ──────────────────────────────────────────────────────
async function init() {
  setSyncing(true);
  startListeners(); // start SSE first — it delivers initial data
  loadAll();        // non-blocking GET as backup
  await loadFeedback();
  render();
  setSyncing(false);
}

async function loadAll() {
  const STATUS_RANK = {active:0,readyForSubmission:1,submittedCommission:2,submitted:2,approvedForPayment:3,paid:4};
  for(const rep of REPS) {
    try {
      const data = await fbGet('quotes/' + rep.toLowerCase());
      if(data && typeof data==='object') {
        const incoming = Object.entries(data)
          .filter(([k,v])=>v&&typeof v==='object'&&v!==null)
          .map(([k,v])=>{
            const q={...v, _fbKey:k};
            if(!q.workflowStatus) q.workflowStatus='active';
            return q;
          });
        // Never downgrade status already set by SSE or dashboard action
        incoming.forEach(iq => {
          const existing = (allQuotes[rep]||[]).find(q=>q._fbKey===iq._fbKey);
          if(existing) {
            const fbRank = STATUS_RANK[iq.workflowStatus]||0;
            const localRank = STATUS_RANK[existing.workflowStatus]||0;
            if(localRank > fbRank) iq.workflowStatus = existing.workflowStatus;
            if(existing.issueFlag && !iq.issueFlag) iq.issueFlag = existing.issueFlag;
          }
        });
        allQuotes[rep] = incoming;
        console.log('loadAll',rep,allQuotes[rep].length,'quotes');
      } else {
        if(!allQuotes[rep]) allQuotes[rep] = [];
        console.log('loadAll',rep,'no data or timeout');
      }
    } catch(e) { if(!allQuotes[rep]) allQuotes[rep]=[]; console.error('loadAll error',rep,e); }
  }
  render();
}

function startListeners() {
  for(const rep of REPS) {
    const rl = rep.toLowerCase();
    fbListen('quotes/'+rl, data => {
      if(!data) return;
      console.log('DASH SSE ['+rep+']:', JSON.stringify({path:data.path, dataType:typeof data.data, saving:_dashSaving}));
      if(_dashSaving) { console.log('DASH SSE: skipped (saving)'); return; } // ignore echo-back during active write
      if(data.path && data.path !== '/' && data.data !== undefined) {
        const parts = data.path.replace(/^\//, '').split('/');
        const key = parts[0];
        const field = parts[1];
        if(!allQuotes[rep]) allQuotes[rep] = [];
        if(data.data === null && !field) {
          allQuotes[rep] = allQuotes[rep].filter(q=>q._fbKey!==key);
        } else if(field) {
          // Field-level update (e.g. workflowStatus, issueFlag)
          const idx = allQuotes[rep].findIndex(q=>q._fbKey===key);
          if(idx >= 0) {
            const STATUS_RANK = {active:0,readyForSubmission:1,submittedCommission:2,submitted:2,approvedForPayment:3,paid:4};
            // Only apply if not a downgrade
            if(field === 'workflowStatus') {
              const fbRank = STATUS_RANK[data.data]||0;
              const localRank = STATUS_RANK[allQuotes[rep][idx].workflowStatus]||0;
              if(fbRank >= localRank) allQuotes[rep][idx][field] = data.data;
            } else {
              allQuotes[rep][idx][field] = data.data;
            }
          }
        } else if(data.data && typeof data.data === 'object') {
          // Full quote object update
          const STATUS_RANK = {active:0,readyForSubmission:1,submittedCommission:2,submitted:2,approvedForPayment:3,paid:4};
          const idx = allQuotes[rep].findIndex(q=>q._fbKey===key);
          const q = {...data.data, _fbKey:key};
          if(!q.workflowStatus) q.workflowStatus='active';
          if(idx>=0) {
            const existing = allQuotes[rep][idx];
            const fbRank = STATUS_RANK[q.workflowStatus]||0;
            const localRank = STATUS_RANK[existing.workflowStatus]||0;
            if(localRank > fbRank) q.workflowStatus = existing.workflowStatus;
            if(existing.issueFlag && !q.issueFlag) q.issueFlag = existing.issueFlag;
            allQuotes[rep][idx]=q;
          } else allQuotes[rep].push(q);
        }
      } else if(data.data && typeof data.data==='object') {
        // Full snapshot — trust Firebase but never downgrade a status Stephen set
        const STATUS_RANK = {active:0,readyForSubmission:1,submittedCommission:2,submitted:2,approvedForPayment:3,paid:4};
        const incoming = Object.entries(data.data)
          .filter(([k,v])=>v&&typeof v==='object')
          .map(([k,v])=>{ const q={...v, _fbKey:k}; if(!q.workflowStatus) q.workflowStatus='active'; return q; });
        incoming.forEach(iq => {
          const existing = (allQuotes[rep]||[]).find(q=>q._fbKey===iq._fbKey);
          if(existing) {
            const fbRank = STATUS_RANK[iq.workflowStatus]||0;
            const localRank = STATUS_RANK[existing.workflowStatus]||0;
            if(localRank > fbRank) {
              iq.workflowStatus = existing.workflowStatus;
            }
            if(existing.issueFlag && !iq.issueFlag) iq.issueFlag = existing.issueFlag;
          }
        });
        allQuotes[rep] = incoming;
      } else if(data.data===null) {
        allQuotes[rep]=[];
      }
      render();
    });
  }
  fbListen('feedback', data => {
    // data.data === null means the whole feedback node was deleted or is empty
    if(data && data.data === null) {
      feedbackData = {};
    } else if(data && data.data && typeof data.data==='object') {
      // Merge: keep local deletions by only updating keys that still exist in Firebase
      // and filter out any nulls Firebase streams during propagation
      const incoming = Object.fromEntries(Object.entries(data.data).filter(([,v])=>v!==null));
      // Only add/update keys — never restore a key we already deleted locally
      Object.keys(incoming).forEach(k => {
        if(feedbackData[k] !== undefined || !feedbackData.hasOwnProperty) {
          feedbackData[k] = incoming[k];
        }
      });
      // Also ensure any keys not in incoming are removed
      Object.keys(feedbackData).forEach(k => {
        if(!incoming[k]) delete feedbackData[k];
      });
    } else {
      return; // ignore malformed events
    }
    const unread=Object.values(feedbackData).filter(f=>!f.read).length;
    const badge=document.getElementById('feedback-badge');
    if(badge){badge.style.display=unread?'':'none';badge.textContent=unread;}
    if(currentTab==='feedback') renderFeedback();
  });
}

function switchTab(tab) {
  currentTab = tab;
  ['commission','by-rep','all','feedback'].forEach(t=>{
    const el = document.getElementById('tab-'+t);
    if(el) el.classList.toggle('active', t===tab);
  });
  render();
}

function render() {
  renderSummary();
  if(currentTab==='commission') renderCommission();
  else if(currentTab==='by-rep') renderByRep();
  else if(currentTab==='feedback') renderFeedback();
  else renderAll();
}

function renderSummary() {
  let totalQuotes=0, totalSell=0, totalComm=0, lowMarginCount=0;
  for(const rep of REPS) {
    const qs = allQuotes[rep]||[];
    totalQuotes+=qs.length;
    qs.forEach(q=>{
      const sell=quoteTotal(q,'sell'), net=quoteTotal(q,'net');
      totalSell+=sell;
      totalComm+=quoteComm(q);
      const margin=sell>0?((sell-net)/sell*100):100;
      if(margin>0&&margin<30) lowMarginCount++;
    });
  }
  document.getElementById('summary-grid').innerHTML =
    `<div class="summary-card"><div class="sc-val">${totalQuotes}</div><div class="sc-lbl">Total Quotes</div></div>`+
    `<div class="summary-card"><div class="sc-val" style="color:var(--orange)">${lowMarginCount}</div><div class="sc-lbl">Low Margin (&lt;30%)</div></div>`+
    `<div class="summary-card"><div class="sc-val">$${totalSell.toFixed(0)}</div><div class="sc-lbl">Total Pipeline</div></div>`+
    `<div class="summary-card"><div class="sc-val">$${totalComm.toFixed(0)}</div><div class="sc-lbl">Est. Total Commission</div></div>`;
}

function switchCommView(view) {
  commissionView = view;
  selectedKeys.clear();
  renderCommission();
}

function toggleRowSelect(repKey) {
  if(selectedKeys.has(repKey)) selectedKeys.delete(repKey);
  else selectedKeys.add(repKey);
  updateBulkBar();
}

function toggleSelectAll(checked) {
  const checkboxes = document.querySelectorAll('.row-chk');
  checkboxes.forEach(cb => {
    cb.checked = checked;
    if(checked) selectedKeys.add(cb.dataset.key);
    else selectedKeys.delete(cb.dataset.key);
  });
  updateBulkBar();
}

function updateBulkBar() {
  const bar = document.getElementById('bulk-bar');
  const count = document.getElementById('bulk-count');
  if(!bar) return;
  if(selectedKeys.size > 0) {
    bar.classList.add('active');
    count.textContent = selectedKeys.size + ' selected';
  } else {
    bar.classList.remove('active');
  }
}

function bulkConfirmThen(action, msg, fn) {
  if(bulkSkipConfirm) { fn(); return; }
  // Custom confirm with "don't ask again" option
  const overlay = document.getElementById('bam-overlay');
  document.getElementById('bam-msg').innerHTML = msg +
    `<div style="margin-top:14px;"><label style="display:flex;align-items:center;gap:8px;font-size:12px;color:#888;cursor:pointer;">
      <input type="checkbox" id="bulk-skip-chk" style="width:14px;height:14px;">
      Don't ask me again this session
    </label></div>`;
  const btns = document.getElementById('bam-btns');
  btns.innerHTML = '';
  const cancel = document.createElement('button');
  cancel.textContent = 'Cancel';
  cancel.style.cssText = 'padding:8px 18px;background:#f0f0f0;color:#333;border:none;border-radius:6px;cursor:pointer;font-size:14px;';
  cancel.onclick = () => { overlay.classList.remove('open'); };
  const ok = document.createElement('button');
  ok.textContent = 'Yes, continue';
  ok.style.cssText = 'padding:8px 18px;background:#BC112A;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:14px;font-weight:600;';
  ok.onclick = () => {
    if(document.getElementById('bulk-skip-chk')?.checked) bulkSkipConfirm = true;
    overlay.classList.remove('open');
    fn();
  };
  btns.appendChild(cancel);
  btns.appendChild(ok);
  overlay.classList.add('open');
}

function bulkApprove() {
  if(!selectedKeys.size) return;
  bulkConfirmThen('approve', `Approve <strong>${selectedKeys.size} quote${selectedKeys.size!==1?'s':''}</strong> for payment?`, () => {
    selectedKeys.forEach(rk => {
      const [rep, key] = rk.split('::');
      const rl = rep.toLowerCase();
      const q = (allQuotes[rep]||[]).find(x => (x._fbKey||fbKey(x)) === key);
      if(!q) return;
      const qKey = q._fbKey || fbKey(q);
      fbSet('quotes/'+rl+'/'+qKey+'/workflowStatus', 'approvedForPayment');
      fbSet('quotes/'+rl+'/'+qKey+'/issueFlag', false);
      q.workflowStatus = 'approvedForPayment';
      q.issueFlag = false;
    });
    selectedKeys.clear();
    render();
    setTimeout(()=>bamAlert('✅ Selected quotes approved for payment.'),100);
  });
}

function bulkFlagIssue() {

  bulkConfirmThen('flag', `Flag <strong>${selectedKeys.size} quote${selectedKeys.size!==1?'s':''}</strong> as issues?`, () => {
    selectedKeys.forEach(rk => {
      const [rep, key] = rk.split('::');
      const rl = rep.toLowerCase();

function bulkMarkPaid() {
  if(!selectedKeys.size) return;
  bulkConfirmThen('pay', `Mark <strong>${selectedKeys.size} quote${selectedKeys.size!==1?'s':''}</strong> as paid?`, () => {
    const paidAt = new Date().toISOString();
    selectedKeys.forEach(rk => {
      const [rep, key] = rk.split('::');
      const rl = rep.toLowerCase();
      const q = (allQuotes[rep]||[]).find(x => (x._fbKey||fbKey(x)) === key);
      if(!q) return;
      const qKey = q._fbKey || fbKey(q);
      fbSet('quotes/'+rl+'/'+qKey+'/workflowStatus', 'paid');
      fbSet('quotes/'+rl+'/'+qKey+'/paidAt', paidAt);
      fbSet('quotes/'+rl+'/'+qKey+'/issueFlag', false);
      fbSet('paid/'+rl+'/'+qKey, {
        quoteNum:q.quoteNum,quoteName:q.quoteName,clientName:q.clientName,clientCompany:q.clientCompany,
        totalSell:q.totalSell||0,totalNetCost:q.totalNetCost||0,commissionSplit:q.commissionSplit||'standard',
        totalRepComm:q.totalRepComm||null,period:q.period||q.commissionReport||'',
        workflowStatus:'paid',paidAt,_rep:rep,_paidAt:paidAt
      });
      q.workflowStatus = 'paid'; q.paidAt = paidAt; q.issueFlag = false;
    });
    selectedKeys.clear();
    render();
    setTimeout(()=>bamAlert('💰 Selected quotes marked as paid.'),100);

function deleteQuoteFromFirebase(rep, encKey) {
  const key = decodeURIComponent(encKey);
  const rl = rep.toLowerCase();
  const q = (allQuotes[rep]||[]).find(x => (x._fbKey||'') === key || fbKey(x) === key);
  const qKey = q ? (q._fbKey || key) : key;
  const label = q ? (q.quoteName||q.quoteNum||qKey) : qKey;
  bamConfirm(`Delete "${label}" from Firebase?<br><br><small style="color:var(--text3)">Use this to clear quotes the rep deleted locally that are still stuck in the database.</small>`, ok => {
    if(!ok) return;
    fbSet('quotes/'+rl+'/'+qKey, null);
    fbSet('paid/'+rl+'/'+qKey, null);
    if(allQuotes[rep]) allQuotes[rep] = allQuotes[rep].filter(x => (x._fbKey||fbKey(x)) !== qKey);
    render();
    setTimeout(()=>bamAlert('Quote deleted.'),100);
  });
}

function deleteQuoteHard(rep, encKey) {
  const key = decodeURIComponent(encKey);
  const rl = rep.toLowerCase();
  const q = (allQuotes[rep]||[]).find(x => (x._fbKey||'') === key || fbKey(x) === key);
  const qKey = q ? (q._fbKey || key) : key;
  const label = q ? (q.quoteName||q.quoteNum||qKey) : qKey;
  bamConfirm('Permanently delete <strong>'+label+'</strong> for '+rep+'? This removes it from Firebase entirely and cannot be undone.', ok => {
    if(!ok) return;
    fbSet('quotes/'+rl+'/'+qKey, null);
    fbSet('paid/'+rl+'/'+qKey, null);
    if(allQuotes[rep]) allQuotes[rep] = allQuotes[rep].filter(x => (x._fbKey||fbKey(x)) !== qKey);
    render();
    setTimeout(()=>bamAlert('Deleted. Gone for good.'),100);
  });
}

function setQuoteWorkflow(rep, encKey, newStatus, clearIssue, confirmMsg, successMsg, extraFn) {
  const key = decodeURIComponent(encKey);
  bamConfirm(confirmMsg, ok => {
    if(!ok) return;
    const rl = rep.toLowerCase();
    const q = (allQuotes[rep]||[]).find(x => (x._fbKey||'') === key || fbKey(x) === key);
    if(!q) { setTimeout(()=>bamAlert('Could not find quote. Refresh and try again.'),100); return; }
    const qKey = q._fbKey || fbKey(q);
    const updatedAt = new Date().toISOString();
    // Set saving flag to prevent SSE echo-back from overwriting our change
    _dashSaving = true; setTimeout(()=>{ _dashSaving = false; }, 5000);
    if(newStatus) {
      fbSet('quotes/'+rl+'/'+qKey+'/workflowStatus', newStatus);
      q.workflowStatus = newStatus;
    }
    if(clearIssue) {
      fbSet('quotes/'+rl+'/'+qKey+'/issueFlag', false);
      fbSet('quotes/'+rl+'/'+qKey+'/issueNote', null);
      q.issueFlag = false;
      q.issueNote = null;
    }
    fbSet('quotes/'+rl+'/'+qKey+'/statusUpdatedAt', updatedAt);
    q.statusUpdatedAt = updatedAt;
    if(newStatus === 'paid') {
      fbSet('quotes/'+rl+'/'+qKey+'/paidAt', updatedAt);
      fbSet('paid/'+rl+'/'+qKey, {
        quoteNum: q.quoteNum, quoteName: q.quoteName,
        clientName: q.clientName, clientCompany: q.clientCompany,
        totalSell: q.totalSell||q.sell||0, totalNetCost: q.totalNetCost||q.net||0,
        commissionSplit: q.commissionSplit||q.split||'standard',
        totalRepComm: q.totalRepComm||null,
        period: q.period||q.commissionReport||'',
        workflowStatus: 'paid', paidAt: updatedAt, _rep: rep, _paidAt: updatedAt
      });
      q.paidAt = updatedAt;
    }
    if(extraFn) extraFn(q, qKey, rl);
    render();
    setTimeout(()=>bamAlert(successMsg),100);
  });
}

async function loadFeedback() {
  try {
    const data = await fbGet('feedback');
    if(data && typeof data === 'object') {
      // Filter out null values (keys deleted but not yet purged)
      feedbackData = Object.fromEntries(Object.entries(data).filter(([,v])=>v!==null&&typeof v==='object'));
    } else {
      feedbackData = {};
    }
    const unread = Object.values(feedbackData).filter(f=>!f.read).length;
    const badge = document.getElementById('feedback-badge');
    if(badge) { badge.style.display=unread?'':'none'; badge.textContent=unread; }
  } catch(e) { console.error('loadFeedback error:',e); }
}
function renderFeedback() {
  const items = Object.entries(feedbackData).filter(([,f])=>!f.archived).sort((a,b)=>b[1].sentAt>a[1].sentAt?1:-1);
  const archived = Object.entries(feedbackData).filter(([,f])=>f.archived).sort((a,b)=>b[1].sentAt>a[1].sentAt?1:-1);
  if(!items.length) {
    document.getElementById('tab-content').innerHTML='<div class="card" style="color:var(--text3);text-align:center;padding:32px;">No feedback yet. Quiet herd!</div>';
    return;
  }
  let html = '';
  items.forEach(([key,f])=>{
    const dt=f.sentAt?new Date(f.sentAt).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}):'' ;
    html+=`<div class="card" style="${f.read?'opacity:.7':''}">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
        <div><strong>${f.rep||'Unknown'}</strong> <span style="font-size:11px;color:var(--text3);">${dt}</span></div>
        <div style="display:flex;gap:6px;align-items:center">
          ${!f.read?`<button class="btn btn-gray btn-sm" onclick="markFeedbackRead('${key}')">Mark read</button>`:'<span style="font-size:11px;color:var(--text3);">✓ Read</span>'}
          <button class="btn btn-sm" style="background:#f0f4ff;color:#333;border:1px solid #ccc;" onclick="archiveFeedback('${key}')">Archive</button>
          <button class="btn btn-sm" style="background:#fff0f2;color:var(--red);border:1px solid #f5c2c7;" onclick="deleteFeedback('${key}')">Delete</button>
        </div>
      </div>
      <div style="font-size:14px;">${f.message||''}</div>
    </div>`;
  });
  if(archived.length) {
    html += '<div style="margin-top:24px;border-top:1px solid var(--border);padding-top:16px"><div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);margin-bottom:10px;">Archived</div>';
    archived.forEach(([key,f])=>{
      const dt=f.sentAt?new Date(f.sentAt).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}):'';
      html+=`<div class="card" style="opacity:.5">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
          <div><strong>${f.rep||'Unknown'}</strong> <span style="font-size:11px;color:var(--text3);">${dt}</span></div>
          <button class="btn btn-sm" style="background:#fff0f2;color:var(--red);border:1px solid #f5c2c7;" onclick="deleteFeedback('${key}')">Delete</button>
        </div>
        <div style="font-size:14px;">${f.message||''}</div>
      </div>`;
    });
    html += '</div>';
  }
  document.getElementById('tab-content').innerHTML = html;
}
function markFeedbackRead(key) {
  fbSet('feedback/'+key+'/read', true);
  if(feedbackData[key]) feedbackData[key].read=true;
  renderFeedback();
  const unread=Object.values(feedbackData).filter(f=>!f.read).length;
  const badge=document.getElementById('feedback-badge');
  if(badge){badge.style.display=unread?'':'none';badge.textContent=unread;}
}

function archiveFeedback(key) {
  bamConfirm('Archive this feedback? It will be hidden from the main view but not deleted.', ok => {
    if(!ok) return;
    fbSet('feedback/'+key+'/archived', true);
    if(feedbackData[key]) feedbackData[key].archived=true;
    renderFeedback();
  });
}

async function deleteFeedback(key) {
  bamConfirm('Permanently delete this feedback message? This cannot be undone.', async ok => {
    if(!ok) return;
    try {
      const url = FIREBASE_DB_URL + '/feedback/' + key + '.json';
      const xhr = new XMLHttpRequest();
      xhr.open('DELETE', url, true);
      xhr.onreadystatechange = () => { if(xhr.readyState===4 && xhr.status>=300) console.error('deleteFeedback failed:', xhr.status); };
      xhr.send();
      const r = {ok: true};
      console.log('deleteFeedback', key, 'sent');
      if(!r.ok) {
        console.error('deleteFeedback failed');
        bamAlert('Something went wrong while deleting. Check the console for details.');
        return;
      }
      delete feedbackData[key];
      renderFeedback();
      const fbUnread=Object.values(feedbackData).filter(f=>!f.read).length;
      const fbBadge=document.getElementById('feedback-badge');
      if(fbBadge){fbBadge.style.display=fbUnread?'':'none';fbBadge.textContent=fbUnread;}
    } catch(e) {
      console.error('deleteFeedback error:', e);
      bamAlert('Something went wrong while deleting. Check the console for details.');
    }
  });
}

function runDashReport(reportType) {
  if(typeof XLSX==='undefined'){bamAlert('The Excel library isn\'t loaded. Give the page a refresh and try again.');return;}
  const PENDING_STATUSES = ['readyForSubmission','submittedCommission','submitted'];
  const allQ=[];
  for(const rep of REPS)(allQuotes[rep]||[]).forEach(q=>allQ.push({...q,_rep:rep}));
  const repFilter=document.getElementById('drpt-rep')?.value||'';
  const clientFilter=document.getElementById('drpt-client')?.value||'';
  const filterBase = q => {
    if(repFilter&&q._rep!==repFilter) return false;
    if(clientFilter&&(q.clientCompany||q.clientName||'')!==clientFilter) return false;
    return true;
  };
  const statusFilters = {
    pending:  q => filterBase(q) && PENDING_STATUSES.includes(q.workflowStatus),
    approved: q => filterBase(q) && q.workflowStatus==='approvedForPayment',
    issues:   q => filterBase(q) && !!q.issueFlag,
    paid:     q => filterBase(q) && q.workflowStatus==='paid',
    all:      q => filterBase(q),
  };
  const sheetNames = {pending:'Pending',approved:'Approved',issues:'Issues',paid:'Paid History',all:'All Quotes'};
  const fileNames = {pending:'Pending',approved:'Approved',issues:'Issues',paid:'Paid',all:'All'};
  const filtered = allQ.filter(statusFilters[reportType]||filterBase);
  if(!filtered.length){bamAlert('No quotes match this filter.');return;}
  const HEADERS=['Quote #','Quote name','Client','Company','Rep','Quote date','IHD','Commission period','Split','Sell','Net','GP','Margin %','Rep payout','House profit','Status','Issue Flag'];
  const rows=[HEADERS,...filtered.map(q=>{
    const sell=quoteTotal(q,'sell'),net=quoteTotal(q,'net'),comm=quoteComm(q);
    const statusLabel = q.workflowStatus==='approvedForPayment'?'Approved for Payment':
      q.workflowStatus==='submittedCommission'||q.workflowStatus==='submitted'?'Pending':
      q.workflowStatus==='paid'?'Paid':'Active';
    return[q.quoteNum||'',q.quoteName||'',q.clientName||'',q.clientCompany||'',q._rep,
      q.quoteDate||q.exportedAt||'',q.ihd||'',q.commissionReport||'',q.commissionSplit||'standard',
      sell,net,sell-net,sell>0?((sell-net)/sell*100).toFixed(1):0,comm,sell-net-comm,
      statusLabel, q.issueFlag?'Yes':''];
  })];
  const wb=XLSX.utils.book_new();
  const ws=XLSX.utils.aoa_to_sheet(rows);
  // Column widths
  ws['!cols']=[{wch:10},{wch:24},{wch:18},{wch:18},{wch:10},{wch:12},{wch:12},{wch:16},{wch:10},
    {wch:10},{wch:10},{wch:10},{wch:10},{wch:12},{wch:12},{wch:20},{wch:10}];
  XLSX.utils.book_append_sheet(wb,ws,sheetNames[reportType]||'Report');
  const date=new Date().toLocaleDateString('en-US').replace(/\//g,'-');
  XLSX.writeFile(wb,`TORO_Commission_${fileNames[reportType]||'Report'}_${date}.xlsx`);
  document.getElementById('dash-report-modal').style.display='none';
}

// ── Order Summary Modal ───────────────────────────────────────────────────
function openOrderSummary(rep, encKey) {
  const key = decodeURIComponent(encKey);
  const q = (allQuotes[rep]||[]).find(x => (x._fbKey||fbKey(x)) === key);
  if(!q) { bamAlert('Could not load quote data.'); return; }

  const fmt = n => '$'+(parseFloat(n)||0).toFixed(2);
  const pct = (n,d) => d>0?((n/d)*100).toFixed(1)+'%':'—';
  const mgColor = m => m>=35?'color:#16a34a':m>=30?'color:#d97706':'color:#dc2626';

  // Header info
  const splitLabels = {standard:'Standard',ho_75_25:'H/O 75/25',ho_50_50:'H/O 50/50',ho_25_75:'H/O 25/75'};
  const splitLabel = splitLabels[q.commissionSplit||q.split||'standard']||'Standard';
  const wsLabel = q.workflowStatus==='approvedForPayment'?'✅ Approved for Payment':
    q.workflowStatus==='paid'?'💰 Paid':
    q.workflowStatus==='submittedCommission'||q.workflowStatus==='submitted'?'⏳ Pending':'Active';
  const issueTag = q.issueFlag ? '<span style="background:#fff8e1;color:#7a5c00;font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;border:1px solid #ffe082;margin-left:8px;">⚠️ Issue</span>' : '';

  let html = `
  <div style="background:linear-gradient(160deg,#BC112A,#E9553A);color:#fff;padding:18px 24px;border-radius:12px 12px 0 0;display:flex;align-items:flex-start;justify-content:space-between;">
    <div>
      <div style="font-size:18px;font-weight:700;">${q.quoteName||q.quoteNum||'Quote'} ${issueTag}</div>
      <div style="font-size:13px;opacity:.85;margin-top:4px;">#${q.quoteNum||'—'} · ${q.clientName||''} ${q.clientCompany?'· '+q.clientCompany:''} · Rep: ${rep}</div>
      <div style="font-size:12px;opacity:.75;margin-top:2px;">IHD: ${q.ihd||'—'} · Period: ${q.commissionReport||'—'} · Split: ${splitLabel} · ${wsLabel}</div>
    </div>
    <button onclick="document.getElementById('order-summary-overlay').style.display='none';document.body.style.overflow='';"
      style="background:rgba(255,255,255,.2);border:none;color:#fff;font-size:20px;width:36px;height:36px;border-radius:50%;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:700;">&times;</button>
  </div>
  <div style="padding:20px 24px;overflow-y:auto;max-height:72vh;">`;

  // Summary cards
  const totalSell = q.totalSell||0, totalNet = q.totalNetCost||0;
  const gp = totalSell - totalNet;
  const avgMargin = totalSell>0?(gp/totalSell*100):0;
  // Recalculate commission from first principles (stored values may be from old buggy calc)
  const repComm = quoteComm(q);
  const houseProfit = gp - repComm - (q.totalAM||0);
  html += `<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px;">
    ${[['Total Net','#374151',fmt(totalNet)],['Total Sell','#2255cc',fmt(totalSell)],['Gross Profit','#16a34a',fmt(gp)],['Avg Margin',avgMargin>=30?'#16a34a':'#dc2626',avgMargin.toFixed(1)+'%']].map(([lbl,col,val])=>`
    <div style="background:#f9fafb;border-radius:8px;padding:10px 12px;text-align:center;">
      <div style="font-size:18px;font-weight:800;color:${col};">${val}</div>
      <div style="font-size:11px;color:#6b7280;font-weight:600;margin-top:2px;">${lbl}</div>
    </div>`).join('')}
  </div>`;

  // Commission breakdown
  html += `<div style="background:#f0fdf4;border:1px solid #bbf7d0;border-radius:8px;padding:12px 16px;margin-bottom:20px;display:flex;gap:24px;flex-wrap:wrap;">
    <div><div style="font-size:13px;font-weight:700;color:#166534;">Rep Commission</div><div style="font-size:20px;font-weight:800;color:#16a34a;">${fmt(repComm)}</div></div>
    <div><div style="font-size:13px;font-weight:700;color:#374151;">House Profit</div><div style="font-size:20px;font-weight:800;color:#374151;">${fmt(houseProfit)}</div></div>
    ${q.totalAM>0?`<div><div style="font-size:13px;font-weight:700;color:#6b7280;">AM</div><div style="font-size:20px;font-weight:800;color:#6b7280;">${fmt(q.totalAM)}</div></div>`:''}
  </div>`;

  // Garments
  if(q.garments&&q.garments.length) {
    html += `<div style="font-size:13px;font-weight:700;color:#374151;text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px;">Apparel & Decoration</div>`;
    q.garments.forEach(g => {
      const gSzRows = g.szRows||[];
      const gQty = gSzRows.reduce((a,r)=>a+(r.qty||0),0);
      html += `<div style="border:1px solid #e5e7eb;border-radius:8px;margin-bottom:12px;overflow:hidden;">
        <div style="background:#f8fafc;padding:10px 14px;border-bottom:1px solid #e5e7eb;">
          <div style="font-weight:700;font-size:14px;">${g.gdesign||g.gbrand||'Garment'}</div>
          <div style="font-size:12px;color:#6b7280;margin-top:2px;">${g.gbrand||''} #${g.gsku||'—'} via ${g.gvendor||'—'} · ${g.gfit||''} · ${g.gcolor_name||''} · ${gQty} pcs</div>
        </div>`;

      // Size rows
      if(gSzRows.length) {
        html += `<div style="padding:8px 14px;">
          <div style="display:grid;grid-template-columns:60px 60px 80px 60px;gap:6px;font-size:10px;font-weight:700;color:#9ca3af;text-transform:uppercase;padding-bottom:4px;border-bottom:1px solid #f3f4f6;margin-bottom:4px;">
            <div>Size</div><div>Qty</div><div>Net cost</div><div>Group</div>
          </div>`;
        gSzRows.forEach(r => {
          html += `<div style="display:grid;grid-template-columns:60px 60px 80px 60px;gap:6px;font-size:12px;padding:3px 0;">
            <div style="font-weight:600;">${r.size}</div>
            <div>${r.qty}</div>
            <div>${fmt(r.cost)}</div>
            <div style="color:#6b7280;">${r.grp||'—'}</div>
          </div>`;
        });
        html += `</div>`;
      }

      // Imprints
      const imps = g.imps||[];
      if(imps.length) {
        imps.forEach(imp => {
          const typeLabel = (imp.type||'screen').charAt(0).toUpperCase()+(imp.type||'screen').slice(1);
          let decoDetail = '';
          if(imp.type==='screen'||!imp.type) {
            decoDetail = `${imp.sp_col||1} color${(imp.sp_col||1)!==1?'s':''} · ${imp.sp_loc||imp.other_sp_loc||'—'} · ${imp.sp_setup==='reorder'?'Reorder':'New setup'}${imp.sp_ink_names?' · '+imp.sp_ink_names:''}`;
            if(imp.imp_override) decoDetail += ` · <strong>Override: ${fmt(imp.imp_override_cost)}/item</strong>`;
          } else if(imp.type==='embroidery') {
            decoDetail = `${(imp.emb_st||0).toLocaleString()} st · ${imp.emb_loc||imp.other_emb_loc||'—'}`;
          } else if(imp.type==='dtf') {
            decoDetail = `${imp.dtf_sq||0} sq in · ${imp.dtf_loc||imp.other_dtf_loc||'—'}`;
          } else if(imp.type==='heat') {
            decoDetail = `${imp.heat_loc||imp.other_heat_loc||'—'}`;
          } else if(imp.type==='vinyl') {
            decoDetail = `${imp.vinyl_loc||imp.other_vinyl_loc||'—'}`;
          }
          const sharedNote = imp.imp_shared||imp.imp_share_with ? `<span style="font-size:10px;color:#2255cc;margin-left:6px;">Shared</span>` : '';
          html += `<div style="background:#fafafa;border-top:1px solid #f3f4f6;padding:8px 14px;font-size:12px;">
            <div style="font-weight:700;color:#374151;">${typeLabel}: ${imp.imp_name||'—'}${sharedNote}</div>
            <div style="color:#6b7280;margin-top:2px;">${decoDetail}</div>
            ${imp.sp_notes||imp.emb_notes||imp.dtf_notes?`<div style="color:#d97706;font-size:11px;margin-top:2px;">Note: ${imp.sp_notes||imp.emb_notes||imp.dtf_notes}</div>`:''}
          </div>`;
        });
      }

      // Misc fees
      const miscFees = g.miscFees||g.g_misc_fees||[];
      if(miscFees.length) {
        miscFees.forEach(f => {
          html += `<div style="background:#fffcf5;border-top:1px solid #fef3c7;padding:6px 14px;font-size:12px;color:#92400e;">
            Misc fee: ${f.desc||'Fee'} · Net: ${fmt(f.net||0)} · Sell: ${fmt(f.sell||0)}
          </div>`;
        });
      }

      html += `</div>`;
    });
  }

  // Hard Goods
  if(q.hardGoods&&q.hardGoods.length) {
    html += `<div style="font-size:13px;font-weight:700;color:#374151;text-transform:uppercase;letter-spacing:.05em;margin:16px 0 10px;">Hard Goods / Promo</div>`;
    q.hardGoods.forEach(h => {
      const itemNet = (h.hg_cost||0)*h.hg_qty + (h.hg_sc||0) + (h.hg_dc||0)*h.hg_qty;
      html += `<div style="border:1px solid #e5e7eb;border-radius:8px;margin-bottom:10px;padding:12px 14px;">
        <div style="font-weight:700;font-size:14px;">${h.hg_desc||'Item'}</div>
        <div style="font-size:12px;color:#6b7280;margin-top:2px;">${h.hg_vendor||'—'} · #${h.hg_sku||'—'} · ${h.hg_item_color||''} · Qty: ${h.hg_qty||0}</div>
        <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px;">
          ${[['Item cost',fmt(h.hg_cost||0)+'/ea'],['Run charge',fmt(h.hg_dc||0)+'/ea'],['Setup',fmt(h.hg_sc||0)],['Total net',fmt(itemNet)]].map(([lbl,val])=>`
          <div style="background:#f9fafb;border-radius:6px;padding:6px 8px;">
            <div style="font-size:10px;color:#9ca3af;font-weight:700;">${lbl}</div>
            <div style="font-size:13px;font-weight:700;">${val}</div>
          </div>`).join('')}
        </div>
        <div style="font-size:12px;color:#6b7280;margin-top:8px;">Deco: ${h.hg_dec||'—'} · Location: ${h.hg_dec_loc||h.hg_dec_other||'—'} · Design: ${h.hg_design||'—'} · Colors: ${h.hg_colors||'—'}</div>
      </div>`;
    });
  }

  // Line summary (from export)
  if(q.lines&&q.lines.length) {
    html += `<div style="font-size:13px;font-weight:700;color:#374151;text-transform:uppercase;letter-spacing:.05em;margin:16px 0 10px;">Line Summary</div>
    <div style="border:1px solid #e5e7eb;border-radius:8px;overflow:hidden;">
      <div style="display:grid;grid-template-columns:2fr 80px 80px 70px 80px 80px;gap:6px;padding:8px 12px;background:#f8fafc;font-size:10px;font-weight:700;color:#9ca3af;text-transform:uppercase;">
        <div>Line</div><div>Net</div><div>Sell</div><div>Margin</div><div>Rep</div><div>House</div>
      </div>`;
    q.lines.forEach(l => {
      const lm = l.sell>0?((l.sell-l.net)/l.sell*100):0;
      html += `<div style="display:grid;grid-template-columns:2fr 80px 80px 70px 80px 80px;gap:6px;padding:8px 12px;border-top:1px solid #f3f4f6;font-size:12px;align-items:center;">
        <div style="font-weight:600;">${l.name||'—'}</div>
        <div>${fmt(l.net)}</div>
        <div style="color:#2255cc;font-weight:700;">${fmt(l.sell)}</div>
        <div style="${mgColor(lm)};font-weight:700;">${lm.toFixed(1)}%</div>
        <div style="color:#16a34a;font-weight:700;">${fmt(l.rep)}</div>
        <div>${fmt(l.house)}</div>
      </div>`;
    });
    html += `</div>`;
  }

  // Notes
  if(q.page1?.orderNotes) {
    html += `<div style="background:#f8fafc;border:1px solid #e5e7eb;border-radius:8px;padding:12px 14px;margin-top:16px;">
      <div style="font-size:11px;font-weight:700;color:#9ca3af;text-transform:uppercase;margin-bottom:4px;">Order Notes</div>
      <div style="font-size:13px;color:#374151;">${q.page1.orderNotes}</div>
    </div>`;
  }

  html += `</div>`; // end padding div

  // Show modal
  let overlay = document.getElementById('order-summary-overlay');
  if(!overlay) {
    overlay = document.createElement('div');
    overlay.id = 'order-summary-overlay';
    overlay.style.cssText = 'display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:10000;align-items:flex-start;justify-content:center;overflow-y:auto;padding:30px 16px;';
    overlay.onclick = e => { if(e.target===overlay){overlay.style.display='none';document.body.style.overflow='';} };
    document.body.appendChild(overlay);
  }
  const inner = document.createElement('div');
  inner.style.cssText = 'background:#fff;border-radius:12px;max-width:820px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3);margin:auto;';
  inner.innerHTML = html;
  overlay.innerHTML = '';
  overlay.appendChild(inner);
  overlay.style.display = 'flex';
  document.body.style.overflow = 'hidden';
}

  try {
    const sessionExpiry = parseInt(localStorage.getItem('toro_session_dash')||'0');
    if(Date.now() < sessionExpiry){
      document.getElementById('gate').style.display='none';
      document.getElementById('app').style.display='';
      document.getElementById('version-label').textContent = DASH_VERSION;
      init();
    }
  } catch(e) { console.warn('Session check failed:', e); }
})();
