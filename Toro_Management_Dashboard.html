<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TORO Management Dashboard</title>
<style>
  :root{
    --red:#C41E1E;--green:#1a7f4b;--bg:#F7F7F8;--surface:#fff;
    --border:#E2E3E6;--border2:#ccc;--text:#1a1a1f;--text2:#444;--text3:#888;
    --brown:#7B3F00;--radius:10px;--radius-sm:6px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
  .topbar{background:#1a1a2e;border-bottom:3px solid var(--red);padding:14px 28px;display:flex;align-items:center;justify-content:space-between}
  .topbar h1{color:#fff;font-size:18px;font-weight:700;letter-spacing:.02em}
  .topbar span{color:#888;font-size:12px}
  .container{max-width:1200px;margin:0 auto;padding:28px 24px}
  .drop-zone{border:2px dashed var(--border2);border-radius:var(--radius);padding:40px;text-align:center;cursor:pointer;transition:all .2s;background:var(--surface);margin-bottom:24px}
  .drop-zone:hover,.drop-zone.over{border-color:var(--red);background:#fff8f8}
  .drop-zone h2{font-size:16px;color:var(--text2);margin-bottom:6px}
  .drop-zone p{font-size:13px;color:var(--text3)}
  .drop-zone input{display:none}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:24px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px}
  .card-lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);margin-bottom:6px}
  .card-val{font-size:24px;font-weight:700}
  .card-val.green{color:var(--green)}
  .card-val.red{color:var(--red)}
  .card-val.brown{color:var(--brown)}
  .section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:20px;overflow:hidden}
  .section-hdr{padding:12px 18px;border-bottom:1px solid var(--border);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:space-between}
  .section-hdr .badge{font-size:11px;font-weight:600;padding:2px 8px;border-radius:10px;background:var(--bg);color:var(--text3);border:1px solid var(--border)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{padding:8px 14px;text-align:left;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text3);border-bottom:1px solid var(--border);background:var(--bg)}
  th.r,td.r{text-align:right}
  td{padding:9px 14px;border-bottom:1px solid #f5f5f5;vertical-align:middle}
  tr:last-child td{border-bottom:none}
  tr:hover td{background:#fafafa}
  tr.paid-row td{background:#f0faf4;color:#888;}
  .mg-pill{display:inline-block;padding:2px 7px;border-radius:8px;font-size:11px;font-weight:700}
  .mg-green{background:#e6f4ee;color:var(--green)}
  .mg-yellow{background:#FFF8E1;color:#7A4F00}
  .mg-red{background:#FFEBEB;color:var(--red)}
  .approval-flag{background:#FFEBEB;color:var(--red);padding:2px 7px;border-radius:8px;font-size:10px;font-weight:700}
  .clear-btn{font-size:12px;padding:4px 10px;border:1px solid var(--border2);border-radius:6px;background:var(--surface);cursor:pointer;color:var(--text2)}
  .clear-btn:hover{border-color:var(--red);color:var(--red)}
  .empty{padding:40px;text-align:center;color:var(--text3);font-size:13px}
  .rep-bar{display:flex;align-items:center;gap:8px;margin-bottom:4px}
  .rep-bar-inner{height:8px;border-radius:4px;background:var(--red);min-width:2px;transition:width .4s}
  .rep-bar-label{font-size:12px;color:var(--text2);white-space:nowrap}
  .filter-row{display:flex;gap:10px;flex-wrap:wrap;padding:10px 18px;border-bottom:1px solid var(--border);background:var(--bg)}
  select.filter{padding:5px 10px;font-size:12px;border:1px solid var(--border2);border-radius:6px;background:#fff}
  .tabs{display:flex;border-bottom:1px solid var(--border)}
  .tab{padding:10px 18px;font-size:13px;font-weight:600;cursor:pointer;border-bottom:2px solid transparent;color:var(--text3)}
  .tab.active{color:var(--red);border-bottom-color:var(--red)}
  .tab-panel{display:none}
  .tab-panel.active{display:block}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js">
function exportPaidUpdates(){
  const paidQuotes = quotes.filter(q=>q.paid && q.paidDate);
  if(!paidQuotes.length){ alert('No paid quotes to export.'); return; }
  
  // Group by rep and create one bundle per rep
  const byRep = {};
  paidQuotes.forEach(q=>{
    if(!byRep[q.rep]) byRep[q.rep]=[];
    byRep[q.rep].push({
      quoteNum: q.quoteNum,
      quoteName: q.quoteName,
      rep: q.rep,
      paid: true,
      paidDate: q.paidDate,
      // Include full quote data so portal can match and update
      totalSell: q.totalSell,
      totalNetCost: q.totalNetCost,
      grossProfit: q.grossProfit,
      avgMargin: q.avgMargin,
      totalRepComm: q.totalRepComm,
      totalHouseProfit: q.totalHouseProfit,
      totalAM: q.totalAM,
      commissionReport: q.commissionReport,
      ihd: q.ihd,
      commissionSplit: q.commissionSplit,
      hasAM: q.hasAM,
      adjustments: q.adjustments||[]
    });
  });

  Object.entries(byRep).forEach(([rep, qs])=>{
    const bundle = {
      type: 'commission_bundle',
      subtype: 'paid_update',
      rep,
      exportedAt: new Date().toLocaleString(),
      quotes: qs,
      totals: { repPayout: qs.reduce((a,q)=>a+(q.totalRepComm||0),0) }
    };
    const blob = new Blob([JSON.stringify(bundle,null,2)],{type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'TORO_PaidUpdate_'+rep+'_'+new Date().toLocaleDateString('en-US').replace(/\//g,'-')+'.json';
    a.click();
    URL.revokeObjectURL(a.href);
  });
}




</script>
</head>
<body>

<div class="topbar">
  <h1>&#9733; Toro Management Dashboard</h1>
  <span id="last-updated">No data loaded</span>
</div>

<div class="container">

  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px">
    <p style="font-size:13px;color:#666">Drop individual quote exports or commission bundles below.</p>
    <button onclick="downloadExcel()" id="dl-btn" style="padding:8px 14px;background:#1a7f4b;color:#fff;border:none;border-radius:6px;font-size:13px;font-weight:700;cursor:pointer">&#128229; Download Excel</button>
      <button onclick="exportPaidUpdates()" style="padding:8px 14px;background:#1a4a8a;color:#fff;border:none;border-radius:6px;font-size:13px;font-weight:700;cursor:pointer" title="Export paid status for reps to import">&#10003; Export paid updates</button>
  </div>

  <div class="drop-zone" id="drop-zone" onclick="document.getElementById('file-input').click()">
    <input type="file" id="file-input" multiple accept=".json" style="display:none">
    <h2>Drop exported quote files here</h2>
    <p>Drop individual quote exports OR commission bundle files from rep portals</p>
  </div>

  <div id="summary-cards" class="cards" style="display:none"></div>

  <div id="main-content" style="display:none">
    <div class="section">
      <div class="tabs" id="tabs">
        <div class="tab active" data-tab="by-rep">By rep</div>
        <div class="tab" data-tab="by-period">By commission period</div>
        <div class="tab" data-tab="all-quotes">All quotes</div>
        <div class="tab" data-tab="approval">Needs approval</div>
      </div>

      <div class="tab-panel active" id="panel-by-rep">
        <div id="rep-table-wrap"></div>
      </div>

      <div class="tab-panel" id="panel-by-period">
        <div id="period-table-wrap"></div>
      </div>

      <div class="tab-panel" id="panel-all-quotes">
        <div class="filter-row">
          <select class="filter" id="filter-rep" onchange="renderAll()">
            <option value="">All reps</option>
          </select>
          <select class="filter" id="filter-period" onchange="renderAll()">
            <option value="">All periods</option>
          </select>
          <button class="clear-btn" onclick="clearFilters()">Clear filters</button>
          <button class="clear-btn" style="margin-left:auto" onclick="clearData()">Clear all data</button>
        </div>
        <div id="quotes-table-wrap"></div>
      </div>

      <div class="tab-panel" id="panel-approval">
        <div id="approval-table-wrap"></div>
      </div>

    </div>
  </div>

</div>

<script>
let quotes = JSON.parse(localStorage.getItem('toro_quotes')||'[]');
const fmt = v => '$'+parseFloat(v||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const pct = v => (Math.round((v||0)*10)/10)+'%';

// ── File loading ────────────────────────────────────────────────────────
const dz = document.getElementById('drop-zone');
const fi = document.getElementById('file-input');

dz.addEventListener('dragover', e=>{e.preventDefault();dz.classList.add('over')});
dz.addEventListener('dragleave', ()=>dz.classList.remove('over'));
dz.addEventListener('drop', e=>{
  e.preventDefault(); dz.classList.remove('over');
  loadFiles([...e.dataTransfer.files]);
});
fi.addEventListener('change', ()=>{ loadFiles([...fi.files]); fi.value=''; });

function loadFiles(files){
  let loaded=0;
  files.forEach(f=>{
    if(!f.name.endsWith('.json')) return;
    const r=new FileReader();
    r.onload=e=>{
      try{
        const data=JSON.parse(e.target.result);
        // Handle commission bundle from rep portal
        const incoming=data.type==='commission_bundle'?data.quotes:[data];
        incoming.forEach(q=>{
          if(!q.totalSell) return;
          // Tag bundle source
          if(data.type==='commission_bundle'){
            q._bundle=true;
            q._bundleRep=data.rep;
            q._bundlePeriod=data.period;
            q._bundleExportedAt=data.exportedAt;
          }
          // Deduplicate by quoteNum
          if(q.quoteNum){
            quotes=quotes.filter(x=>x.quoteNum!==q.quoteNum);
          }
          quotes.push(q);
          loaded++;
        });
      }catch(err){ console.error('Parse error:', err); }
      if(loaded>0){
        localStorage.setItem('toro_quotes',JSON.stringify(quotes));
        render();
              }
    };
    r.readAsText(f);
  });
}

function clearData(){
  if(!confirm('Clear all loaded quote data?')) return;
  quotes=[];
  localStorage.removeItem('toro_quotes');
  render();
}

function clearFilters(){
  document.getElementById('filter-rep').value='';
  document.getElementById('filter-period').value='';
  renderAll();
}

// ── Tabs ────────────────────────────────────────────────────────────────
document.querySelectorAll('.tab').forEach(t=>{
  t.addEventListener('click',()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    document.getElementById('panel-'+t.dataset.tab).classList.add('active');
  });
});

// ── Main render ─────────────────────────────────────────────────────────
function render(){
  const cards = document.getElementById('summary-cards');
  const main = document.getElementById('main-content');
  const upd = document.getElementById('last-updated');

  if(!quotes.length){
    cards.style.display='none';
    main.style.display='none';
    upd.textContent='No data loaded';
    return;
  }

  cards.style.display='';
  main.style.display='';
  upd.textContent=quotes.length+' quote'+(quotes.length!==1?'s':'')+' loaded';

  const totSell=quotes.reduce((a,q)=>a+(q.totalSell||0),0);
  const totNet=quotes.reduce((a,q)=>a+(q.totalNetCost||0),0);
  const totGP=quotes.reduce((a,q)=>a+(q.grossProfit||0),0);
  const totRep=quotes.reduce((a,q)=>a+(q.totalRepComm||0),0);
  const totHouse=quotes.reduce((a,q)=>a+(q.totalHouseProfit||0),0);
  const avgMg=totSell>0?Math.round((1-totNet/totSell)*1000)/10:0;

  cards.innerHTML=`
    <div class="card"><div class="card-lbl">Total quotes</div><div class="card-val">${quotes.length}</div></div>
    <div class="card"><div class="card-lbl">Total sell</div><div class="card-val green">${fmt(totSell)}</div></div>
    <div class="card"><div class="card-lbl">Gross profit</div><div class="card-val green">${fmt(totGP)}</div></div>
    <div class="card"><div class="card-lbl">Avg margin</div><div class="card-val ${avgMg<30?'red':avgMg<35?'':'green'}">${pct(avgMg)}</div></div>
    <div class="card"><div class="card-lbl">House profit</div><div class="card-val">${fmt(totHouse)}</div></div>
    <div class="card"><div class="card-lbl">Rep commissions</div><div class="card-val brown">${fmt(totRep)}</div></div>
    <div class="card"><div class="card-lbl">Needs approval</div><div class="card-val ${quotes.filter(q=>q.needsApproval).length>0?'red':''}">${quotes.filter(q=>q.needsApproval).length}</div></div>
  `;

  // Populate filter dropdowns
  const reps=[...new Set(quotes.map(q=>q.rep).filter(Boolean))].sort();
  const periods=[...new Set(quotes.map(q=>q.commissionReport).filter(Boolean))].sort();
  const repSel=document.getElementById('filter-rep');
  const perSel=document.getElementById('filter-period');
  const repVal=repSel.value, perVal=perSel.value;
  repSel.innerHTML='<option value="">All reps</option>'+reps.map(r=>`<option ${r===repVal?'selected':''}>${r}</option>`).join('');
  perSel.innerHTML='<option value="">All periods</option>'+periods.map(p=>`<option ${p===perVal?'selected':''}>${p}</option>`).join('');

  renderByRep(reps, totSell);
  renderByPeriod(periods);
  renderAll();
  renderApproval();
}

function renderByRep(reps, totSell){
  const wrap=document.getElementById('rep-table-wrap');
  if(!reps.length){wrap.innerHTML='<div class="empty">No data</div>';return;}
  let html=`<table><thead><tr>
    <th>Rep</th><th class="r">Quotes</th><th class="r">Total sell</th>
    <th class="r">Gross profit</th><th class="r">Avg margin</th>
    <th class="r">Rep payout</th><th class="r">House profit</th><th class="r">Share of sales</th>
  </tr></thead><tbody>`;
  reps.forEach(rep=>{
    const qs=quotes.filter(q=>q.rep===rep);
    const sell=qs.reduce((a,q)=>a+(q.totalSell||0),0);
    const net=qs.reduce((a,q)=>a+(q.totalNetCost||0),0);
    const gp=qs.reduce((a,q)=>a+(q.grossProfit||0),0);
    const rc=qs.reduce((a,q)=>a+(q.totalRepComm||0),0);
    const hp=qs.reduce((a,q)=>a+(q.totalHouseProfit||0),0);
    const mg=sell>0?Math.round((1-net/sell)*1000)/10:0;
    const share=totSell>0?Math.round(sell/totSell*1000)/10:0;
    const mgClass=mg<30?'mg-red':mg<35?'mg-yellow':'mg-green';
    html+=`<tr>
      <td><strong>${rep}</strong></td>
      <td class="r">${qs.length}</td>
      <td class="r">${fmt(sell)}</td>
      <td class="r">${fmt(gp)}</td>
      <td class="r"><span class="mg-pill ${mgClass}">${pct(mg)}</span></td>
      <td class="r" style="color:var(--brown);font-weight:700">${fmt(rc)}</td>
      <td class="r">${fmt(hp)}</td>
      <td class="r">
        <div class="rep-bar"><div class="rep-bar-inner" style="width:${Math.max(share,1)}px"></div><span class="rep-bar-label">${share}%</span></div>
      </td>
    </tr>`;
  });
  html+=`</tbody></table>`;
  wrap.innerHTML=html;
}

function renderByPeriod(periods){
  const wrap=document.getElementById('period-table-wrap');
  if(!periods.length){wrap.innerHTML='<div class="empty">No data</div>';return;}
  let html=`<table><thead><tr>
    <th>Commission report date</th><th class="r">Quotes</th><th class="r">Total sell</th>
    <th class="r">Gross profit</th><th class="r">Avg margin</th><th class="r">Rep payouts</th>
    <th class="r">Paid</th><th></th>
  </tr></thead><tbody>`;
  periods.forEach(per=>{
    const qs=quotes.filter(q=>q.commissionReport===per);
    const paidQs=qs.filter(q=>q.paid);
    const allPaid=qs.length>0&&paidQs.length===qs.length;
    const somePaid=paidQs.length>0&&!allPaid;
    const sell=qs.reduce((a,q)=>a+(q.totalSell||0),0);
    const net=qs.reduce((a,q)=>a+(q.totalNetCost||0),0);
    const gp=qs.reduce((a,q)=>a+(q.grossProfit||0),0);
    const rc=qs.reduce((a,q)=>a+(q.totalRepComm||0),0);
    const mg=sell>0?Math.round((1-net/sell)*1000)/10:0;
    const mgClass=mg<30?'mg-red':mg<35?'mg-yellow':'mg-green';
    const paidBadge=allPaid
      ?'<span style="background:#e6f4ee;color:#1a7f4b;font-size:11px;font-weight:700;padding:2px 8px;border-radius:8px">&#10003; All paid</span>'
      :somePaid
      ?'<span style="background:#fff3cd;color:#7a5500;font-size:11px;font-weight:700;padding:2px 8px;border-radius:8px">'+paidQs.length+'/'+qs.length+' paid</span>'
      :'<span style="background:#f5f5f5;color:#888;font-size:11px;padding:2px 8px;border-radius:8px">Unpaid</span>';
        const markAllBtn = allPaid ? '' : markAllPaidBtn(per);
    html+=`<tr>
      <td><strong style="color:var(--red)">&#128197; ${per}</strong></td>
      <td class="r">${qs.length}</td>
      <td class="r">${fmt(sell)}</td>
      <td class="r">${fmt(gp)}</td>
      <td class="r"><span class="mg-pill ${mgClass}">${pct(mg)}</span></td>
      <td class="r" style="color:var(--brown);font-weight:700">${fmt(rc)}</td>
      <td class="r">${paidBadge}</td>
      <td>${markAllBtn}</td>
    </tr>`;
  });
  html+=`</tbody></table>`;
  wrap.innerHTML=html;
}

function renderAll(){
  const repF=document.getElementById('filter-rep')?.value||'';
  const perF=document.getElementById('filter-period')?.value||'';
  let qs=quotes;
  if(repF) qs=qs.filter(q=>q.rep===repF);
  if(perF) qs=qs.filter(q=>q.commissionReport===perF);
  const wrap=document.getElementById('quotes-table-wrap');
  if(!qs.length){wrap.innerHTML='<div class="empty">No quotes match filters</div>';return;}
  let html=`<table><thead><tr>
    <th>Quote</th><th>Rep</th><th>Source</th><th>IHD</th><th>Commission report</th>
    <th class="r">Net cost</th><th class="r">Sell</th><th class="r">Margin</th>
    <th class="r">GP</th><th class="r">Rep payout</th><th>Paid</th><th></th>
  </tr></thead><tbody>`;
  qs.sort((a,b)=>(a.commissionReport||'').localeCompare(b.commissionReport||'')).forEach(q=>{
    const mg=q.avgMargin||0;
    const mgClass=mg<30?'mg-red':mg<35?'mg-yellow':'mg-green';
    const name=q.quoteName||(q.quoteNum?'Quote #'+q.quoteNum:'Unnamed');
    html+=`<tr class='${q.paid?"paid-row":""}'>
      <td><strong>${name}</strong>${q.quoteNum?`<br><span style="font-size:11px;color:var(--text3)">#${q.quoteNum}</span>`:''}</td>
      <td>${q.rep||'N/A'}</td>
      <td style="font-size:11px">${q._bundle?`<span style="background:#e8f0fe;color:#1a6ec7;padding:1px 6px;border-radius:6px;font-weight:700">Bundle</span>`:'<span style="color:var(--text3)">Direct</span>'}</td>
      <td style="font-size:12px">${q.ihd||'N/A'}</td>
      <td style="font-size:12px;color:var(--red)">${q.commissionReport||'N/A'}</td>
      <td class="r">${fmt(q.totalNetCost)}</td>
      <td class="r">${fmt(q.totalSell)}</td>
      <td class="r"><span class="mg-pill ${mgClass}">${pct(mg)}</span></td>
      <td class="r">${fmt(q.grossProfit)}</td>
      <td class="r" style="color:var(--brown);font-weight:700">${fmt(q.totalRepComm)}</td>
      <td>${q.needsApproval?'<span class="approval-flag">&#9888; Approval</span>':''}</td>
      <td style="white-space:nowrap">${paidCell(q)}</td>
    </tr>`;
  });
  html+=`</tbody></table>`;
  wrap.innerHTML=html;
}

function renderApproval(){
  const qs=quotes.filter(q=>q.needsApproval);
  const wrap=document.getElementById('approval-table-wrap');
  if(!qs.length){wrap.innerHTML='<div class="empty" style="color:var(--green)">&#10003; No quotes require manager approval</div>';return;}
  let html=`<div style="padding:10px 18px;font-size:13px;color:var(--red);font-weight:600;border-bottom:1px solid var(--border)">&#9888; ${qs.length} quote${qs.length!==1?'s':''} require manager approval</div>`;
  html+=`<table><thead><tr>
    <th>Quote</th><th>Rep</th><th>Source</th><th>IHD</th><th>Commission report</th>
    <th class="r">Sell</th><th class="r">Avg margin</th><th>Low-margin lines</th>
  </tr></thead><tbody>`;
  qs.forEach(q=>{
    const lowLines=(q.lines||[]).filter(l=>l.margin<30).map(l=>`${l.name} (${pct(l.margin)})`).join(', ');
    html+=`<tr>
      <td><strong>${q.quoteName||q.quoteNum||'Unnamed'}</strong></td>
      <td>${q.rep||'N/A'}</td>
      <td>${q.ihd||'N/A'}</td>
      <td style="color:var(--red)">${q.commissionReport||'N/A'}</td>
      <td class="r">${fmt(q.totalSell)}</td>
      <td class="r"><span class="mg-pill mg-red">${pct(q.avgMargin)}</span></td>
      <td style="font-size:12px;color:var(--text3)">${lowLines}</td>
    </tr>`;
  });
  html+=`</tbody></table>`;
  wrap.innerHTML=html;
}

// ── Firebase Integration ─────────────────────────────────────────────────
// Uses Firebase Realtime Database for real-time sync across all devices
const FIREBASE_DB_URL = "https://toro-commission-318b4-default-rtdb.firebaseio.com";

// Firebase REST API helpers — no SDK needed, works in plain HTML
async function fbGet(path) {
  try {
    const res = await fetch(`${FIREBASE_DB_URL}/${path}.json`);
    if (!res.ok) return null;
    return await res.json();
  } catch(e) { console.warn('Firebase read failed:', e.message); return null; }
}

async function fbSet(path, data) {
  try {
    const res = await fetch(`${FIREBASE_DB_URL}/${path}.json`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });
    return res.ok;
  } catch(e) { console.warn('Firebase write failed:', e.message); return false; }
}

async function fbPatch(path, data) {
  try {
    const res = await fetch(`${FIREBASE_DB_URL}/${path}.json`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });
    return res.ok;
  } catch(e) { console.warn('Firebase patch failed:', e.message); return false; }
}

// Long-polling for real-time updates (SSE/EventSource)
let fbListeners = {};
function fbListen(path, callback) {
  // Stop any existing listener on this path
  if (fbListeners[path]) {
    fbListeners[path].close();
  }
  try {
    const es = new EventSource(
      `${FIREBASE_DB_URL}/${path}.json`
    );
    es.addEventListener('put', e => {
      try { callback(JSON.parse(e.data)); } catch(err) {}
    });
    es.addEventListener('patch', e => {
      try { callback(JSON.parse(e.data)); } catch(err) {}
    });
    es.onerror = () => {
      // Reconnect after 5 seconds on error
      setTimeout(() => fbListen(path, callback), 5000);
    };
    fbListeners[path] = es;
  } catch(e) {
    console.warn('Firebase listener failed:', e.message);
    // Fallback: poll every 10 seconds
    fbListeners[path] = { close: () => {} };
    setInterval(async () => {
      const data = await fbGet(path);
      if (data) callback({ data });
    }, 10000);
  }
}

function fbStopListening(path) {
  if (fbListeners[path]) {
    fbListeners[path].close();
    delete fbListeners[path];
  }
}


// ── Firebase sync for dashboard ──────────────────────────────────────────
async function loadAllFromFirebase() {
  const btn = document.getElementById('sync-btn');
  if(btn){ btn.textContent='Syncing...'; btn.disabled=true; }
  try {
    const REPS_FB = ['Shannon','Stephen','Julia','Lexi','Amy','Debbie'];
    let allQuotes = [];
    for (const rep of REPS_FB) {
      const data = await fbGet('quotes/' + rep.toLowerCase());
      if (!data) continue;
      Object.values(data).filter(Boolean).forEach(q => {
        if (!q.totalSell) return;
        allQuotes.push(q);
      });
    }
    const paidData = await fbGet('paid');
    if (paidData) {
      allQuotes.forEach(q => {
        const key = q.quoteNum ? q.quoteNum.replace(/[.#$\/\[\]]/g, '_') : null;
        if (key && paidData[key]) {
          q.paid = paidData[key].paid;
          q.paidDate = paidData[key].paidDate;
        }
      });
    }
    if (allQuotes.length) {
      quotes = allQuotes;
      localStorage.setItem('toro_quotes', JSON.stringify(quotes));
      document.getElementById('last-updated').textContent =
        quotes.length + ' quotes synced';
      render();
    }
  } catch(e) { console.error('Firebase sync failed:', e); }
  finally { if(btn){ btn.textContent='Sync from Firebase'; btn.disabled=false; } }
}

async function writePaidToFirebase(quoteNum, rep, paidDate) {
  if (!quoteNum) return;
  const key = quoteNum.replace(/[.#$\/\[\]]/g, '_');
  await fbSet('paid/' + key, { quoteNum, rep, paid: !!paidDate, paidDate: paidDate||'' });
  await fbPatch('quotes/' + rep.toLowerCase() + '/' + key, { paid: !!paidDate, paidDate: paidDate||'' });
}

function startDashboardListener() {
  fbListen('quotes', () => { loadAllFromFirebase(); });
  fbListen('paid', event => {
    if (!event || !event.data || typeof event.data !== 'object') return;
    let changed = false;
    Object.entries(event.data).forEach(([key, val]) => {
      if (!val) return;
      const qIdx = quotes.findIndex(q => q.quoteNum && q.quoteNum.replace(/[.#$\/\[\]]/g, '_') === key);
      if (qIdx >= 0) { quotes[qIdx].paid = val.paid; quotes[qIdx].paidDate = val.paidDate; changed = true; }
    });
    if (changed) { localStorage.setItem('toro_quotes', JSON.stringify(quotes)); render(); }
  });
}

// Init
render();
loadAllFromFirebase();
startDashboardListener();


// ── Paid status ───────────────────────────────────────────────────────────
async function markPaid(quoteNum, rep, paidDate){
  // Update in local quotes array
  const q = quotes.find(x=>x.quoteNum===quoteNum && x.rep===rep);
  if(q){
    q.paidDate = paidDate;
    q.paid = !!paidDate;
    localStorage.setItem('toro_quotes', JSON.stringify(quotes));
  }

  render();
}

function promptPaid(quoteNum, rep, currentDate){
  const d = prompt('Enter paid date (e.g. May 31):', currentDate||'');
  if(d===null) return; // cancelled
  markPaid(quoteNum, rep, d.trim());
}

function clearPaid(quoteNum, rep){
  if(!confirm('Mark this quote as unpaid?')) return;
  markPaid(quoteNum, rep, '');
}


function paidCell(q){
  if(q.paid){
    return '<span style="background:#e6f4ee;color:#1a7f4b;padding:2px 8px;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer" onclick="clearPaid(\''+q.quoteNum+'\',\''+q.rep+'\')" title="Click to mark unpaid">&#10003; '+(q.paidDate||'Paid')+'</span>';
  }
  return '<button onclick="promptPaid(\''+q.quoteNum+'\',\''+q.rep+'\',\''+( q.paidDate||'')+'\')" style="font-size:11px;padding:2px 8px;border:1px solid #ccc;border-radius:6px;background:#fff;cursor:pointer;color:#888">Mark paid</button>';
}


async function markAllPaid(period){
  const d = prompt('Enter paid date for all quotes in ' + period + ':', '');
  if(d === null) return;
  const date = d.trim();
  if(!date){ alert('Please enter a date.'); return; }
  const qs = quotes.filter(q=>q.commissionReport===period && !q.paid);
  if(!qs.length){ alert('All quotes in this period are already marked paid.'); return; }
  for(const q of qs){
    await markPaid(q.quoteNum, q.rep, date);
  }
}


function markAllPaidBtn(per){
  return '<button onclick="markAllPaid(this.dataset.per)" data-per="'+per+'" style="font-size:11px;padding:3px 10px;border:1px solid #ccc;border-radius:6px;background:#fff;cursor:pointer;color:#444;white-space:nowrap">Mark all paid</button>';
}


function downloadExcel(){
  if(!quotes.length){ alert('No data loaded yet.'); return; }
  const btn = document.getElementById('dl-btn');
  if(btn){ btn.textContent='Building...'; btn.disabled=true; }

  try{
    const wb = XLSX.utils.book_new();
    const REPS = ['Shannon','Stephen','Julia','Lexi','Amy','Debbie'];
    const HEADERS = ['Quote #','Quote Name','Rep','IHD','Commission Period',
      'Commission Split','Has AM','Total Sell','Net Cost','Gross Profit',
      'Avg Margin %','Rep Payout','House Profit','AM Payout',
      'Amended','Has Adjustments','Last Updated','Paid Date','Paid'];

    // Summary sheet
    const summaryData = [
      ['TORO Commission Summary'],
      ['Generated: ' + new Date().toLocaleString()],
      [],
      ['Rep','Quotes','Total Sell','Gross Profit','Avg Margin %','Rep Payout','House Profit','AM Payout']
    ];
    REPS.forEach(rep => {
      const qs = quotes.filter(q=>q.rep===rep);
      if(!qs.length) return;
      const sell = qs.reduce((a,q)=>a+(q.totalSell||0),0);
      const net  = qs.reduce((a,q)=>a+(q.totalNetCost||0),0);
      const gp   = qs.reduce((a,q)=>a+(q.grossProfit||0),0);
      const rc   = qs.reduce((a,q)=>a+(q.totalRepComm||0),0);
      const hp   = qs.reduce((a,q)=>a+(q.totalHouseProfit||0),0);
      const am   = qs.reduce((a,q)=>a+(q.totalAM||0),0);
      const mg   = sell>0?Math.round((1-net/sell)*1000)/10:0;
      summaryData.push([rep, qs.length, sell, gp, mg/100, rc, hp, am]);
    });
    // Totals row
    const allSell = quotes.reduce((a,q)=>a+(q.totalSell||0),0);
    const allNet  = quotes.reduce((a,q)=>a+(q.totalNetCost||0),0);
    const allGP   = quotes.reduce((a,q)=>a+(q.grossProfit||0),0);
    const allRC   = quotes.reduce((a,q)=>a+(q.totalRepComm||0),0);
    const allHP   = quotes.reduce((a,q)=>a+(q.totalHouseProfit||0),0);
    const allAM   = quotes.reduce((a,q)=>a+(q.totalAM||0),0);
    const allMg   = allSell>0?Math.round((1-allNet/allSell)*1000)/10:0;
    summaryData.push(['TOTAL', quotes.length, allSell, allGP, allMg/100, allRC, allHP, allAM]);

    const wsSummary = XLSX.utils.aoa_to_sheet(summaryData);
    // Format currency and percent columns
    const fmtCurrency = '"$"#,##0.00';
    const fmtPct = '0.0%';
    for(let r=4; r<=summaryData.length; r++){
      ['C','D','F','G','H'].forEach(col => {
        const cell = wsSummary[col+r];
        if(cell) cell.z = fmtCurrency;
      });
      const pctCell = wsSummary['E'+r];
      if(pctCell) pctCell.z = fmtPct;
    }
    wsSummary['!cols'] = [{wch:14},{wch:10},{wch:14},{wch:14},{wch:12},{wch:14},{wch:14},{wch:12}];
    XLSX.utils.book_append_sheet(wb, wsSummary, 'Summary');

    // One sheet per rep with all their quotes
    REPS.forEach(rep => {
      const qs = quotes.filter(q=>q.rep===rep);
      if(!qs.length) return;
      const rows = [HEADERS];
      qs.sort((a,b)=>(a.commissionReport||'').localeCompare(b.commissionReport||'')).forEach(q=>{
        rows.push([
          q.quoteNum||'', q.quoteName||'', q.rep||'', q.ihd||'', q.commissionReport||'',
          q.commissionSplit||'standard', q.hasAM?'Yes':'No',
          q.totalSell||0, q.totalNetCost||0, q.grossProfit||0,
          (q.avgMargin||0)/100,
          q.totalRepComm||0, q.totalHouseProfit||0, q.totalAM||0,
          q.amended?'Yes':'No', (q.adjustments||[]).length>0?'Yes':'No',
          q.loadedAt ? new Date(q.loadedAt).toLocaleString() : '',
          q.paidDate||'', q.paid?'Yes':'No'
        ]);
      });
      const ws = XLSX.utils.aoa_to_sheet(rows);
      // Format columns
      for(let r=2; r<=rows.length; r++){
        ['H','I','J','L','M','N'].forEach(col=>{ const c=ws[col+r]; if(c) c.z='"$"#,##0.00'; });
        const pc=ws['K'+r]; if(pc) pc.z='0.0%';
      }
      ws['!cols']=[{wch:10},{wch:22},{wch:10},{wch:12},{wch:16},{wch:14},{wch:8},
        {wch:12},{wch:12},{wch:12},{wch:10},{wch:12},{wch:12},{wch:10},
        {wch:8},{wch:14},{wch:20},{wch:12},{wch:6}];
      XLSX.utils.book_append_sheet(wb, ws, rep);
    });

    // All quotes sheet
    const allRows = [HEADERS];
    quotes.sort((a,b)=>(a.commissionReport||'').localeCompare(b.commissionReport||'')).forEach(q=>{
      allRows.push([
        q.quoteNum||'', q.quoteName||'', q.rep||'', q.ihd||'', q.commissionReport||'',
        q.commissionSplit||'standard', q.hasAM?'Yes':'No',
        q.totalSell||0, q.totalNetCost||0, q.grossProfit||0,
        (q.avgMargin||0)/100,
        q.totalRepComm||0, q.totalHouseProfit||0, q.totalAM||0,
        q.amended?'Yes':'No', (q.adjustments||[]).length>0?'Yes':'No',
        q.loadedAt ? new Date(q.loadedAt).toLocaleString() : '',
        q.paidDate||'', q.paid?'Yes':'No'
      ]);
    });
    const wsAll = XLSX.utils.aoa_to_sheet(allRows);
    wsAll['!cols']=[{wch:10},{wch:22},{wch:10},{wch:12},{wch:16},{wch:14},{wch:8},
      {wch:12},{wch:12},{wch:12},{wch:10},{wch:12},{wch:12},{wch:10},
      {wch:8},{wch:14},{wch:20},{wch:12},{wch:6}];
    XLSX.utils.book_append_sheet(wb, wsAll, 'All Quotes');

    const date = new Date().toLocaleDateString('en-US',{month:'2-digit',day:'2-digit',year:'numeric'}).replace(/\//g,'-');
    XLSX.writeFile(wb, 'TORO_Commission_Data_'+date+'.xlsx');

  } catch(err){
    console.error('Excel export failed:', err);
    alert('Export failed: ' + err.message);
  } finally {
    if(btn){ btn.textContent='\u2913 Download Excel'; btn.disabled=false; }
  }
}


function exportPaidUpdates(){
  const paidQuotes = quotes.filter(q=>q.paid && q.paidDate);
  if(!paidQuotes.length){ alert('No paid quotes to export.'); return; }
  
  // Group by rep and create one bundle per rep
  const byRep = {};
  paidQuotes.forEach(q=>{
    if(!byRep[q.rep]) byRep[q.rep]=[];
    byRep[q.rep].push({
      quoteNum: q.quoteNum,
      quoteName: q.quoteName,
      rep: q.rep,
      paid: true,
      paidDate: q.paidDate,
      // Include full quote data so portal can match and update
      totalSell: q.totalSell,
      totalNetCost: q.totalNetCost,
      grossProfit: q.grossProfit,
      avgMargin: q.avgMargin,
      totalRepComm: q.totalRepComm,
      totalHouseProfit: q.totalHouseProfit,
      totalAM: q.totalAM,
      commissionReport: q.commissionReport,
      ihd: q.ihd,
      commissionSplit: q.commissionSplit,
      hasAM: q.hasAM,
      adjustments: q.adjustments||[]
    });
  });

  Object.entries(byRep).forEach(([rep, qs])=>{
    const bundle = {
      type: 'commission_bundle',
      subtype: 'paid_update',
      rep,
      exportedAt: new Date().toLocaleString(),
      quotes: qs,
      totals: { repPayout: qs.reduce((a,q)=>a+(q.totalRepComm||0),0) }
    };
    const blob = new Blob([JSON.stringify(bundle,null,2)],{type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'TORO_PaidUpdate_'+rep+'_'+new Date().toLocaleDateString('en-US').replace(/\//g,'-')+'.json';
    a.click();
    URL.revokeObjectURL(a.href);
  });
}
