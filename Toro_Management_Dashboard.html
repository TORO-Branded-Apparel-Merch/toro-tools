<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>TORO Management Dashboard</title>
<style>
:root{
  --red:#BC112A;--red-dark:#9e0f22;--red-light:#fff0f2;--red-gradient:linear-gradient(160deg,#BC112A 0%,#E9553A 100%);
  --green:#1a7f4b;--green-bg:#e8f5ee;
  --orange:#C46A1E;--orange-bg:#fff3e0;
  --bg:#F5F5F7;--surface:#fff;--border:#E2E3E6;
  --text:#1a1a1f;--text2:#444;--text3:#888;
  --radius:10px;--radius-sm:6px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
#gate{position:fixed;inset:0;background:#fff;display:flex;align-items:center;justify-content:center;z-index:10000;}
.gate-box{background:#fff;border:1px solid var(--border);border-radius:12px;padding:40px 36px;max-width:380px;width:90%;text-align:center;box-shadow:0 4px 24px rgba(0,0,0,0.08);}
.gate-box h2{font-size:22px;font-weight:700;color:var(--red);margin-bottom:6px;}
.gate-box p{font-size:14px;color:var(--text3);margin-bottom:24px;}
.gate-box input{width:100%;padding:11px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:15px;margin-bottom:14px;}
.gate-box input:focus{outline:none;border-color:var(--red);}
.gate-box button{width:100%;padding:11px;background:var(--red);color:#fff;border:none;border-radius:var(--radius-sm);font-size:15px;font-weight:600;cursor:pointer;}
.gate-box .error{color:var(--red);font-size:13px;margin-top:8px;min-height:18px;}
.header{background:var(--red-gradient,var(--red));color:#fff;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,0.15);}
.header h1{font-size:20px;font-weight:700;}
.hdr-right{display:flex;gap:10px;align-items:center;}
.hdr-btn{padding:7px 16px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;cursor:pointer;border:none;background:rgba(255,255,255,0.2);color:#fff;}
.container{max-width:1100px;margin:0 auto;padding:24px 16px;}
.tabs{display:flex;background:#fff;border-bottom:1px solid var(--border);margin-bottom:24px;}
.tab{padding:12px 22px;font-size:14px;font-weight:600;color:var(--text3);border-bottom:3px solid transparent;cursor:pointer;}
.tab.active{color:var(--red);border-bottom-color:var(--red);}
.section-title{font-size:16px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px;}
.badge{background:var(--red);color:#fff;border-radius:10px;padding:1px 8px;font-size:12px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;}
.rep-section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:20px;overflow:hidden;}
.rep-header{padding:14px 20px;background:#f8f8fa;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.rep-header h3{font-size:15px;font-weight:700;}
.rep-body{padding:16px 20px;}
.quote-row{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);font-size:13px;}
.quote-row:last-child{border-bottom:none;}
.quote-row .th{font-weight:600;color:var(--text3);font-size:12px;}
.totals-row{display:flex;justify-content:flex-end;gap:20px;padding:10px 0 0;font-size:13px;font-weight:600;}
.btn{padding:7px 14px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all 0.15s;}
.btn-red{background:var(--red);color:#fff;}
.btn-red:hover{background:var(--red-dark);}
.btn-green{background:var(--green);color:#fff;}
.btn-green:hover{background:#156b3e;}
.btn-outline{background:#fff;color:var(--red);border:1.5px solid var(--red);}
.btn-outline:hover{background:var(--red-light);}
.btn-gray{background:#f0f0f0;color:var(--text2);border:1px solid var(--border);}
.btn-gray:hover{background:#e5e5e5;}
.margin-badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700;}
.margin-ok{background:#e8f5ee;color:#1a7f4b;}
.margin-warn{background:#fff0f2;color:#BC112A;}
.margin-low{background:#fff3e0;color:#c46a1e;}
.approval-card{border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px;}
.approval-card .ac-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;}
.approval-card .ac-meta{font-size:13px;color:var(--text3);}
.ac-actions{display:flex;gap:8px;flex-wrap:wrap;}
.summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:24px;}
.summary-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;text-align:center;}
.summary-card .sc-val{font-size:26px;font-weight:700;color:var(--red);}
.summary-card .sc-lbl{font-size:12px;color:var(--text3);margin-top:4px;}
.notes-thread{margin-top:10px;background:#f8f8fa;border-radius:var(--radius-sm);padding:12px;max-height:200px;overflow-y:auto;}
.note-item{margin-bottom:8px;font-size:13px;}
.note-item .note-author{font-weight:700;color:var(--red);}
.note-item .note-time{color:var(--text3);font-size:11px;}
.paid-indicator{display:inline-block;padding:2px 10px;border-radius:10px;font-size:12px;font-weight:600;background:var(--green-bg);color:var(--green);}
#bam-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:9999;align-items:center;justify-content:center;}
#error-banner{display:none;position:fixed;top:0;left:0;right:0;background:#BC112A;color:#fff;padding:10px 20px;font-size:14px;z-index:9998;text-align:center;}
.sync-dot{width:8px;height:8px;border-radius:50%;background:#1a7f4b;display:inline-block;margin-right:4px;}
.sync-dot.syncing{background:#ffd54f;animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>

<div id="error-banner">⚠️ Something went wrong. Please contact management. <button onclick="document.getElementById('error-banner').style.display='none'" style="background:none;border:none;color:#fff;cursor:pointer;font-size:16px;margin-left:10px;">✕</button></div>
<script>
window.onerror = function(msg,src,line,col,err) { console.error('Global error:',msg,src,line); document.getElementById('error-banner').style.display='block'; return false; };
window.addEventListener('unhandledrejection', function(e) { console.error('Unhandled rejection:',e.reason); document.getElementById('error-banner').style.display='block'; });
</script>

    <div id="bam-btns" style="display:flex;gap:10px;justify-content:flex-end;"></div>
  </div>
</div>

function bamAlert(msg, cb) {
  document.getElementById('bam-msg').innerHTML = msg;
  const btns = document.getElementById('bam-btns');
  btns.innerHTML = '';
  const ok = document.createElement('button');
  ok.textContent = 'OK';
  ok.style.cssText = 'padding:8px 22px;background:#BC112A;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:14px;font-weight:600;';
  ok.onclick = async () => {
    document.getElementById('bam-overlay').style.display='none';
    if(cb) { try { await cb(true); } catch(e) { console.error('bamConfirm cb error:',e); } }
  };
  btns.appendChild(ok);
  document.getElementById('bam-overlay').style.display='flex';
}
function bamConfirm(msg, cb) {
  document.getElementById('bam-msg').innerHTML = msg;
  const btns = document.getElementById('bam-btns');
  btns.innerHTML = '';
  const cancel = document.createElement('button');
  cancel.textContent = 'Cancel';
  cancel.style.cssText = 'padding:8px 18px;background:#f0f0f0;color:#333;border:none;border-radius:6px;cursor:pointer;font-size:14px;';
  cancel.onclick = () => { document.getElementById('bam-overlay').style.display='none'; if(cb) cb(false); };
  const ok = document.createElement('button');
  ok.textContent = 'Yes, continue';
  ok.style.cssText = 'padding:8px 18px;background:#BC112A;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:14px;font-weight:600;';
  ok.onclick = async () => {
    document.getElementById('bam-overlay').style.display='none';
    if(cb) { try { await cb(true); } catch(e) { console.error('bamConfirm cb error:',e); } }
  };
  btns.appendChild(cancel);
  btns.appendChild(ok);
  document.getElementById('bam-overlay').style.display='flex';
}
function bamPrompt(msg, defaultVal, cb) {
  document.getElementById('bam-msg').innerHTML = msg + '<br><textarea id="bam-input" style="width:100%;margin-top:10px;padding:8px;border:1px solid #ddd;border-radius:6px;font-size:14px;min-height:70px;">'+(defaultVal||'')+'</textarea>';
  const btns = document.getElementById('bam-btns');
  btns.innerHTML = '';
  const cancel = document.createElement('button');
  cancel.textContent = 'Cancel';
  cancel.style.cssText = 'padding:8px 18px;background:#f0f0f0;color:#333;border:none;border-radius:6px;cursor:pointer;font-size:14px;';
  cancel.onclick = () => { document.getElementById('bam-overlay').style.display='none'; if(cb) cb(null); };
  const ok = document.createElement('button');
  ok.textContent = 'Submit';
  ok.style.cssText = 'padding:8px 18px;background:#BC112A;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:14px;font-weight:600;';
  ok.onclick = async () => {
    const v=document.getElementById('bam-input').value;
    document.getElementById('bam-overlay').style.display='none';
    if(cb) {
      try { await cb(v); }
      catch(e) { console.error('bamPrompt cb error:',e); setTimeout(()=>bamAlert('Something went wrong: '+e.message),100); }
    }
  };
  btns.appendChild(cancel);
  btns.appendChild(ok);
  document.getElementById('bam-overlay').style.display='flex';
  setTimeout(()=>document.getElementById('bam-input')?.focus(),50);
}

async function fbSet(path, val) {
  const url = FIREBASE_DB_URL + '/' + path + '.json';
  const method = val === null ? 'DELETE' : 'PUT';
  try {
    const r = await fetch(url, { method, headers:{'Content-Type':'application/json'}, body:val===null?undefined:JSON.stringify(val) });
    return r.ok;
  } catch(e) {
    console.error('fbSet failed:', path, e.message);
    return false;
  }
}
async function fbGet(path) {
  const r = await fetch(FIREBASE_DB_URL + '/' + path + '.json');
  if(!r.ok) throw new Error('HTTP ' + r.status);
  return await r.json();
}

  const handler = e => {
    try {
      const parsed = JSON.parse(e.data);
      // For patch events, merge into the existing data structure
      cb(parsed);
    } catch(err) { console.error('fbListen parse error', err); }
  };
  es.addEventListener('put', handler);
  es.addEventListener('patch', handler);
  es.onerror = err => console.error('fbListen error', path, err);
  return es;
}
function fbKey(q) {
  const raw = q._fbKey || q.quoteNum || ('idx_' + Date.now());
  return raw.replace(/[.#$\/\[\]\s]/g, '_');
}
function quoteTotal(q, type) {
  // Use direct exported fields first
  if(type==='sell') return parseFloat(q.totalSell)||parseFloat(q.sell)||0;
  if(type==='net') return parseFloat(q.totalNetCost)||parseFloat(q.net)||0;
  return 0;
}
function quoteComm(q) {
  // Use direct exported commission field
  if(q.totalRepComm!=null) return parseFloat(q.totalRepComm)||0;
  // Fall back to calculation
  const sell=quoteTotal(q,'sell'), net=quoteTotal(q,'net');
  const gp=sell-net;
  const split=q.commissionSplit||q.split||'standard';
  const repPct=split==='ho_75_25'?0.25:split==='ho_50_50'?0.50:split==='ho_25_75'?0.75:0.50;
  return gp*repPct;
}
function marginBadge(net, sell) {
  if(!sell) return '';
  const m=(sell-net)/sell*100;
  const cls=m>=30?'margin-ok':m>=20?'margin-low':'margin-warn';
  return `<span class="margin-badge ${cls}">${m.toFixed(1)}%</span>`;
}
function setSyncing(on) {
  const dot=document.getElementById('sync-dot'), lbl=document.getElementById('sync-label');
  if(dot) dot.classList.toggle('syncing',on);
  if(lbl) lbl.textContent=on?'Syncing...':'Live';
}

function submitPw() {
  if(localStorage.getItem(LOCK_KEY)) { document.getElementById('pw-error').textContent='Account locked. Contact management.'; return; }
  const val=document.getElementById('pw-input').value;
  const attempts=parseInt(localStorage.getItem(ATTEMPTS_KEY)||'0');
  if(val===DASH_PW) {
    localStorage.removeItem(ATTEMPTS_KEY);
    localStorage.setItem('toro_session_dash', Date.now()+(4*60*60*1000));
    document.getElementById('gate').style.display='none';
    document.getElementById('app').style.display='';
    init();
  } else {
    const n=attempts+1;
    localStorage.setItem(ATTEMPTS_KEY,n);
    if(n>=5) { localStorage.setItem(LOCK_KEY,'1'); document.getElementById('pw-error').textContent='Account locked after 5 failed attempts.'; }
    else document.getElementById('pw-error').textContent=`Incorrect. ${5-n} attempt(s) remaining.`;
  }
}
document.getElementById('pw-input').addEventListener('keydown', e=>{ if(e.key==='Enter') submitPw(); });

async function init() {
  setSyncing(true);
  await loadAll();
  await loadFeedback();
  startListeners();
  render();
  setSyncing(false);
}

async function loadAll() {
  for(const rep of REPS) {
    try {
      const data = await fbGet('quotes/' + rep.toLowerCase());
      if(data && typeof data==='object') {
        allQuotes[rep] = Object.entries(data)
          .filter(([k,v])=>v&&typeof v==='object')
          .map(([k,v])=>{return {...v, _fbKey:k};} );
      } else {
        allQuotes[rep] = [];
      }
    } catch(e) { allQuotes[rep]=[]; console.error('loadAll error',rep,e); }
    try {
      const apData = await fbGet('approvals/' + rep.toLowerCase());
      approvals[rep.toLowerCase()] = (apData && typeof apData==='object') ? apData : {};
    } catch(e) { approvals[rep.toLowerCase()]={}; }
  }
}

function startListeners() {
  for(const rep of REPS) {
    const rl = rep.toLowerCase();
    fbListen('quotes/'+rl, data => {
      if(!data) return;
      if(data.path && data.path !== '/' && data.data !== undefined) {
        // Patch event - update single quote
        const key = data.path.replace(/^\//, '').split('/')[0];
        if(!allQuotes[rep]) allQuotes[rep] = [];
        if(data.data === null) {
          allQuotes[rep] = allQuotes[rep].filter(q=>q._fbKey!==key);
        } else {
          const idx = allQuotes[rep].findIndex(q=>q._fbKey===key);
          const q = {...data.data, _fbKey:key};
          if(idx>=0) allQuotes[rep][idx]=q; else allQuotes[rep].push(q);
        }
      } else if(data.data && typeof data.data==='object') {
        allQuotes[rep] = Object.entries(data.data)
          .filter(([k,v])=>v&&typeof v==='object')
          .map(([k,v])=>{return {...v, _fbKey:k};});
      } else if(data.data===null) {
        allQuotes[rep]=[];
      }
      render();
    });
    fbListen('approvals/'+rl, data => {
      if(!data) return;
      if(data.path && data.path !== '/' && data.data) {
        // Patch event - partial update, merge into existing
        if(!approvals[rl]) approvals[rl] = {};
        const key = data.path.replace(/^\//, '');
        if(data.data === null) {
          delete approvals[rl][key];
        } else {
          approvals[rl][key] = data.data;
        }
      } else if(data.data && typeof data.data === 'object') {
        // Put event - full replace
        approvals[rl] = data.data;
      } else if(data.data === null) {
        approvals[rl] = {};
      }
      render();
    });
  }
  fbListen('feedback', data => {
    if(data && data.data && typeof data.data==='object') {
      feedbackData = data.data;
      const unread=Object.values(feedbackData).filter(f=>!f.read).length;
      const badge=document.getElementById('feedback-badge');
      if(badge){badge.style.display=unread?'':'none';badge.textContent=unread;}
      if(currentTab==='feedback') renderFeedback();
    }
  });
}

function switchTab(tab) {
  currentTab = tab;
  ['approvals','commission','by-rep','all','feedback'].forEach(t=>{
    const el = document.getElementById('tab-'+t);
    if(el) el.classList.toggle('active', t===tab);
  });
  render();
}

function render() {
  renderSummary();
  if(currentTab==='approvals') renderApprovals();
  else if(currentTab==='commission') renderCommission();
  else if(currentTab==='by-rep') renderByRep();
  else if(currentTab==='feedback') renderFeedback();
  else renderAll();
}

// ── Approval actions ───────────────────────────────────────────────────────
async function approveQuote(repLower, encKey) {
  const key = decodeURIComponent(encKey);
  bamPrompt('Approval note (optional):', '', async note => {
    if(note === null) return;
    await new Promise(r=>setTimeout(r,100));
    try {
      const existing = (approvals[repLower]||{})[key]||{};
      const thread = existing.thread||[];
      if(note) thread.push({role:'management',author:'Management',text:note,time:new Date().toISOString(),readByRep:false});
      thread.push({role:'management',author:'Management',text:'Quote approved.',type:'status',time:new Date().toISOString(),readByRep:false});
      // Mark all rep messages as read
      thread.forEach(m=>{ if(m.role==='rep') m.readByMgmt=true; });
      const updated = {...existing, status:'approved', decidedAt:new Date().toISOString(), thread, note:note||''};
      const ok = await fbSet('approvals/'+repLower+'/'+key, updated);
      if(!ok) throw new Error('Firebase write returned false');
      if(!approvals[repLower]) approvals[repLower]={};
      approvals[repLower][key] = updated;
      const rep = REPS.find(r=>r.toLowerCase()===repLower);
      const q = (allQuotes[rep]||[]).find(x=>fbKey(x)===key);
      if(q) { q.workflowStatus='active'; await fbSet('quotes/'+repLower+'/'+fbKey(q), q); }
      render();
      bamAlert('Approved. The rep will see this in their portal.');
    } catch(e) { console.error('approveQuote error:',e); bamAlert('Error saving. Check connection and try again.'); }
  });
}

async function rejectQuote(repLower, encKey) {
  const key = decodeURIComponent(encKey);
  bamPrompt('Rejection reason (required — will be shown to the rep):', '', async note => {
    if(note === null) return;
    if(!note.trim()) { bamAlert('A rejection reason is required.'); return; }
    await new Promise(r=>setTimeout(r,100));
    try {
      const existing = (approvals[repLower]||{})[key]||{};
      const thread = existing.thread||[];
      thread.push({role:'management',author:'Management',text:note,time:new Date().toISOString(),readByRep:false});
      thread.push({role:'management',author:'Management',text:'Quote rejected.',type:'status',time:new Date().toISOString(),readByRep:false});
      thread.forEach(m=>{ if(m.role==='rep') m.readByMgmt=true; });
      const updated = {...existing, status:'rejected', decidedAt:new Date().toISOString(), thread, note};
      const ok = await fbSet('approvals/'+repLower+'/'+key, updated);
      if(!ok) throw new Error('Firebase write returned false');
      if(!approvals[repLower]) approvals[repLower]={};
      approvals[repLower][key] = updated;
      const rep = REPS.find(r=>r.toLowerCase()===repLower);
      const q = (allQuotes[rep]||[]).find(x=>fbKey(x)===key);
      if(q) { q.workflowStatus='needsApproval'; await fbSet('quotes/'+repLower+'/'+fbKey(q), q); }
      render();
      bamAlert('Rejected. The rep will see your note and can reply.');
    } catch(e) { console.error('rejectQuote error:',e); bamAlert('Error saving. Check connection and try again.'); }
  });
}

async function sendMgmtReply(repLower, encKey) {
  const key = decodeURIComponent(encKey);
  const ta = document.getElementById('mgmt_reply_'+encKey);
  const text = ta?.value?.trim();
  if(!text) { bamAlert('Enter a message before sending.'); return; }
  try {
    const existing = (approvals[repLower]||{})[key]||{};
    const thread = existing.thread||[];
    thread.push({role:'management',author:'Management',text,time:new Date().toISOString(),readByRep:false});
    thread.forEach(m=>{ if(m.role==='rep') m.readByMgmt=true; });
    existing.thread = thread;
    await fbSet('approvals/'+repLower+'/'+key+'/thread', thread);
    if(!approvals[repLower]) approvals[repLower]={};
    approvals[repLower][key] = existing;
    if(ta) ta.value='';
    render();
  } catch(e) { console.error('sendMgmtReply error:',e); bamAlert('Error sending reply.'); }
}

async function addNote(repLower, encKey) {
  // Legacy — now replaced by sendMgmtReply inline, but kept for compatibility
  sendMgmtReply(repLower, encKey);
}

async function dismissApproval(repLower, encKey) {
  const key = decodeURIComponent(encKey);
  bamConfirm('Dismiss this approval request? This cannot be undone.', async ok => {
    if(!ok) return;
    try {
      await fbSet('approvals/'+repLower+'/'+key, null);
      if(approvals[repLower]) delete approvals[repLower][key];
      render();
    } catch(e) { console.error('dismissApproval error:',e); bamAlert('Error dismissing. Please try again.'); }
  });
}

async function markPaid(rep, encKey) {
  const key = decodeURIComponent(encKey);
  bamConfirm('Mark this commission as paid?', async ok => {
    if(!ok) return;
    try {
      const rl = rep.toLowerCase();
      const q = (allQuotes[rep]||[]).find(x=>fbKey(x)===key);
      if(q) {
        q.workflowStatus = 'paid';
        await fbSet('quotes/'+rl+'/'+fbKey(q), q);
        await fbSet('paid/'+rl+'/'+fbKey(q), true);
        bamAlert('Marked as paid!');
      }
    } catch(e) { console.error('markPaid error:',e); bamAlert('Error marking paid.'); }
  });
}

function exportExcel() {
  // Build CSV
  let rows = [['Rep','Quote Name','Quote #','Period','IHD','Net','Sell','Margin %','Commission','Status']];
  for(const rep of REPS) {
    (allQuotes[rep]||[]).forEach(q=>{
      const net=quoteTotal(q,'net'), sell=quoteTotal(q,'sell');
      const margin=sell>0?((sell-net)/sell*100).toFixed(1):0;
      const comm=quoteComm(q);
      rows.push([
        rep,
        (q.quoteName||'').replace(/,/g,' '),
        (q.quoteNum||'').replace(/,/g,' '),
        q.period||'',
        q.ihd||'',
        net.toFixed(2),
        sell.toFixed(2),
        margin,
        comm.toFixed(2),
        q.workflowStatus||'active'
      ]);
    });
  }
  const csv = rows.map(r=>r.join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'TORO_Commission_' + new Date().toISOString().split('T')[0] + '.csv';
  a.click();
}

// ── Feedback tab ──────────────────────────────────────────────────────────────
async function loadFeedback() {
  try {
    const data = await fbGet('feedback');
    feedbackData = data||{};
    const unread = Object.values(feedbackData).filter(f=>!f.read).length;
    const badge = document.getElementById('feedback-badge');
    if(badge) { badge.style.display=unread?'':'none'; badge.textContent=unread; }
  } catch(e) { console.error('loadFeedback error:',e); }
}
function renderFeedback() {
  const items = Object.entries(feedbackData).sort((a,b)=>b[1].sentAt>a[1].sentAt?1:-1);
  if(!items.length) {
    document.getElementById('tab-content').innerHTML='<div class="card" style="color:var(--text3);text-align:center;padding:32px;">No feedback yet.</div>';
    return;
  }
  let html = '';
  items.forEach(([key,f])=>{
    const dt=f.sentAt?new Date(f.sentAt).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}):'';
    html+=`<div class="card" style="${f.read?'opacity:.7':''}">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
        <div><strong>${f.rep||'Unknown'}</strong> <span style="font-size:11px;color:var(--text3);">${dt}</span></div>
        ${!f.read?`<button class="btn btn-gray" style="font-size:11px;padding:4px 10px;" onclick="markFeedbackRead('${key}')">Mark read</button>`:'<span style="font-size:11px;color:var(--text3);">Read</span>'}
      </div>
      <div style="font-size:14px;">${f.message||''}</div>
    </div>`;
  });
  document.getElementById('tab-content').innerHTML = html;
}
async function markFeedbackRead(key) {
  try {
    await fbSet('feedback/'+key+'/read', true);
    if(feedbackData[key]) feedbackData[key].read=true;
    renderFeedback();
    const unread=Object.values(feedbackData).filter(f=>!f.read).length;
    const badge=document.getElementById('feedback-badge');
    if(badge){badge.style.display=unread?'':'none';badge.textContent=unread;}
  } catch(e) { console.error('markFeedbackRead error:',e); }
}

function runDashReport() {
  const allQ=[];
  for(const rep of REPS)(allQuotes[rep]||[]).forEach(q=>allQ.push({...q,_rep:rep}));
  const repFilter=document.getElementById('drpt-rep')?.value||'';
  const dateType=document.getElementById('drpt-date-type')?.value||'';
  const dateFrom=document.getElementById('drpt-from')?.value||'';
  const dateTo=document.getElementById('drpt-to')?.value||'';
  const clientFilter=document.getElementById('drpt-client')?.value||'';
  let filtered=allQ.filter(q=>{
    if(repFilter&&q._rep!==repFilter) return false;
    if(clientFilter&&(q.clientCompany||q.clientName||'')!==clientFilter) return false;
    if(dateType&&(dateFrom||dateTo)){
      let dv=dateType==='quoteDate'?(q.quoteDate||q.exportedAt||''):dateType==='ihd'?(q.ihd||''):(q.commissionReport||'');
      if(!dv) return false;
      const d=new Date(dv);if(isNaN(d.getTime())) return false;
      if(dateFrom&&d<new Date(dateFrom)) return false;
      if(dateTo&&d>new Date(dateTo+'T23:59:59')) return false;
    }
    return true;
  });
  if(!filtered.length){bamAlert('No quotes match the filters.');return;}
  if(typeof XLSX==='undefined'){bamAlert('Excel library not loaded. Please refresh.');return;}
  const HEADERS=['Quote #','Quote name','Client','Company','Rep','Quote date','IHD','Commission period','Split','Sell','Net','GP','Margin %','Rep payout','House profit','Status'];
  const rows=[HEADERS,...filtered.map(q=>{
    const sell=quoteTotal(q,'sell'),net=quoteTotal(q,'net');
    const comm=quoteComm(q);
    return[q.quoteNum||'',q.quoteName||'',q.clientName||'',q.clientCompany||'',q._rep,q.quoteDate||q.exportedAt||'',q.ihd||'',q.commissionReport||'',q.commissionSplit||'standard',sell,net,sell-net,sell>0?((sell-net)/sell*100).toFixed(1):0,comm,sell-net-comm,q.workflowStatus||'active'];
  })];
  const wb=XLSX.utils.book_new();
  const ws=XLSX.utils.aoa_to_sheet(rows);
  XLSX.utils.book_append_sheet(wb,ws,'All Quotes');
  REPS.forEach(rep=>{
    const repRows=filtered.filter(q=>q._rep===rep);
    if(!repRows.length) return;
    const wsR=XLSX.utils.aoa_to_sheet([HEADERS,...repRows.map(q=>{const sell=quoteTotal(q,'sell'),net=quoteTotal(q,'net'),comm=quoteComm(q);return[q.quoteNum||'',q.quoteName||'',q.clientName||'',q.clientCompany||'',rep,q.quoteDate||q.exportedAt||'',q.ihd||'',q.commissionReport||'',q.commissionSplit||'standard',sell,net,sell-net,sell>0?((sell-net)/sell*100).toFixed(1):0,comm,sell-net-comm,q.workflowStatus||'active'];})]);
    XLSX.utils.book_append_sheet(wb,wsR,rep);
  });
  XLSX.writeFile(wb,'TORO_Dashboard_Report_'+new Date().toLocaleDateString('en-US').replace(/\//g,'-')+'.xlsx');
  document.getElementById('dash-report-modal').style.display='none';
}

// ── Pre-approve/reject flagged quotes (not yet formally submitted) ──────────
async function preApproveQuote(repLower, encKey) {
  const key = decodeURIComponent(encKey);
  bamPrompt('Pre-approval note (optional):', '', async note => {
    if(note === null) return;
    try {
      const rep = REPS.find(r=>r.toLowerCase()===repLower);
      const q = (allQuotes[rep]||[]).find(x=>fbKey(x)===key);
      if(!q) { bamAlert('Quote not found.'); return; }
      // Write approval record
      const approval = {
        rep: rep, quoteNum: q.quoteNum, quoteName: q.quoteName,
        status: 'approved', note: note||'', decidedAt: new Date().toISOString(),
        sellTotal: q.totalSell||0, netTotal: q.totalNetCost||0,
        margin: q.avgMargin||0, clientName: q.clientName||'', clientCompany: q.clientCompany||'',
        notes: note ? [{author:'Management', text:note, time:new Date().toISOString()}] : []
      };
      await fbSet('approvals/'+repLower+'/'+key, approval);
      if(!approvals[repLower]) approvals[repLower]={};
      approvals[repLower][key] = approval;
      // Update quote status
      q.workflowStatus = 'active';
      await fbSet('quotes/'+repLower+'/'+fbKey(q), q);
      render();
      bamAlert('Quote pre-approved! The rep has been notified.');
    } catch(e) { console.error('preApproveQuote error:',e); bamAlert('Error saving. Please try again.'); }
  });
}

async function preRejectQuote(repLower, encKey) {
  const key = decodeURIComponent(encKey);
  bamPrompt('Rejection reason (will be shown to the rep):', '', async note => {
    if(note === null) return;
    try {
      const rep = REPS.find(r=>r.toLowerCase()===repLower);
      const q = (allQuotes[rep]||[]).find(x=>fbKey(x)===key);
      if(!q) { bamAlert('Quote not found.'); return; }
      const approval = {
        rep: rep, quoteNum: q.quoteNum, quoteName: q.quoteName,
        status: 'rejected', note: note||'', decidedAt: new Date().toISOString(),
        sellTotal: q.totalSell||0, netTotal: q.totalNetCost||0,
        margin: q.avgMargin||0, clientName: q.clientName||'', clientCompany: q.clientCompany||'',
        notes: note ? [{author:'Management', text:note, time:new Date().toISOString()}] : []
      };
      await fbSet('approvals/'+repLower+'/'+key, approval);
      if(!approvals[repLower]) approvals[repLower]={};
      approvals[repLower][key] = approval;
      q.workflowStatus = 'rejected';
      await fbSet('quotes/'+repLower+'/'+fbKey(q), q);
      render();
      bamAlert('Quote rejected. The rep will see your note.');
    } catch(e) { console.error('preRejectQuote error:',e); bamAlert('Error saving. Please try again.'); }
  });
}
