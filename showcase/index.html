<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>TORO Showcase</title>
<style>
  :root{
    --ink:#1a1a1f; --paper:#F5F5F7; --card:#fff;
    --lanyard:#BC112A; --lanyard-dark:#9e0f22;
    --red-gradient:linear-gradient(160deg,#BC112A 0%,#E9553A 100%);
    --red-light:#fff0f2;
    --tag:#ffd54f; --ok:#1a7f4b; --line:#E2E3E6; --mut:#888;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--ink);background:var(--paper);}
  .sp-app{max-width:720px;margin:0 auto;min-height:100vh;background:var(--paper);}
  .sp-head{background:var(--red-gradient);color:#fff;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,0.15);}
  .sp-head h1{margin:0;font-size:19px;font-weight:700;}
  .sp-head .sub{margin:2px 0 0;font-size:12.5px;opacity:.85;}
  .sp-tabbtn{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:8px;padding:7px 12px;font-size:12.5px;cursor:pointer;white-space:nowrap;}
  .sp-body{padding:20px;}
  .sp-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px;}
  .sp-label{display:block;font-size:12px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;color:var(--mut);margin-bottom:6px;}
  .sp-input{width:100%;padding:11px 12px;font-size:16px;border:1.5px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);}
  .sp-input:focus{outline:2px solid var(--lanyard);outline-offset:1px;border-color:var(--lanyard);}
  .sp-btn{display:inline-block;background:var(--lanyard);color:#fff;border:none;border-radius:10px;padding:12px 18px;font-size:15px;font-weight:600;cursor:pointer;}
  .sp-btn:hover{background:var(--lanyard-dark);}
  .sp-btn[disabled]{opacity:.5;cursor:default;}
  .sp-btn.ghost{background:#fff;color:var(--lanyard);border:1.5px solid var(--lanyard);}
  .sp-btn.small{padding:8px 12px;font-size:13px;border-radius:8px;}
  .sp-btn.danger{background:#fff;color:#b3261e;border:1.5px solid #b3261e;}
  .sp-vendorgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;}
  .sp-vcard{background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;text-align:left;font-size:14px;font-weight:600;color:var(--ink);}
  .sp-vcard .code{display:block;margin-top:5px;font-size:11px;font-weight:700;letter-spacing:1px;color:var(--mut);}
  .sp-badge{background:var(--tag);border-radius:8px;padding:10px 14px;font-size:13.5px;font-weight:600;display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;}
  .sp-badge button{background:none;border:none;text-decoration:underline;font-size:12px;cursor:pointer;color:var(--ink);}
  .sp-drop{border:2px dashed var(--lanyard);border-radius:12px;background:var(--red-light);padding:26px 16px;text-align:center;cursor:pointer;transition:all .15s;}
  .sp-drop:hover{background:#ffe4e8;}
  .sp-drop .big{font-size:15px;font-weight:700;color:var(--lanyard);margin:0 0 4px;}
  .sp-drop .small{font-size:12.5px;color:var(--mut);margin:0;}
  .sp-thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px;margin-top:12px;}
  .sp-thumb img{width:100%;height:90px;object-fit:cover;border-radius:8px;border:1px solid var(--line);display:block;}
  .sp-thumb .cap{font-size:10.5px;color:var(--mut);margin-top:2px;line-height:1.25;max-height:26px;overflow:hidden;}
  .sp-note{font-size:12.5px;color:var(--mut);margin-top:8px;}
  .sp-toast{background:var(--ok);color:#fff;border-radius:9px;padding:10px 14px;font-size:14px;font-weight:600;margin-top:12px;display:none;}
  .sp-adminrow{border-top:1px solid var(--line);padding:12px 0;}
  .sp-adminrow:first-child{border-top:none;}
  .sp-who{font-weight:700;font-size:14.5px;}
  .sp-meta{font-size:12px;color:var(--mut);margin-top:2px;}
  .sp-empty{color:var(--mut);font-size:14px;padding:14px 0;}
  .sp-h2{font-size:16px;margin:0 0 10px;font-weight:700;}
  .sp-vhead{display:flex;justify-content:space-between;align-items:baseline;margin:6px 0 4px;}
  .sp-count{font-size:12px;color:var(--mut);}
  .sp-back{background:none;border:none;color:var(--lanyard);font-size:13px;cursor:pointer;padding:0;margin-bottom:12px;text-decoration:underline;}
  .sp-lb{list-style:none;margin:0;padding:0;}
  .sp-lb li{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px;}
  .sp-lb li:first-child{border-top:none;}
  .sp-lb .rank{width:26px;height:26px;border-radius:50%;background:var(--paper);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex:none;}
  .sp-lb li:nth-child(1) .rank{background:var(--tag);border-color:var(--tag);}
  .sp-lb .bar{flex:1;height:8px;background:var(--paper);border-radius:4px;overflow:hidden;}
  .sp-lb .bar i{display:block;height:100%;background:var(--red-gradient);border-radius:4px;}
  .sp-lb .n{font-weight:700;width:34px;text-align:right;font-size:13px;}
  .sp-lb .vn{width:38%;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .sp-noteinput{margin-top:10px;display:none;gap:8px;}
  .sp-noteinput.open{display:flex;}
  .sp-qr{margin-top:6px;}
  .sp-qr a{font-size:12px;color:var(--lanyard);}
</style>
</head>

const body=document.getElementById('sp-body'), modeBtn=document.getElementById('sp-modebtn'), sub=document.getElementById('sp-sub');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');

// Remember attendee identity on their own phone so it survives page reloads
// (localStorage is fine here — this is a normal hosted page, not an artifact)
try{ const saved=localStorage.getItem('sp-attendee'); if(saved) attendee=JSON.parse(saved); }catch(e){}
function saveAttendee(){ try{ localStorage.setItem('sp-attendee',JSON.stringify(attendee)); }catch(e){} }

// ---- data ----
async function loadVendors(){
  const snap=await getDocs(query(collection(db,'vendors'),orderBy('name')));
  vendors=snap.docs.map(d=>({id:d.id,...d.data()}));
}
async function addVendor(name){
  const v={name,slug:slug(name),code:'TBL-'+String(vendors.length+1).padStart(2,'0')};
  const refDoc=await addDoc(collection(db,'vendors'),v);
  vendors.push({id:refDoc.id,...v});
}
async function loadSubs(){
  const snap=await getDocs(query(collection(db,'submissions'),orderBy('ts','desc')));
  return snap.docs.map(d=>({id:d.id,...d.data()}));
}
async function submitPhoto(full,thumb,note){
  // Full photo lives in its own document (fetched only when tapped in Organizer view);
  // the lead record carries just a small thumbnail, keeping the admin view fast at scale.
  if(full.length > 950000) throw new Error('Photo too large after compression — try again.');
  const photoDoc=await addDoc(collection(db,'photos'),{ img:full, vendorId:currentVendor.id, tsClient:Date.now() });
  await addDoc(collection(db,'submissions'),{
    vendorId:currentVendor.id, vendorName:currentVendor.name,
    name:attendee.name, company:attendee.company||'',
    note:note||'', thumb, photoId:photoDoc.id,
    ts:serverTimestamp(), tsClient:Date.now()
  });
}
async function fetchFullPhoto(photoId){
  const d=await getDoc(doc(db,'photos',photoId));
  return d.exists()? d.data().img : null;
}
let jszipPromise=null;
function loadJSZip(){
  if(window.JSZip) return Promise.resolve(window.JSZip);
  if(!jszipPromise){
    jszipPromise=new Promise((res,rej)=>{
      const sc=document.createElement('script');
      sc.src='https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
      sc.onload=()=>res(window.JSZip);
      sc.onerror=()=>rej(new Error('Could not load ZIP library — check connection.'));
      document.head.appendChild(sc);
    });
  }
  return jszipPromise;
}
// filename-safe version of a person/vendor name
const fsafe=s=>String(s||'').trim().replace(/[^a-zA-Z0-9 _-]/g,'').replace(/\s+/g,'-').slice(0,40)||'unknown';

// ---- image compression ----
function loadImage(file){
  return new Promise((res,rej)=>{
    const img=new Image(); const url=URL.createObjectURL(file);
    img.onload=()=>res({img,url});
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('bad image'));};
    img.src=url;
  });
}
function scale(img,max,quality){
  let{width:w,height:h}=img;
  if(Math.max(w,h)>max){const k=max/Math.max(w,h);w=Math.round(w*k);h=Math.round(h*k);}
  const c=document.createElement('canvas');c.width=w;c.height=h;
  c.getContext('2d').drawImage(img,0,0,w,h);
  return c.toDataURL('image/jpeg',quality);
}
async function compressBoth(file){
  const {img,url}=await loadImage(file);
  const full=scale(img,900,0.72);    // stored in its own doc, fetched on demand
  const thumb=scale(img,240,0.55);   // ~8-20KB, rides along with the lead record
  URL.revokeObjectURL(url);
  return {full,thumb};
}

// ---------- ATTENDEE ----------
function vendorFromUrl(){
  const p=new URLSearchParams(location.search).get('vendor');
  if(!p) return null;
  return vendors.find(v=>v.slug===p || v.id===p) || null;
}

function renderVendorPicker(){
  sub.textContent='Snap what you love. We\u2019ll follow up.';
  if(!vendors.length){
    body.innerHTML='<div class="sp-card"><div class="sp-empty">No vendor tables set up yet. Organizers: switch to Organizer view to add vendors.</div></div>';
    return;
  }
  body.innerHTML='<div class="sp-card"><span class="sp-label">Which table are you at?</span>'+
    '<div class="sp-vendorgrid">'+vendors.map(v=>'<button class="sp-vcard" data-id="'+v.id+'">'+esc(v.name)+'<span class="code">'+esc(v.code)+'</span></button>').join('')+'</div></div>';
  body.querySelectorAll('.sp-vcard').forEach(b=>b.onclick=()=>{ currentVendor=vendors.find(v=>v.id===b.dataset.id); attendee?renderDrop():renderIdentify(); });
}

function renderIdentify(){
  body.innerHTML='<button class="sp-back" id="sp-back">&larr; All tables</button>'+
    '<div class="sp-card"><div class="sp-h2">'+esc(currentVendor.name)+'</div>'+
    '<p class="sp-note" style="margin:0 0 12px">Tell us who you are once — your phone remembers for every table today.</p>'+
    '<span class="sp-label">Your name</span><input class="sp-input" id="sp-name" autocomplete="name" placeholder="Jordan Rivera" style="margin-bottom:12px">'+
    '<span class="sp-label">Company</span><input class="sp-input" id="sp-co" autocomplete="organization" placeholder="Rivera Interiors" style="margin-bottom:16px">'+
    '<button class="sp-btn" id="sp-go">Start snapping</button></div>';
  document.getElementById('sp-back').onclick=renderVendorPicker;
  document.getElementById('sp-go').onclick=()=>{
    const n=document.getElementById('sp-name').value.trim(), c=document.getElementById('sp-co').value.trim();
    if(!n){document.getElementById('sp-name').focus();return;}
    attendee={name:n,company:c}; saveAttendee(); renderDrop();
  };
}

function renderDrop(){
  body.innerHTML='<button class="sp-back" id="sp-back">&larr; All tables</button>'+
    '<div class="sp-badge"><span>&#127915; '+esc(attendee.name)+(attendee.company?' &middot; '+esc(attendee.company):'')+'</span><button id="sp-notme">Not you?</button></div>'+
    '<div class="sp-card"><div class="sp-h2">'+esc(currentVendor.name)+'</div>'+
    '<div class="sp-drop" id="sp-drop"><p class="big">Tap to take a photo</p><p class="small">Point at the item you love — that\u2019s it.</p></div>'+
    '<input type="file" id="sp-file" accept="image/*" capture="environment" multiple style="display:none">'+
    '<div class="sp-noteinput" id="sp-noteui"><input class="sp-input" id="sp-notetext" placeholder="Optional note — e.g. loved the walnut finish" maxlength="140"><button class="sp-btn small" id="sp-save">Save</button></div>'+
    '<div class="sp-thumbs" id="sp-thumbs"></div>'+
    '<div class="sp-toast" id="sp-toast"></div></div>';
  document.getElementById('sp-back').onclick=renderVendorPicker;
  document.getElementById('sp-notme').onclick=()=>{attendee=null;try{localStorage.removeItem('sp-attendee');}catch(e){};renderIdentify();};
  const fileInput=document.getElementById('sp-file');
  document.getElementById('sp-drop').onclick=()=>fileInput.click();
  fileInput.onchange=()=>{ if(!fileInput.files.length)return;
    pendingFiles=[...fileInput.files]; fileInput.value='';
    document.getElementById('sp-noteui').classList.add('open');
    document.getElementById('sp-notetext').focus();
  };
  document.getElementById('sp-save').onclick=async ()=>{
    const btn=document.getElementById('sp-save'); btn.disabled=true; btn.textContent='Saving…';
    const noteEl=document.getElementById('sp-notetext'); const note=noteEl.value.trim(); noteEl.value='';
    const thumbs=document.getElementById('sp-thumbs');
    for(const f of pendingFiles){
      try{
        const {full,thumb}=await compressBoth(f);
        await submitPhoto(full,thumb,note);
        const d=document.createElement('div');d.className='sp-thumb';
        d.innerHTML='<img alt="Uploaded photo"><div class="cap">'+esc(note)+'</div>';
        d.querySelector('img').src=thumb; thumbs.prepend(d);
        const t=document.getElementById('sp-toast');
        t.textContent='Saved! '+currentVendor.name+' will follow up.';
        t.style.display='block'; setTimeout(()=>t.style.display='none',2500);
      }catch(e){ console.error(e); alert('That photo didn\u2019t save — check your connection and try again.'); }
    }
    pendingFiles=[]; btn.disabled=false; btn.textContent='Save';
    document.getElementById('sp-noteui').classList.remove('open');
  };
}

// ---------- ORGANIZER ----------
function toCSV(subs){
  const rows=[['Vendor','Attendee name','Attendee company','Note','Timestamp']];
  subs.forEach(r=>rows.push([r.vendorName,r.name,r.company||'',r.note||'',new Date(r.tsClient||0).toISOString()]));
  return rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\r\n');
}

async function renderAdmin(){
  if(ORGANIZER_PASSCODE && !adminUnlocked){
    const pass=prompt('Organizer passcode:');
    if(pass!==ORGANIZER_PASSCODE){ mode='attendee'; modeBtn.textContent='Organizer view'; renderVendorPicker(); return; }
    adminUnlocked=true;
  }
  sub.textContent='Vendor tables, leads & leaderboard';
  body.innerHTML='<div class="sp-empty">Loading submissions…</div>';
  const subs=await loadSubs();
  const byVendor={}; vendors.forEach(v=>byVendor[v.id]={vendor:v,recs:[]});
  subs.forEach(r=>{ if(byVendor[r.vendorId]) byVendor[r.vendorId].recs.push(r); });
  const all=Object.values(byVendor);
  const totalPhotos=subs.length;
  const base=location.origin+location.pathname;

  const lb=all.map(x=>({name:x.vendor.name,count:x.recs.length})).sort((a,b)=>b.count-a.count);
  const maxC=Math.max(1,...lb.map(l=>l.count));

  let html='<div class="sp-card"><div class="sp-h2">Vendor tables</div>'+
    '<div style="display:flex;gap:8px;margin-bottom:10px"><input class="sp-input" id="sp-vname" placeholder="Add vendor, e.g. Maple &amp; Co. Furniture" style="flex:1"><button class="sp-btn small" id="sp-vadd">Add</button></div>'+
    '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px">'+
      '<button class="sp-btn small ghost" id="sp-csv"'+(totalPhotos?'':' disabled')+'>Export leads CSV</button>'+
      '<button class="sp-btn small ghost" id="sp-zip"'+(totalPhotos?'':' disabled')+'>Download all photos (ZIP)</button>'+
    '</div>'+
    '<p class="sp-note">Each vendor has its own link below — turn each into a QR code for its table. Scanning takes attendees straight to that vendor\u2019s upload page.</p>'+
    (vendors.length?vendors.map(v=>'<div class="sp-adminrow"><span class="sp-who">'+esc(v.name)+'</span><div class="sp-meta">Code '+esc(v.code)+'</div><div class="sp-qr"><a href="'+base+'?vendor='+esc(v.slug)+'">'+base+'?vendor='+esc(v.slug)+'</a></div></div>').join(''):'<div class="sp-empty">No vendors yet.</div>')+
    '</div>';

  html+='<div class="sp-card"><div class="sp-h2">&#127942; Table leaderboard</div>';
  if(!totalPhotos){ html+='<div class="sp-empty">No photos yet — the race hasn\u2019t started.</div>'; }
  else{
    html+='<ul class="sp-lb">'+lb.map((l,i)=>'<li><span class="rank">'+(i+1)+'</span><span class="vn">'+esc(l.name)+'</span><span class="bar"><i style="width:'+Math.round(l.count/maxC*100)+'%"></i></span><span class="n">'+l.count+'</span></li>').join('')+'</ul>';
  }
  html+='</div>';

  html+='<div class="sp-card"><div class="sp-h2">Submissions ('+totalPhotos+')</div>';
  if(!vendors.length) html+='<div class="sp-empty">Add vendors to start collecting.</div>';
  for(const {vendor,recs} of all){
    html+='<div class="sp-vhead"><span class="sp-who">'+esc(vendor.name)+'</span><span class="sp-count">'+recs.length+' photo'+(recs.length===1?'':'s')+'</span></div>';
    if(!recs.length){ html+='<div class="sp-empty" style="padding:4px 0 14px">Nothing yet.</div>'; continue; }
    const byPerson={};
    recs.forEach(r=>{const pk=r.name+'|'+(r.company||'');(byPerson[pk]=byPerson[pk]||[]).push(r);});
    for(const pk of Object.keys(byPerson)){
      const rs=byPerson[pk];
      html+='<div class="sp-adminrow"><span class="sp-who">'+esc(rs[0].name)+'</span>'+
        '<div class="sp-meta">'+(rs[0].company?esc(rs[0].company)+' &middot; ':'')+new Date(rs[0].tsClient||0).toLocaleString()+'</div>'+
        '<div class="sp-thumbs">'+rs.map(r=>'<div class="sp-thumb"><img src="'+r.thumb+'" alt="Photo from '+esc(r.name)+'" loading="lazy" data-pid="'+esc(r.photoId||'')+'" style="cursor:zoom-in">'+(r.note?'<div class="cap">'+esc(r.note)+'</div>':'')+'</div>').join('')+'</div></div>';
    }
  }
  html+='</div>';
  body.innerHTML=html;

  document.getElementById('sp-vadd').onclick=async ()=>{
    const inp=document.getElementById('sp-vname'); const name=inp.value.trim(); if(!name)return;
    try{ await addVendor(name); renderAdmin(); }catch(e){ alert('Could not add vendor: '+e.message); }
  };
  document.getElementById('sp-csv').onclick=()=>{
    const blob=new Blob([toCSV(subs)],{type:'text/csv'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='toro-showcase-leads.csv';a.click();
    URL.revokeObjectURL(a.href);
  };

  document.getElementById('sp-zip').onclick=async ()=>{
    const btn=document.getElementById('sp-zip');
    btn.disabled=true; const orig='Download all photos (ZIP)';
    try{
      btn.textContent='Preparing…';
      const JSZip=await loadJSZip();
      const zip=new JSZip();

      // Organize: folder per vendor -> folder per person; filename = person_table_number.jpg
      // Track per person+vendor counters for numbering
      const counters={};
      const ordered=[...subs].sort((a,b)=>(a.tsClient||0)-(b.tsClient||0));
      let done=0;
      for(const r of ordered){
        if(!r.photoId){ done++; continue; }
        btn.textContent='Fetching '+(done+1)+'/'+subs.length+'…';
        const img=await fetchFullPhoto(r.photoId);
        done++;
        if(!img) continue;
        const person=fsafe(r.name)+(r.company?'_'+fsafe(r.company):'');
        const table=fsafe(r.vendorName);
        const ck=person+'|'+table;
        counters[ck]=(counters[ck]||0)+1;
        const num=String(counters[ck]).padStart(2,'0');
        const fname=person+'_'+table+'_'+num+'.jpg';
        const folder=fsafe(r.vendorName)+'/'+(r.name.trim())+(r.company?' ('+r.company.trim()+')':'');
        const base64=img.split(',')[1];
        zip.file(folder+'/'+fname, base64, {base64:true});
        if(r.note){
          // append note to a per-person notes file inside their folder
          const notesPath=folder+'/notes.txt';
          const existing=zip.file(notesPath);
          let txt = existing ? await existing.async('string') : '';
          txt += fname+': '+r.note+'\r\n';
          zip.file(notesPath, txt);
        }
      }
      // include the leads CSV inside the zip too
      zip.file('toro-showcase-leads.csv', toCSV(subs));

      btn.textContent='Zipping…';
      const blob=await zip.generateAsync({type:'blob'},(meta)=>{ btn.textContent='Zipping… '+Math.round(meta.percent)+'%'; });
      const a=document.createElement('a');
      a.href=URL.createObjectURL(blob); a.download='toro-showcase-photos.zip'; a.click();
      URL.revokeObjectURL(a.href);
      btn.textContent=orig; btn.disabled=false;
    }catch(e){
      console.error(e);
      alert('ZIP failed: '+(e.message||'unknown error')+' — try again.');
      btn.textContent=orig; btn.disabled=false;
    }
  };

  // tap a thumbnail -> fetch full-size photo on demand and show overlay
  body.querySelectorAll('.sp-thumb img[data-pid]').forEach(im=>{
    im.onclick=async ()=>{
      const pid=im.dataset.pid; if(!pid) return;
      im.style.opacity='.5';
      try{
        const full=await fetchFullPhoto(pid);
        im.style.opacity='';
        if(!full){ alert('Full photo not found.'); return; }
        const ov=document.createElement('div');
        ov.style.cssText='position:fixed;inset:0;background:rgba(20,25,35,.92);display:flex;align-items:center;justify-content:center;z-index:99;cursor:zoom-out;padding:20px';
        ov.innerHTML='<img src="'+full+'" style="max-width:100%;max-height:100%;border-radius:10px" alt="Full size photo">';
        ov.onclick=()=>ov.remove();
        document.body.appendChild(ov);
      }catch(e){ im.style.opacity=''; alert('Could not load photo — check connection.'); }
    };
  });
}

// ---- boot ----
modeBtn.onclick=()=>{
  mode=mode==='attendee'?'admin':'attendee';
  modeBtn.textContent=mode==='attendee'?'Organizer view':'Attendee view';
  mode==='attendee'?renderVendorPicker():renderAdmin();
};
(async ()=>{
  try{
    await loadVendors();
    const fromUrl=vendorFromUrl();
    if(fromUrl){ currentVendor=fromUrl; attendee?renderDrop():renderIdentify(); }
    else renderVendorPicker();
  }catch(e){
    console.error(e);
    body.innerHTML='<div class="sp-card"><div class="sp-empty">Could not connect to Firebase. Check that your firebaseConfig is filled in and Firestore/Storage are enabled.</div></div>';
  }
})();
</script>
</body>
