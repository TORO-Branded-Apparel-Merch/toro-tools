<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>TORO Julia Commission Portal</title>
<style>
:root{
  --red:#C41E1E;--red-dark:#9e1818;--red-light:#fff0f0;
  --green:#1a7f4b;--green-bg:#e8f5ee;
  --orange:#C46A1E;--orange-bg:#fff3e0;
  --bg:#F5F5F7;--surface:#fff;--border:#E2E3E6;
  --text:#1a1a1f;--text2:#444;--text3:#888;
  --radius:10px;--radius-sm:6px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
/* Gate */
#gate{position:fixed;inset:0;background:#fff;display:flex;align-items:center;justify-content:center;z-index:10000;}
.gate-box{background:#fff;border:1px solid var(--border);border-radius:12px;padding:40px 36px;max-width:380px;width:90%;text-align:center;box-shadow:0 4px 24px rgba(0,0,0,0.08);}
.gate-box h2{font-size:22px;font-weight:700;color:var(--red);margin-bottom:6px;}
.gate-box p{font-size:14px;color:var(--text3);margin-bottom:24px;}
.gate-box input{width:100%;padding:11px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:15px;margin-bottom:14px;}
.gate-box input:focus{outline:none;border-color:var(--red);}
.gate-box button{width:100%;padding:11px;background:var(--red);color:#fff;border:none;border-radius:var(--radius-sm);font-size:15px;font-weight:600;cursor:pointer;}
.gate-box .error{color:var(--red);font-size:13px;margin-top:8px;min-height:18px;}
/* Header */
.header{background:var(--red);color:#fff;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,0.15);}
.header h1{font-size:18px;font-weight:700;}
.header .hdr-right{display:flex;gap:10px;align-items:center;}
.hdr-btn{padding:6px 14px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;cursor:pointer;border:none;}
/* Layout */
.container{max-width:900px;margin:0 auto;padding:20px 16px;}
/* Section titles */
.section-title{font-size:15px;font-weight:700;padding:10px 0 8px;display:flex;align-items:center;gap:8px;}
.section-title .badge{background:var(--red);color:#fff;border-radius:10px;padding:1px 8px;font-size:12px;}
/* Quote cards */
.quote-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:12px;overflow:hidden;transition:box-shadow 0.15s;}
.quote-card:hover{box-shadow:0 2px 12px rgba(0,0,0,0.07);}
.qc-header{padding:13px 16px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;}
.qc-meta{display:flex;flex-direction:column;gap:3px;}
.qc-title{font-size:15px;font-weight:700;}
.qc-sub{font-size:12px;color:var(--text3);}
.qc-actions{display:flex;gap:8px;align-items:center;flex-shrink:0;}
.qc-body{padding:14px 16px;border-top:1px solid var(--border);background:#fafafa;}
/* Status checkboxes */
.status-checks{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px;}
.status-check label{display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;padding:6px 12px;border-radius:20px;border:1px solid var(--border);background:#fff;transition:all 0.15s;user-select:none;}
.status-check label:hover{border-color:var(--red);}
.status-check input{accent-color:var(--green);width:15px;height:15px;}
.status-check.checked label{background:var(--green-bg);border-color:var(--green);}
/* Buttons */
.btn{padding:8px 16px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all 0.15s;}
.btn-red{background:var(--red);color:#fff;}
.btn-red:hover{background:var(--red-dark);}
.btn-green{background:var(--green);color:#fff;}
.btn-green:hover{background:#156b3e;}
.btn-outline{background:#fff;color:var(--red);border:1.5px solid var(--red);}
.btn-outline:hover{background:var(--red-light);}
.btn-gray{background:#f0f0f0;color:var(--text2);border:1px solid var(--border);}
.btn-gray:hover{background:#e5e5e5;}
.del-btn{background:#fff;border:1px solid #ddd;color:#c41e1e;padding:5px 12px;border-radius:var(--radius-sm);font-size:12px;font-weight:600;cursor:pointer;}
.del-btn:hover{background:var(--red-light);border-color:var(--red);}
/* Drop zone */
.drop-zone{border:2px dashed var(--border);border-radius:var(--radius);padding:28px;text-align:center;color:var(--text3);cursor:pointer;transition:all 0.15s;background:#fafafa;}
.drop-zone:hover,.drop-zone.over{border-color:var(--red);color:var(--red);background:var(--red-light);}
/* Summary cards (mini) */
.summary-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:20px;}
.summary-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;text-align:center;}
.summary-card .sc-val{font-size:22px;font-weight:700;color:var(--red);}
.summary-card .sc-lbl{font-size:12px;color:var(--text3);margin-top:4px;}
/* Approval/rejection styling */
.approval-pending{background:#fff8e1;border:1px solid #ffd54f;border-radius:var(--radius-sm);padding:8px 12px;font-size:13px;color:#b8860b;margin-bottom:8px;}
.rejection-note{background:var(--red-light);border:1px solid #f5c6c6;border-radius:var(--radius-sm);padding:8px 12px;font-size:13px;color:var(--red);margin-bottom:8px;}
.approved-note{background:var(--green-bg);border:1px solid #a5d6b8;border-radius:var(--radius-sm);padding:8px 12px;font-size:13px;color:var(--green);margin-bottom:8px;}
/* Archive */
.archive-toggle{font-size:13px;color:var(--text3);cursor:pointer;padding:8px 0;user-select:none;}
.archive-toggle:hover{color:var(--red);}
/* Change password */
#change-pw-panel{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:5000;align-items:center;justify-content:center;}
#change-pw-panel.open{display:flex;}
.pw-box{background:#fff;border-radius:12px;padding:32px;max-width:360px;width:90%;}
/* BAM Modal */
#bam-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:9999;align-items:center;justify-content:center;}
/* Sync indicator */
.sync-dot{width:8px;height:8px;border-radius:50%;background:#1a7f4b;display:inline-block;margin-right:6px;}
.sync-dot.syncing{background:#ffd54f;animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
/* Error banner */
#error-banner{display:none;position:fixed;top:0;left:0;right:0;background:#c41e1e;color:#fff;padding:10px 20px;font-size:14px;z-index:9998;text-align:center;}
@media(max-width:600px){
  .status-checks{gap:6px;}
  .qc-actions{flex-wrap:wrap;}
}
</style>
</head>
<body>

<!-- Error Banner -->
<div id="error-banner">⚠️ Something went wrong. Please contact management. <button onclick="document.getElementById('error-banner').style.display='none'" style="background:none;border:none;color:#fff;cursor:pointer;margin-left:10px;font-size:16px;">✕</button></div>

<!-- Global error handler -->
<script>
window.onerror = function(msg, src, line, col, err) {
  console.error('Global error:', msg, src, line);
  document.getElementById('error-banner').style.display = 'block';
  return false;
};
window.addEventListener('unhandledrejection', function(e) {
  console.error('Unhandled promise rejection:', e.reason);
  document.getElementById('error-banner').style.display = 'block';
});
</script>

<!-- BAM Modal -->
<div id="bam-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:9999;align-items:center;justify-content:center;">
  <div style="background:#fff;border-radius:12px;padding:28px 32px;max-width:420px;width:90%;box-shadow:0 8px 40px rgba(0,0,0,0.2);">
    <div style="font-size:17px;font-weight:700;color:#C41E1E;margin-bottom:12px;">🐂 BAM the Bull says</div>
    <div id="bam-msg" style="font-size:15px;color:#333;margin-bottom:22px;line-height:1.5;"></div>
    <div id="bam-btns" style="display:flex;gap:10px;justify-content:flex-end;"></div>
  </div>
</div>

<!-- Password Gate -->
<div id="gate">
  <div class="gate-box">
    <h2>🐂 TORO</h2>
    <p>Julia Commission Portal</p>
    <input type="password" id="pw-input" placeholder="Enter password" onkeydown="if(event.key==='Enter')submitPw()">
    <button onclick="submitPw()">Access Portal</button>
    <div class="error" id="pw-error"></div>
  </div>
</div>

<!-- Change Password Panel -->
<div id="change-pw-panel">
  <div class="pw-box">
    <h3 style="margin-bottom:16px;">Change Password</h3>
    <div style="margin-bottom:10px;"><label style="font-size:13px;font-weight:600;display:block;margin-bottom:5px;">Current Password</label>
      <input type="password" id="cp-current" style="width:100%;padding:9px;border:1px solid #ddd;border-radius:6px;font-size:14px;"></div>
    <div style="margin-bottom:10px;"><label style="font-size:13px;font-weight:600;display:block;margin-bottom:5px;">New Password</label>
      <input type="password" id="cp-new" style="width:100%;padding:9px;border:1px solid #ddd;border-radius:6px;font-size:14px;"></div>
    <div style="margin-bottom:16px;"><label style="font-size:13px;font-weight:600;display:block;margin-bottom:5px;">Confirm New Password</label>
      <input type="password" id="cp-confirm" style="width:100%;padding:9px;border:1px solid #ddd;border-radius:6px;font-size:14px;"></div>
    <div id="cp-error" style="color:#c41e1e;font-size:13px;min-height:18px;margin-bottom:12px;"></div>
    <div style="display:flex;gap:10px;">
      <button class="btn btn-gray" style="flex:1" onclick="closeChangePw()">Cancel</button>
      <button class="btn btn-red" style="flex:1" onclick="submitChangePw()">Change Password</button>
    </div>
  </div>
</div>

<!-- Main App -->
<div id="app" style="display:none;">
  <div class="header">
    <h1>🐂 Julia</h1>
    <div class="hdr-right">
      <span class="sync-dot" id="sync-dot"></span>
      <span style="font-size:12px;opacity:0.8;" id="sync-label">Live</span>
      <button class="hdr-btn" style="background:rgba(255,255,255,0.2);color:#fff;" onclick="openChangePw()">🔑 Password</button>
    </div>
  </div>
  <div class="container">
    <!-- Summary cards -->
    <div class="summary-cards" id="summary-cards"></div>
    <!-- Action bar -->
    <div id="action-bar" style="display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;align-items:center;">
      <div class="drop-zone" id="drop-zone" style="flex:1;min-width:200px;padding:14px;" onclick="document.getElementById('file-input').click()">
        📂 Drop or click to upload a quote JSON
      </div>
      <input type="file" id="file-input" accept=".json" style="display:none">
    </div>
    <!-- Sections -->
    <div id="section-approval"></div>
    <div id="section-ready"></div>
    <div id="section-active"></div>
    <div id="section-archive"></div>
  </div>
</div>

<script>
// ── Constants ──────────────────────────────────────────────────────────────
const REP = 'Julia';
const REP_LOWER = 'julia';
const STORAGE_KEY = 'toro_quotes_julia';
const PW_KEY = 'toro_pw_julia';
const LOCK_KEY = 'toro_lock_julia';
const ATTEMPTS_KEY = 'toro_attempts_julia';
const DEFAULT_PW = 'Toro#Zy7vL';
const FIREBASE_DB_URL = 'https://toro-commission-318b4-default-rtdb.firebaseio.com';

// ── BAM Modal ──────────────────────────────────────────────────────────────
function bamAlert(msg, cb) {
  document.getElementById('bam-msg').innerHTML = msg;
  const btns = document.getElementById('bam-btns');
  btns.innerHTML = '';
  const ok = document.createElement('button');
  ok.textContent = 'OK';
  ok.style.cssText = 'padding:8px 22px;background:#C41E1E;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:14px;font-weight:600;';
  ok.onclick = () => { document.getElementById('bam-overlay').style.display='none'; if(cb) cb(true); };
  btns.appendChild(ok);
  document.getElementById('bam-overlay').style.display='flex';
}
function bamConfirm(msg, cb) {
  document.getElementById('bam-msg').innerHTML = msg;
  const btns = document.getElementById('bam-btns');
  btns.innerHTML = '';
  const cancel = document.createElement('button');
  cancel.textContent = 'Cancel';
  cancel.style.cssText = 'padding:8px 18px;background:#f0f0f0;color:#333;border:none;border-radius:6px;cursor:pointer;font-size:14px;';
  cancel.onclick = () => { document.getElementById('bam-overlay').style.display='none'; if(cb) cb(false); };
  const ok = document.createElement('button');
  ok.textContent = 'Yes, continue';
  ok.style.cssText = 'padding:8px 18px;background:#C41E1E;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:14px;font-weight:600;';
  ok.onclick = () => { document.getElementById('bam-overlay').style.display='none'; if(cb) cb(true); };
  btns.appendChild(cancel);
  btns.appendChild(ok);
  document.getElementById('bam-overlay').style.display='flex';
}
function bamPrompt(msg, defaultVal, cb) {
  document.getElementById('bam-msg').innerHTML = msg + '<br><input id="bam-input" type="text" value="'+(defaultVal||'')+'" style="width:100%;margin-top:10px;padding:8px;border:1px solid #ddd;border-radius:6px;font-size:14px;">';
  const btns = document.getElementById('bam-btns');
  btns.innerHTML = '';
  const cancel = document.createElement('button');
  cancel.textContent = 'Cancel';
  cancel.style.cssText = 'padding:8px 18px;background:#f0f0f0;color:#333;border:none;border-radius:6px;cursor:pointer;font-size:14px;';
  cancel.onclick = () => { document.getElementById('bam-overlay').style.display='none'; if(cb) cb(null); };
  const ok = document.createElement('button');
  ok.textContent = 'OK';
  ok.style.cssText = 'padding:8px 18px;background:#C41E1E;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:14px;font-weight:600;';
  ok.onclick = () => { const v=document.getElementById('bam-input').value; document.getElementById('bam-overlay').style.display='none'; if(cb) cb(v); };
  btns.appendChild(cancel);
  btns.appendChild(ok);
  document.getElementById('bam-overlay').style.display='flex';
  setTimeout(()=>document.getElementById('bam-input')?.focus(),50);
}

// ── Firebase helpers ───────────────────────────────────────────────────────
async function fbSet(path, val) {
  const url = FIREBASE_DB_URL + '/' + path + '.json';
  const method = val === null ? 'DELETE' : 'PUT';
  try {
    const r = await fetch(url, {
      method,
      headers: {'Content-Type':'application/json'},
      body: val === null ? undefined : JSON.stringify(val)
    });
    if(!r.ok) throw new Error('HTTP ' + r.status);
  } catch(e) { console.error('fbSet error:', path, e); throw e; }
}
async function fbGet(path) {
  try {
    const r = await fetch(FIREBASE_DB_URL + '/' + path + '.json');
    if(!r.ok) throw new Error('HTTP ' + r.status);
    return await r.json();
  } catch(e) { console.error('fbGet error:', path, e); return null; }
}
function fbListen(path, cb) {
  const url = FIREBASE_DB_URL + '/' + path + '.json';
  const es = new EventSource(url);
  es.addEventListener('put', e => {
    try { cb(JSON.parse(e.data)); } catch(err) { console.error('fbListen parse error', err); }
  });
  es.onerror = err => console.error('fbListen error', path, err);
  return es;
}

// Key sanitizer — MUST be consistent everywhere
function fbKey(q) {
  const raw = q._fbKey || q.quoteNum || ('idx_' + Date.now());
  return raw.replace(/[.#$\/\[\]\s]/g, '_');
}

// ── State ──────────────────────────────────────────────────────────────────
let quotes = [];
let approvals = {};
let _saving = false;
let fbListenerActive = false;
let archiveOpen = false;

// ── Auth ───────────────────────────────────────────────────────────────────
function getStoredPw() { return localStorage.getItem(PW_KEY) || DEFAULT_PW; }
function submitPw() {
  const locked = localStorage.getItem(LOCK_KEY);
  if(locked) { document.getElementById('pw-error').textContent = 'Account locked after 5 failed attempts. Contact management.'; return; }
  const val = document.getElementById('pw-input').value;
  const attempts = parseInt(localStorage.getItem(ATTEMPTS_KEY)||'0');
  if(val === getStoredPw()) {
    localStorage.removeItem(ATTEMPTS_KEY);
    document.getElementById('gate').style.display = 'none';
    document.getElementById('app').style.display = '';
    init();
  } else {
    const newAttempts = attempts + 1;
    localStorage.setItem(ATTEMPTS_KEY, newAttempts);
    if(newAttempts >= 5) {
      localStorage.setItem(LOCK_KEY, '1');
      document.getElementById('pw-error').textContent = 'Account locked after 5 failed attempts. Contact management.';
    } else {
      document.getElementById('pw-error').textContent = `Incorrect password. ${5-newAttempts} attempt(s) remaining.`;
    }
  }
}
document.getElementById('pw-input').addEventListener('keydown', e => { if(e.key==='Enter') submitPw(); });

function openChangePw() { document.getElementById('change-pw-panel').classList.add('open'); }
function closeChangePw() { document.getElementById('change-pw-panel').classList.remove('open'); ['cp-current','cp-new','cp-confirm'].forEach(id=>document.getElementById(id).value=''); document.getElementById('cp-error').textContent=''; }
function submitChangePw() {
  const cur = document.getElementById('cp-current').value;
  const nw = document.getElementById('cp-new').value;
  const conf = document.getElementById('cp-confirm').value;
  if(cur !== getStoredPw()) { document.getElementById('cp-error').textContent = 'Current password is incorrect.'; return; }
  if(nw.length < 6) { document.getElementById('cp-error').textContent = 'New password must be at least 6 characters.'; return; }
  if(nw !== conf) { document.getElementById('cp-error').textContent = 'Passwords do not match.'; return; }
  localStorage.setItem(PW_KEY, nw);
  closeChangePw();
  bamAlert('Password changed successfully!');
}

// ── Init ───────────────────────────────────────────────────────────────────
function init() {
  // Load local cache first
  try {
    const cached = localStorage.getItem(STORAGE_KEY);
    if(cached) { quotes = JSON.parse(cached); }
  } catch(e) { quotes = []; }
  render();
  loadFromFirebase();
  startListeners();
}

async function loadFromFirebase() {
  setSyncing(true);
  try {
    // Firebase is source of truth
    const fbData = await fbGet('quotes/' + REP_LOWER);
    if(fbData && typeof fbData === 'object') {
      const fbQuotes = [];
      fbQuotes.forEach = Array.prototype.forEach.bind(Object.entries(fbData).map(([k,v]) => ({...v, _fbKey: k})));
      Object.entries(fbData).forEach(([k, v]) => {
        if(v && typeof v === 'object') {
          const q = {...v, _fbKey: k};
          if(!q.workflowStatus) q.workflowStatus = 'active';
          fbQuotes.push(q);
        }
      });
      quotes = fbQuotes;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(quotes));
      render();
    }
  } catch(e) { console.error('loadFromFirebase error:', e); }
  setSyncing(false);
}

function startListeners() {
  fbListenerActive = true;
  // Listen for changes to this rep's quotes
  fbListen('quotes/' + REP_LOWER, data => {
    if(_saving) return; // skip during our own saves
    if(data && data.data !== null && typeof data.data === 'object') {
      const fbQuotes = [];
      Object.entries(data.data).forEach(([k, v]) => {
        if(v && typeof v === 'object') {
          const q = {...v, _fbKey: k};
          if(!q.workflowStatus) q.workflowStatus = 'active';
          fbQuotes.push(q);
        }
      });
      quotes = fbQuotes;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(quotes));
      render();
    } else if(data && data.data === null) {
      quotes = [];
      localStorage.setItem(STORAGE_KEY, JSON.stringify(quotes));
      render();
    }
  });
  // Listen for paid status
  fbListen('paid/' + REP_LOWER, data => {
    if(data && data.data && typeof data.data === 'object') {
      let changed = false;
      Object.entries(data.data).forEach(([k, v]) => {
        const q = quotes.find(x => fbKey(x) === k);
        if(q && v === true) {
          q.workflowStatus = 'paid';
          changed = true;
        }
      });
      if(changed) { localStorage.setItem(STORAGE_KEY, JSON.stringify(quotes)); render(); }
    }
  });
  // Listen for approval decisions
  fbListen('approvals/' + REP_LOWER, data => {
    if(data && data.data && typeof data.data === 'object') {
      approvals = data.data;
      render();
    } else {
      approvals = {};
    }
  });
}

function setSyncing(on) {
  const dot = document.getElementById('sync-dot');
  const lbl = document.getElementById('sync-label');
  if(dot) dot.classList.toggle('syncing', on);
  if(lbl) lbl.textContent = on ? 'Syncing...' : 'Live';
}

// ── File drop ──────────────────────────────────────────────────────────────
(function() {
  const dz = document.getElementById('drop-zone');
  const fi = document.getElementById('file-input');
  dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('over'); });
  dz.addEventListener('dragleave', () => dz.classList.remove('over'));
  dz.addEventListener('drop', e => {
    e.preventDefault();
    dz.classList.remove('over');
    const file = e.dataTransfer.files[0];
    if(file) processFile(file);
  });
  fi.addEventListener('change', e => {
    e.stopPropagation();
    if(fi.files[0]) { processFile(fi.files[0]); fi.value=''; }
  });
})();

async function processFile(file) {
  try {
    const text = await file.text();
    const data = JSON.parse(text);
    // Check rep
    if(data.rep && data.rep.toLowerCase() !== REP.toLowerCase()) {
      bamAlert('This quote belongs to ' + data.rep + ', not ' + REP + '. Please upload it to the correct portal.');
      return;
    }
    const key = fbKey(data);
    // Check for duplicate
    const existing = quotes.findIndex(q => fbKey(q) === key);
    if(existing >= 0) {
      bamConfirm('A quote with the same Quote # already exists. Replace it?', async ok => {
        if(!ok) return;
        quotes.splice(existing, 1);
        // Remove approval for old version
        await fbSet('approvals/' + REP_LOWER + '/' + key, null);
        await addQuote(data);
      });
      return;
    }
    await addQuote(data);
  } catch(e) {
    console.error('processFile error:', e);
    bamAlert('Could not read that file. Make sure it\'s a valid TORO quote JSON.');
  }
}

async function addQuote(data) {
  const q = {
    ...data,
    _fbKey: fbKey(data),
    workflowStatus: data.workflowStatus || 'active',
    status: data.status || {},
  };
  quotes.push(q);
  render(); // render immediately
  localStorage.setItem(STORAGE_KEY, JSON.stringify(quotes));
  _saving = true;
  try {
    await fbSet('quotes/' + REP_LOWER + '/' + q._fbKey, q);
  } catch(e) {
    console.error('addQuote fbSet error:', e);
  } finally {
    setTimeout(() => { _saving = false; }, 1500);
  }
  bamAlert('Quote <strong>' + (q.quoteNum||q._fbKey) + '</strong> added successfully!');
}

// ── Render ─────────────────────────────────────────────────────────────────
function render() {
  const needApproval = quotes.filter(q => q.workflowStatus === 'needsApproval');
  const waitingApproval = quotes.filter(q => q.workflowStatus === 'waitingApproval');
  const ready = quotes.filter(q => q.workflowStatus === 'readyForSubmission');
  const active = quotes.filter(q => !q.workflowStatus || q.workflowStatus === 'active' || q.workflowStatus === 'rejected');
  const archived = quotes.filter(q => q.workflowStatus === 'submittedCommission' || q.workflowStatus === 'paid');

  // Summary cards
  const totalActive = active.length + ready.length + needApproval.length + waitingApproval.length;
  const totalPending = ready.length;
  const totalSell = quotes.filter(q=>q.workflowStatus!=='paid').reduce((s,q)=>s+quoteTotal(q,'sell'),0);
  const totalComm = quotes.filter(q=>q.workflowStatus!=='paid').reduce((s,q)=>s+quoteComm(q),0);
  document.getElementById('summary-cards').innerHTML = `
    <div class="summary-card"><div class="sc-val">${totalActive}</div><div class="sc-lbl">Active Quotes</div></div>
    <div class="summary-card"><div class="sc-val">${totalPending}</div><div class="sc-lbl">Ready to Submit</div></div>
    <div class="summary-card"><div class="sc-val">$${totalSell.toFixed(0)}</div><div class="sc-lbl">Est. Revenue</div></div>
    <div class="summary-card"><div class="sc-val">$${totalComm.toFixed(0)}</div><div class="sc-lbl">Est. Commission</div></div>
  `;

  // Needs approval section
  const allApprovalNeeded = [...needApproval, ...waitingApproval];
  document.getElementById('section-approval').innerHTML = allApprovalNeeded.length > 0 ? `
    <div class="section-title">🔴 Margin Approval Required <span class="badge">${allApprovalNeeded.length}</span></div>
    ${allApprovalNeeded.map(q => quoteCard(q)).join('')}
  ` : '';

  // Ready for submission
  document.getElementById('section-ready').innerHTML = ready.length > 0 ? `
    <div class="section-title">✅ Ready for Commission Submission <span class="badge">${ready.length}</span></div>
    ${ready.map(q => quoteCard(q)).join('')}
  ` : '';

  // Active
  document.getElementById('section-active').innerHTML = `
    <div class="section-title">📋 Active Quotes <span class="badge">${active.length}</span></div>
    ${active.length > 0 ? active.map(q => quoteCard(q)).join('') : '<p style="color:var(--text3);font-size:14px;padding:8px 0;">No active quotes. Upload a quote JSON above.</p>'}
  `;

  // Archive
  document.getElementById('section-archive').innerHTML = archived.length > 0 ? `
    <div class="archive-toggle" onclick="archiveOpen=!archiveOpen;render()">
      ${archiveOpen ? '▼' : '▶'} Archived / Submitted (${archived.length})
    </div>
    ${archiveOpen ? archived.map(q => quoteCard(q, true)).join('') : ''}
  ` : '';
}

function quoteTotal(q, type) {
  let total = 0;
  (q.garments||[]).forEach(g => (g.sizes||[]).forEach(s => {
    if(s.qty > 0) total += s.qty * (type==='sell' ? (s.sellPrice||0) : (s.netCost||0));
  }));
  (q.hardGoods||[]).forEach(h => {
    if(h.qty > 0) total += h.qty * (type==='sell' ? (h.sellPrice||0) : (h.netCost||0));
  });
  return total;
}

function quoteComm(q) {
  const sell = quoteTotal(q,'sell');
  const net = quoteTotal(q,'net');
  const split = parseInt(q.split)||100;
  return (sell - net) * (split/100) * 0.5;
}

function quoteCard(q, locked) {
  const key = fbKey(q);
  const encKey = encodeURIComponent(key);
  const sell = quoteTotal(q,'sell');
  const net = quoteTotal(q,'net');
  const margin = sell>0?((sell-net)/sell*100).toFixed(1):0;
  const comm = quoteComm(q);
  const split = parseInt(q.split)||100;

  // Approval status display
  const repApprovals = approvals && approvals[REP_LOWER] ? approvals[REP_LOWER] : approvals;
  const approval = repApprovals[key];
  let approvalHtml = '';
  if(q.workflowStatus === 'waitingApproval') {
    approvalHtml = '<div class="approval-pending">⏳ Submitted for margin approval — awaiting management response.</div>';
  } else if(q.workflowStatus === 'needsApproval' || (q.needsApproval && q.workflowStatus !== 'rejected')) {
    approvalHtml = '<div class="approval-pending">⚠️ Margin below 30% — must submit for approval before presenting to client.</div>';
  }
  if(approval && approval.status === 'approved') {
    approvalHtml = '<div class="approved-note">✅ Approved by management' + (approval.note ? ': ' + approval.note : '') + '</div>';
  } else if(approval && approval.status === 'rejected') {
    approvalHtml = '<div class="rejection-note">❌ Rejected by management' + (approval.note ? ': ' + approval.note : '') + '</div>';
  }

  // Status checkboxes
  const statusFields = [
    {field:'quoteApproved', label:'Quote Approved'},
    {field:'orderCompleted', label:'Order Completed'},
    {field:'paidByClient', label:'Paid by Client'},
    {field:'readyForPayment', label:'Ready for Payment'},
  ];
  const checksHtml = locked ? '' : `<div class="status-checks">
    ${statusFields.map(sf => {
      const checked = (q.status||{})[sf.field];
      return `<div class="status-check ${checked?'checked':''}">
        <label>
          <input type="checkbox" ${checked?'checked':''} ${locked?'disabled':''}
            data-key="${encKey}" data-field="${sf.field}"
            onchange="toggleStatus(decodeURIComponent(this.dataset.key), this.dataset.field, this.checked)">
          ${sf.label}
        </label>
      </div>`;
    }).join('')}
  </div>`;

  // Action buttons
  let actionBtns = '';
  if(!locked) {
    if(q.workflowStatus === 'readyForSubmission') {
      actionBtns += `<button class="btn btn-green" onclick="submitForCommission(decodeURIComponent('${encKey}'))">📤 Submit for Commission</button>`;
      actionBtns += `<button class="btn btn-gray" onclick="undoReady(decodeURIComponent('${encKey}'))">↩ Undo</button>`;
    } else if(q.workflowStatus === 'needsApproval' && q.workflowStatus !== 'waitingApproval') {
      actionBtns += `<button class="btn btn-outline" onclick="submitForApproval(decodeURIComponent('${encKey}'))">🔔 Submit for Approval</button>`;
    }
    actionBtns += `<button class="btn btn-gray" onclick="exportToBuilder(decodeURIComponent('${encKey}'))">✏️ Edit</button>`;
    actionBtns += `<button class="del-btn" onclick="deleteQuote(decodeURIComponent('${encKey}'))">🗑 Delete</button>`;
  }

  return `<div class="quote-card" id="qc-${key.replace(/[^a-zA-Z0-9]/g,'_')}">
    <div class="qc-header" onclick="toggleCard(this)">
      <div class="qc-meta">
        <div class="qc-title">${q.quoteName||q.quoteNum||'Untitled'} <span style="font-size:12px;color:var(--text3);font-weight:400;">#${q.quoteNum||'—'}</span></div>
        <div class="qc-sub">Period: ${q.period||'—'} · ${q.ihd||'—'}${q.ihdFirm?' 🔒 Firm':''} · Sell: $${sell.toFixed(2)} · Margin: ${margin}% · Est. Comm: $${comm.toFixed(2)}</div>
      </div>
      <div class="qc-actions" onclick="event.stopPropagation()">
        ${actionBtns}
      </div>
    </div>
    <div class="qc-body" style="display:none;">
      ${approvalHtml}
      ${checksHtml}
      <div style="font-size:12px;color:var(--text3);">
        Rep: ${q.rep||REP} · Split: ${split}% · AM: ${q.am?'Yes':'No'} · Garments: ${(q.garments||[]).length} · HG: ${(q.hardGoods||[]).length}
        ${q.notes?'<br>Notes: '+q.notes:''}
      </div>
    </div>
  </div>`;
}

function toggleCard(header) {
  const body = header.nextElementSibling;
  body.style.display = body.style.display === 'none' ? '' : 'none';
}

// ── Quote actions ──────────────────────────────────────────────────────────
async function toggleStatus(key, field, checked) {
  const q = quotes.find(x => fbKey(x) === key);
  if(!q) { console.warn('toggleStatus: quote not found for key:', key); return; }
  if(!q.status) q.status = {};
  q.status[field] = checked;
  // If readyForPayment checked -> move to readyForSubmission
  if(field === 'readyForPayment' && checked) {
    if(q.needsApproval && q.workflowStatus !== 'waitingApproval') {
      const repApprovals = approvals && approvals[REP_LOWER] ? approvals[REP_LOWER] : approvals;
      const approval = repApprovals[key];
      if(!approval || approval.status !== 'approved') {
        bamAlert('This quote requires margin approval before it can be submitted. Use the Submit for Approval button first.');
        q.status[field] = false;
        render();
        return;
      }
    }
    q.workflowStatus = 'readyForSubmission';
  } else if(field === 'readyForPayment' && !checked) {
    if(q.workflowStatus === 'readyForSubmission') q.workflowStatus = 'active';
  }
  render();
  localStorage.setItem(STORAGE_KEY, JSON.stringify(quotes));
  _saving = true;
  try {
    await fbSet('quotes/' + REP_LOWER + '/' + fbKey(q), q);
  } catch(e) { console.error('toggleStatus fbSet error:', e); } finally {
    setTimeout(() => { _saving = false; }, 1500);
  }
}

async function submitForApproval(key) {
  const q = quotes.find(x => fbKey(x) === key);
  if(!q) { console.warn('submitForApproval: quote not found for key:', key); return; }
  bamConfirm('Submit this quote for margin approval? Management will review before you can present it to the client.', async ok => {
    if(!ok) return;
    q.workflowStatus = 'waitingApproval';
    render();
    localStorage.setItem(STORAGE_KEY, JSON.stringify(quotes));
    _saving = true;
    try {
      await fbSet('quotes/' + REP_LOWER + '/' + fbKey(q), q);
      // Write approval request
      const approvalKey = fbKey(q);
      await fbSet('approvals/' + REP_LOWER + '/' + approvalKey, {
        rep: REP,
        quoteNum: q.quoteNum,
        quoteName: q.quoteName,
        status: 'pending',
        requestedAt: new Date().toISOString(),
        sellTotal: quoteTotal(q,'sell'),
        netTotal: quoteTotal(q,'net'),
        margin: quoteTotal(q,'sell') > 0 ? ((quoteTotal(q,'sell')-quoteTotal(q,'net'))/quoteTotal(q,'sell')*100).toFixed(1) : 0,
      });
    } catch(e) { console.error('submitForApproval error:', e); } finally {
      setTimeout(() => { _saving = false; }, 1500);
    }
    bamAlert('Submitted for approval! You\'ll see the decision here when management responds.');
  });
}

function submitForCommission(key) {
  const q = quotes.find(x => fbKey(x) === key);
  if(!q) { console.warn('submitForCommission: quote not found for key:', key); return; }
  bamConfirm('Submit this quote for commission payment? It will be archived.', async ok => {
    if(!ok) return;
    q.workflowStatus = 'submittedCommission';
    render();
    localStorage.setItem(STORAGE_KEY, JSON.stringify(quotes));
    _saving = true;
    try {
      await fbSet('quotes/' + REP_LOWER + '/' + fbKey(q), q);
    } catch(e) { console.error('submitForCommission error:', e); } finally {
      setTimeout(() => { _saving = false; }, 1500);
    }
    bamAlert('Commission submission recorded!');
  });
}

function undoReady(key) {
  const q = quotes.find(x => fbKey(x) === key);
  if(!q) return;
  bamConfirm('Move this quote back to Active?', async ok => {
    if(!ok) return;
    q.workflowStatus = 'active';
    if(q.status) q.status.readyForPayment = false;
    render();
    localStorage.setItem(STORAGE_KEY, JSON.stringify(quotes));
    _saving = true;
    try {
      await fbSet('quotes/' + REP_LOWER + '/' + fbKey(q), q);
    } catch(e) { console.error('undoReady error:', e); } finally {
      setTimeout(() => { _saving = false; }, 1500);
    }
  });
}

function exportToBuilder(key) {
  const q = quotes.find(x => fbKey(x) === key);
  if(!q) return;
  const blob = new Blob([JSON.stringify(q, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `TORO_Quote_${(q.quoteNum||key).replace(/[^a-zA-Z0-9]/g,'_')}_edit.json`;
  a.click();
  bamAlert('Quote exported! Open the Quote Builder, use the re-import toggle at the top, and drop in this file to edit.');
}

async function deleteQuote(key) {
  const q = quotes.find(x => fbKey(x) === key);
  if(!q) { console.warn('deleteQuote: quote not found for key:', key); bamAlert('Could not locate that quote. Please refresh and try again.'); return; }
  bamConfirm('Permanently delete <strong>' + (q.quoteName||q.quoteNum||'this quote') + '</strong>? This cannot be undone.', async ok => {
    if(!ok) return;
    const idx = quotes.indexOf(q);
    if(idx >= 0) quotes.splice(idx, 1);
    render();
    localStorage.setItem(STORAGE_KEY, JSON.stringify(quotes));
    fbListenerActive = false;
    _saving = true;
    try {
      await fbSet('quotes/' + REP_LOWER + '/' + fbKey(q), null);
      // Also remove any approval record
      await fbSet('approvals/' + REP_LOWER + '/' + fbKey(q), null);
    } catch(e) { console.error('deleteQuote error:', e); } finally {
      setTimeout(() => { _saving = false; fbListenerActive = true; }, 2000);
    }
  });
}
</script>
