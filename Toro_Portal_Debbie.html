<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TORO Debbie Commission Portal</title>
<style>
:root{
  --red:#C41E1E;--red-light:#fff0f0;--green:#1a7f4b;--bg:#F7F7F8;
  --surface:#fff;--border:#E2E3E6;--border2:#ccc;--text:#1a1a1f;
  --text2:#444;--text3:#888;--brown:#7B3F00;--radius:10px;--radius-sm:6px;
  --orange:#C46A1E;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.topbar{background:#1a1a2e;border-bottom:3px solid var(--red);padding:14px 28px;display:flex;align-items:center;justify-content:space-between}
.topbar h1{color:#fff;font-size:17px;font-weight:700}
.rep-badge{background:var(--red);color:#fff;font-size:12px;font-weight:700;padding:3px 10px;border-radius:10px;margin-left:12px}
.container{max-width:1140px;margin:0 auto;padding:24px}
.drop-zone{border:2px dashed var(--border2);border-radius:var(--radius);padding:28px;text-align:center;cursor:pointer;transition:all .2s;background:var(--surface);margin-bottom:20px}
.drop-zone:hover,.drop-zone.over{border-color:var(--red);background:var(--red-light)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px}
.card-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);margin-bottom:4px}
.card-val{font-size:20px;font-weight:700}
.green{color:var(--green)}.brown{color:var(--brown)}.red{color:var(--red)}.orange{color:var(--orange)}
.section-block{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:16px;overflow:hidden}
.section-hdr{padding:11px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:700}
.section-hdr.ready{background:#1a7f4b;color:#fff}
.section-hdr.approval{background:#7B3F00;color:#fff}
.section-hdr.active{background:#1a1a2e;color:#fff}
.section-hdr.archive{background:var(--bg);color:var(--text3)}
table{width:100%;border-collapse:collapse;font-size:12px}
th{padding:7px 10px;text-align:left;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text3);border-bottom:1px solid var(--border);background:var(--bg)}
th.r,td.r{text-align:right}
td{padding:8px 10px;border-bottom:1px solid #f5f5f5;vertical-align:middle}
tr:hover td{background:#fafafa}
.mg-pill{display:inline-block;padding:1px 6px;border-radius:8px;font-size:10px;font-weight:700}
.mg-green{background:#e6f4ee;color:var(--green)}
.mg-yellow{background:#FFF8E1;color:#7A4F00}
.mg-red{background:#FFEBEB;color:var(--red)}
.btn{padding:6px 12px;font-size:12px;font-weight:700;border-radius:6px;cursor:pointer;border:none;transition:all .15s}
.btn-primary{background:var(--red);color:#fff}.btn-primary:hover{background:#a51818}
.btn-green{background:var(--green);color:#fff}
.btn-outline{background:#fff;border:1px solid var(--border2);color:var(--text2)}.btn-outline:hover{border-color:var(--red);color:var(--red)}
.btn-sm{padding:3px 8px;font-size:11px}
.empty{padding:24px;text-align:center;color:var(--text3);font-size:13px}
.status-checks{display:flex;gap:12px;flex-wrap:wrap}
.status-check{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--text3);cursor:pointer;padding:3px 0}
.status-check input{width:13px;height:13px;accent-color:var(--green);cursor:pointer}
.status-check.checked{color:var(--green);font-weight:700}
.status-badge{display:inline-block;font-size:10px;font-weight:700;padding:2px 7px;border-radius:8px}
.badge-waiting{background:#FFF3E0;color:var(--orange)}
.badge-approved{background:#e6f4ee;color:var(--green)}
.badge-rejected{background:#FFEBEB;color:var(--red)}
.badge-needs{background:#FFF8E1;color:#7A4F00}
.rejection-note{background:#FFEBEB;border-left:3px solid var(--red);padding:6px 10px;font-size:11px;color:#a32d2d;margin-top:4px;border-radius:0 4px 4px 0}
.summary-bar{padding:10px 16px;background:#f0faf4;border-top:1px solid var(--border);font-size:12px;display:flex;gap:20px;flex-wrap:wrap}
.locked-badge{font-size:10px;background:#e8e8e8;color:#888;padding:1px 6px;border-radius:6px;margin-left:4px}
details summary{padding:10px 16px;cursor:pointer;font-size:12px;color:var(--text3);user-select:none;list-style:none}
details summary::-webkit-details-marker{display:none}
</style>
</head>
<body>

<!-- Password gate -->
<div id="gate" style="position:fixed;inset:0;background:#1a1a2e;display:flex;align-items:center;justify-content:center;z-index:9999">
  <div style="background:#fff;border-radius:12px;padding:36px 44px;max-width:360px;width:90%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.4)">
    <div style="font-size:28px;margin-bottom:10px">&#128274;</div>
    <div style="font-size:20px;font-weight:700;color:#1a1a2e;margin-bottom:4px">TORO</div>
    <div style="font-size:13px;color:#888;margin-bottom:24px">Debbie Commission Portal</div>
    <input id="pw-input" type="password" placeholder="Enter password"
      style="width:100%;padding:10px 12px;font-size:14px;border:2px solid #e2e3e6;border-radius:8px;margin-bottom:10px;box-sizing:border-box;outline:none"
      onkeydown="if(event.key==='Enter')checkPw()"
      onfocus="this.style.borderColor='#C41E1E'" onblur="this.style.borderColor='#e2e3e6'">
    <div id="pw-msg" style="font-size:12px;color:#C41E1E;min-height:16px;margin-bottom:10px"></div>
    <button onclick="checkPw()" style="width:100%;padding:10px;background:#C41E1E;color:#fff;font-size:14px;font-weight:700;border:none;border-radius:8px;cursor:pointer">Unlock</button>
    <div style="margin-top:16px;border-top:1px solid #f0f0f0;padding-top:12px">
      <a href="#" onclick="showChangePw();return false" style="font-size:11px;color:#888;text-decoration:none">Change my password</a>
    </div>
  </div>
</div>
<div id="change-pw-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);align-items:center;justify-content:center;z-index:10000">
  <div style="background:#fff;border-radius:12px;padding:28px 36px;max-width:340px;width:90%">
    <div style="font-size:16px;font-weight:700;margin-bottom:16px">Change password</div>
    <input id="pw-current" type="password" placeholder="Current password" style="width:100%;padding:9px 11px;font-size:13px;border:1px solid #ccc;border-radius:6px;margin-bottom:8px;box-sizing:border-box">
    <input id="pw-new" type="password" placeholder="New password (min 6 chars)" style="width:100%;padding:9px 11px;font-size:13px;border:1px solid #ccc;border-radius:6px;margin-bottom:8px;box-sizing:border-box">
    <input id="pw-confirm" type="password" placeholder="Confirm new password" style="width:100%;padding:9px 11px;font-size:13px;border:1px solid #ccc;border-radius:6px;margin-bottom:8px;box-sizing:border-box">
    <div id="change-msg" style="font-size:11px;color:#C41E1E;min-height:14px;margin-bottom:8px"></div>
    <div style="display:flex;gap:8px">
      <button onclick="submitChangePw()" style="flex:1;padding:9px;background:#C41E1E;color:#fff;font-weight:700;border:none;border-radius:6px;cursor:pointer">Save</button>
      <button onclick="hideChangePw()" style="flex:1;padding:9px;background:#f0f0f0;color:#333;font-weight:700;border:none;border-radius:6px;cursor:pointer">Cancel</button>
    </div>
  </div>
</div>

<div class="topbar">
  <div style="display:flex;align-items:center">
    <h1>TORO Commission Portal</h1>
    <span class="rep-badge">Debbie</span>
  </div>
  <span id="status-text" style="color:#888;font-size:12px">Loading...</span>
</div>

<div class="container">
  <div class="drop-zone" id="drop-zone" onclick="document.getElementById('file-input').click()">
    <input type="file" id="file-input" multiple accept=".json" style="display:none">
    <div style="font-size:24px;margin-bottom:6px">&#128190;</div>
    <div style="font-size:14px;font-weight:700;color:var(--text2);margin-bottom:4px">Drop exported quote files here</div>
    <div style="font-size:11px;color:var(--text3)">Click or drag .json files from the TORO Quote Builder</div>
  </div>

  <div class="cards" id="summary-cards"></div>
  <div id="main-content"><div class="section-block"><div class="empty">Loading...</div></div></div>
</div>

<script>
const REP = 'Debbie';
const STORAGE_KEY = 'toro_portal_debbie_v3';
const PW_KEY = 'toro_pw_debbie';
const DEFAULT_PW = 'Toro#Xp8sN';
const LOCK_KEY = 'toro_lock_debbie';
const ATTEMPTS_KEY = 'toro_attempts_debbie';
let quotes = [];
let fbListenerActive = false;

// ── Password ──────────────────────────────────────────────────────────────
function getStoredPw(){ return localStorage.getItem(PW_KEY)||DEFAULT_PW; }
function getAttempts(){ return parseInt(localStorage.getItem(ATTEMPTS_KEY)||'0'); }
function setAttempts(n){ localStorage.setItem(ATTEMPTS_KEY,n); }
function isLocked(){ return localStorage.getItem(LOCK_KEY)==='locked'; }
function checkPw(){
  if(isLocked()){ document.getElementById('pw-msg').textContent='Account locked. Contact your administrator.'; return; }
  const val=document.getElementById('pw-input').value;
  if(val===getStoredPw()){ setAttempts(0); document.getElementById('gate').style.display='none'; }
  else{
    const a=getAttempts()+1; setAttempts(a);
    const rem=5-a;
    if(a>=5){ localStorage.setItem(LOCK_KEY,'locked'); document.getElementById('pw-msg').textContent='Account locked after 5 failed attempts.'; document.getElementById('pw-input').disabled=true; }
    else if(a>=3){ document.getElementById('pw-msg').textContent='Incorrect. '+rem+' attempt'+(rem===1?'':'s')+' remaining.'; }
    else{ document.getElementById('pw-msg').textContent='Incorrect password. Please try again.'; }
    document.getElementById('pw-input').value=''; document.getElementById('pw-input').focus();
  }
}
function showChangePw(){ document.getElementById('change-pw-modal').style.display='flex'; }
function hideChangePw(){ document.getElementById('change-pw-modal').style.display='none'; }
function submitChangePw(){
  const c=document.getElementById('pw-current').value,n=document.getElementById('pw-new').value,cf=document.getElementById('pw-confirm').value,m=document.getElementById('change-msg');
  if(c!==getStoredPw()){ m.textContent='Current password incorrect.'; return; }
  if(n.length<6){ m.textContent='Min 6 characters.'; return; }
  if(n!==cf){ m.textContent='Passwords do not match.'; return; }
  localStorage.setItem(PW_KEY,n); m.style.color='#1a7f4b'; m.textContent='Password changed.';
  setTimeout(hideChangePw,1500);
}
if(isLocked()){ document.getElementById('pw-msg').textContent='Account locked.'; document.getElementById('pw-input').disabled=true; }

// ── Firebase ──────────────────────────────────────────────────────────────
// ── Firebase Integration ─────────────────────────────────────────────────
// Uses Firebase Realtime Database for real-time sync across all devices
const FIREBASE_DB_URL = "https://toro-commission-318b4-default-rtdb.firebaseio.com";

// Firebase REST API helpers — no SDK needed, works in plain HTML
async function fbGet(path) {
  try {
    const res = await fetch(`${FIREBASE_DB_URL}/${path}.json`);
    if (!res.ok) return null;
    return await res.json();
  } catch(e) { console.warn('Firebase read failed:', e.message); return null; }
}

async function fbSet(path, data) {
  try {
    const res = await fetch(`${FIREBASE_DB_URL}/${path}.json`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });
    return res.ok;
  } catch(e) { console.warn('Firebase write failed:', e.message); return false; }
}

async function fbPatch(path, data) {
  try {
    const res = await fetch(`${FIREBASE_DB_URL}/${path}.json`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });
    return res.ok;
  } catch(e) { console.warn('Firebase patch failed:', e.message); return false; }
}

// Long-polling for real-time updates (SSE/EventSource)
let fbListeners = {};
function fbListen(path, callback) {
  // Stop any existing listener on this path
  if (fbListeners[path]) {
    fbListeners[path].close();
  }
  try {
    const es = new EventSource(
      `${FIREBASE_DB_URL}/${path}.json`
    );
    es.addEventListener('put', e => {
      try { callback(JSON.parse(e.data)); } catch(err) {}
    });
    es.addEventListener('patch', e => {
      try { callback(JSON.parse(e.data)); } catch(err) {}
    });
    es.onerror = () => {
      // Reconnect after 5 seconds on error
      setTimeout(() => fbListen(path, callback), 5000);
    };
    fbListeners[path] = es;
  } catch(e) {
    console.warn('Firebase listener failed:', e.message);
    // Fallback: poll every 10 seconds
    fbListeners[path] = { close: () => {} };
    setInterval(async () => {
      const data = await fbGet(path);
      if (data) callback({ data });
    }, 10000);
  }
}

function fbStopListening(path) {
  if (fbListeners[path]) {
    fbListeners[path].close();
    delete fbListeners[path];
  }
}

const FB_PATH='quotes/'+REP.toLowerCase();

async function fbSave(q){
  const key=q.quoteNum?q.quoteNum.replace(/[.#$\/\[\]]/g,'_'):(q._fbKey||'q_'+Date.now());
  q._fbKey=key;
  await fbSet(FB_PATH+'/'+key,q);
}
async function fbDelete(q){
  const key=q.quoteNum?q.quoteNum.replace(/[.#$\/\[\]]/g,'_'):q._fbKey;
  if(!key) return;
  await fbSet(FB_PATH+'/'+key,null);
}
async function loadFromFirebase(){
  const data=await fbGet(FB_PATH);
  quotes=data?Object.values(data).filter(q=>q&&q.totalSell):[];
  localStorage.setItem(STORAGE_KEY,JSON.stringify(quotes));
  render();
}
function startListeners(){
  if(fbListenerActive) return;
  fbListenerActive=true;
  let first=true;
  fbListen(FB_PATH,event=>{
    if(!event||!event.data) return;
    if(first){ first=false; return; }
    loadFromFirebase();
  });
  // Listen for approval updates from dashboard
  fbListen('approvals',event=>{
    if(!event||!event.data||typeof event.data!=='object') return;
    let changed=false;
    Object.entries(event.data).forEach(([key,val])=>{
      if(!val) return;
      const idx=quotes.findIndex(q=>q._fbKey===key||q.quoteNum&&q.quoteNum.replace(/[.#$\/\[\]]/g,'_')===key);
      if(idx>=0){
        quotes[idx].approvalStatus=val.status;
        quotes[idx].approvalNote=val.note||'';
        if(val.status==='approved') quotes[idx].marginApproved=true;
        changed=true;
      }
    });
    if(changed){ localStorage.setItem(STORAGE_KEY,JSON.stringify(quotes)); render(); }
  });
  // Listen for paid status from dashboard
  fbListen('paid',event=>{
    if(!event||!event.data||typeof event.data!=='object') return;
    let changed=false;
    Object.entries(event.data).forEach(([key,val])=>{
      if(!val) return;
      const idx=quotes.findIndex(q=>q._fbKey===key);
      if(idx>=0&&val.rep===REP){ quotes[idx].paid=val.paid; quotes[idx].paidDate=val.paidDate; changed=true; }
    });
    if(changed){ localStorage.setItem(STORAGE_KEY,JSON.stringify(quotes)); render(); }
  });
}

// ── File loading ──────────────────────────────────────────────────────────
const dz=document.getElementById('drop-zone');
const fi=document.getElementById('file-input');
dz.addEventListener('dragover',e=>{e.preventDefault();dz.classList.add('over')});
dz.addEventListener('dragleave',()=>dz.classList.remove('over'));
dz.addEventListener('drop',e=>{e.preventDefault();dz.classList.remove('over');loadFiles([...e.dataTransfer.files])});
fi.addEventListener('change',()=>{loadFiles([...fi.files]);fi.value=''});

function loadFiles(files){
  files.forEach(f=>{
    if(!f.name.endsWith('.json')) return;
    const r=new FileReader();
    r.onload=async e=>{
      try{
        const q=JSON.parse(e.target.result);
        if(!q.totalSell) return;
        if(q.rep&&q.rep!==REP){ alert('This quote belongs to '+q.rep+', not Debbie.'); return; }
        q.rep=REP; q.loadedAt=new Date().toISOString();
        if(!q.adjustments) q.adjustments=[];
        // Status fields
        if(!q.statusChecks) q.statusChecks={quoteApproved:false,orderCompleted:false,paidByClient:false,readyForPayment:false};
        if(!q.workflowStatus) q.workflowStatus='active'; // active|needsApproval|waitingApproval|submittedCommission|archived
        // Handle re-import of a quote needing correction (reset approval)
        if(q.quoteNum){
          const existing=quotes.findIndex(x=>x.quoteNum===q.quoteNum);
          if(existing>=0){
            const old=quotes[existing];
            q.adjustments=old.adjustments||[];
            q.statusChecks=old.statusChecks||q.statusChecks;
            // Reset approval if was rejected
            if(old.approvalStatus==='rejected'){
              q.approvalStatus=''; q.marginApproved=false; q.workflowStatus='active';
              await fbSet('approvals/'+q._fbKey,null); // clear old rejection
            } else {
              q.approvalStatus=old.approvalStatus||'';
              q.marginApproved=old.marginApproved||false;
            }
            quotes.splice(existing,1);
          }
        }
        // Check if needs margin approval
        if(q.needsApproval&&!q.marginApproved&&!q.approvalStatus){
          q.workflowStatus='needsApproval';
        }
        quotes.push(q);
        await fbSave(q);
        localStorage.setItem(STORAGE_KEY,JSON.stringify(quotes));
        render();
      } catch(err){ console.error(err); }
    };
    r.readAsText(f);
  });
}

// ── Status updates ────────────────────────────────────────────────────────
async function toggleStatus(qIdx,field){
  if(quotes[qIdx].workflowStatus==='submittedCommission'||quotes[qIdx].workflowStatus==='archived') return;
  if(!quotes[qIdx].statusChecks) quotes[qIdx].statusChecks={quoteApproved:false,orderCompleted:false,paidByClient:false,readyForPayment:false};
  quotes[qIdx].statusChecks[field]=!quotes[qIdx].statusChecks[field];
  await fbSave(quotes[qIdx]);
  localStorage.setItem(STORAGE_KEY,JSON.stringify(quotes));
  render();
}

async function submitForApproval(qIdx){
  quotes[qIdx].workflowStatus='waitingApproval';
  quotes[qIdx].approvalStatus='waiting';
  // Write to Firebase approvals path so dashboard picks it up
  const key=quotes[qIdx]._fbKey||quotes[qIdx].quoteNum;
  await fbSet('approvals/'+key,{
    quoteNum:quotes[qIdx].quoteNum, quoteName:quotes[qIdx].quoteName,
    rep:REP, status:'waiting', requestedAt:new Date().toISOString(),
    sell:quotes[qIdx].totalSell, margin:quotes[qIdx].avgMargin,
    commissionSplit:quotes[qIdx].commissionSplit
  });
  await fbSave(quotes[qIdx]);
  localStorage.setItem(STORAGE_KEY,JSON.stringify(quotes));
  render();
}

async function submitForCommission(period){
  const readyQuotes=quotes.filter(q=>q.statusChecks&&q.statusChecks.readyForPayment&&q.workflowStatus==='active'&&(q.marginApproved||!q.needsApproval));
  if(!readyQuotes.length){ alert('No quotes ready for submission.'); return; }
  if(!confirm('Submit '+readyQuotes.length+' quote'+(readyQuotes.length!==1?'s':'')+' for commission? They will be locked and archived.')) return;
  const submittedAt=new Date().toISOString();
  for(const q of readyQuotes){
    q.workflowStatus='submittedCommission';
    q.submittedAt=submittedAt;
    q.locked=true;
    await fbSave(q);
    // Write to commissionSubmissions for dashboard
    const key=q._fbKey||q.quoteNum;
    await fbSet('commissionSubmissions/'+REP.toLowerCase()+'/'+key,{
      ...q, submittedAt, rep:REP
    });
  }
  localStorage.setItem(STORAGE_KEY,JSON.stringify(quotes));
  render();
}

// ── Export quote back to builder ──────────────────────────────────────────
function exportToBuilder(qIdx){
  const q=quotes[qIdx];
  const blob=new Blob([JSON.stringify(q,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  const name='TORO_Edit_'+(q.quoteNum||'quote')+'_'+(q.quoteName||'').replace(/[^a-z0-9]/gi,'_')+'.json';
  a.href=URL.createObjectURL(blob); a.download=name; a.click();
  URL.revokeObjectURL(a.href);
}

// ── Export commission bundle ──────────────────────────────────────────────
function exportBundle(){
  const submitted=quotes.filter(q=>q.workflowStatus==='submittedCommission'||q.workflowStatus==='archived');
  if(!submitted.length){ alert('No submitted quotes to export.'); return; }
  const bundle={type:'commission_bundle',rep:REP,exportedAt:new Date().toLocaleString(),quotes:submitted,
    totals:{totalSell:submitted.reduce((a,q)=>a+(q.totalSell||0),0),repPayout:submitted.reduce((a,q)=>a+(q.totalRepComm||0),0)}
  };
  const blob=new Blob([JSON.stringify(bundle,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='TORO_Commission_Debbie_'+new Date().toLocaleDateString('en-US').replace(/\//g,'-')+'.json';
  a.click(); URL.revokeObjectURL(a.href);
}

// ── Helpers ───────────────────────────────────────────────────────────────
const fmt=v=>'$'+parseFloat(v||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const pct=v=>(Math.round((v||0)*10)/10)+'%';

function approvalBadge(q){
  if(q.workflowStatus==='waitingApproval') return '<span class="status-badge badge-waiting">Waiting for Approval</span>';
  if(q.approvalStatus==='approved'||q.marginApproved) return '<span class="status-badge badge-approved">Approved</span>';
  if(q.approvalStatus==='rejected') return '<span class="status-badge badge-rejected">Rejected</span>';
  if(q.workflowStatus==='needsApproval') return '<span class="status-badge badge-needs">Needs Approval</span>';
  return '';
}

function statusChecksHtml(q,idx){
  const locked=q.locked||q.workflowStatus==='submittedCommission'||q.workflowStatus==='archived';
  const sc=q.statusChecks||{};
  const checks=[
    ['quoteApproved','Quote Approved'],
    ['orderCompleted','Order Completed'],
    ['paidByClient','Paid by Client'],
    ['readyForPayment','Ready for Payment']
  ];
  return checks.map(([field,label])=>{
    const checked=sc[field]||false;
    const dis=locked?'disabled style="opacity:.5;cursor:not-allowed"':'style="cursor:pointer"';
    return `<label class="status-check ${checked?'checked':''}" ${locked?'':'onclick="toggleStatus('+idx+',\''+field+'\')"'}>
      <input type="checkbox" ${checked?'checked':''} ${locked?'disabled':''} onclick="if(!event.target.disabled)toggleStatus(${idx},\'${field}\')">
      ${label}
    </label>`;
  }).join('');
}

function quoteRow(q,idx,locked){
  const mg=q.avgMargin||0;
  const mgC=mg<30?'mg-red':mg<35?'mg-yellow':'mg-green';
  const name=q.quoteName||(q.quoteNum?'#'+q.quoteNum:'Unnamed');
  return `<tr>
    <td>
      <div style="font-weight:700;font-size:13px">${name}${locked?'<span class="locked-badge">LOCKED</span>':''}</div>
      ${q.quoteNum?'<div style="font-size:10px;color:var(--text3)">#'+q.quoteNum+'</div>':''}
      ${q.ihd?'<div style="font-size:10px;color:var(--text3)">IHD: '+q.ihd+'</div>':''}
      ${q.commissionReport?'<div style="font-size:10px;color:var(--text3)">Period: '+q.commissionReport+'</div>':''}
      ${q.approvalStatus==='rejected'&&q.approvalNote?'<div class="rejection-note">&#9888; '+q.approvalNote+'</div>':''}
    </td>
    <td class="r">${fmt(q.totalNetCost)}</td>
    <td class="r">${fmt(q.totalSell)}</td>
    <td class="r"><span class="mg-pill ${mgC}">${pct(mg)}</span></td>
    <td class="r" style="color:var(--brown);font-weight:700">${fmt(q.totalRepComm)}</td>
    <td style="font-size:11px">${q.commissionSplit==='standard'?'Standard':q.commissionSplit==='ho_75_25'?'H/O 75/25':q.commissionSplit==='ho_50_50'?'H/O 50/50':q.commissionSplit==='ho_25_75'?'H/O 25/75':'Standard'}</td>
    <td>
      ${approvalBadge(q)}
      ${!locked?statusChecksHtml(q,idx):''}
    </td>
    <td style="white-space:nowrap">
      ${!locked&&q.workflowStatus==='needsApproval'?'<button class="btn btn-sm" style="background:var(--orange);color:#fff" onclick="submitForApproval('+idx+')">Submit for Approval</button>':''}
      ${!locked?'<button class="btn btn-outline btn-sm" onclick="exportToBuilder('+idx+')" title="Export to Quote Builder for editing">&#9998; Edit</button>':''}
      ${locked?'<button class="btn btn-outline btn-sm" onclick="exportToBuilder('+idx+')" title="Export for reference">&#128190; Export</button>':''}
    </td>
  </tr>`;
}

// ── Render ────────────────────────────────────────────────────────────────
function render(){
  const status=document.getElementById('status-text');
  const cards=document.getElementById('summary-cards');
  const main=document.getElementById('main-content');

  if(!quotes.length){
    status.textContent='No quotes loaded';
    cards.innerHTML='';
    main.innerHTML='<div class="section-block"><div class="empty">Drop exported quotes above to get started</div></div>';
    return;
  }

  status.textContent=quotes.length+' quote'+(quotes.length!==1?'s':'')+' loaded';

  // Categorize
  const needsApproval=quotes.filter((q,i)=>q.workflowStatus==='needsApproval'||q.workflowStatus==='waitingApproval'||q.approvalStatus==='rejected');
  const readyForSub=quotes.filter((q,i)=>q.statusChecks&&q.statusChecks.readyForPayment&&q.workflowStatus==='active'&&(q.marginApproved||!q.needsApproval));
  const active=quotes.filter((q,i)=>q.workflowStatus==='active'&&!(q.statusChecks&&q.statusChecks.readyForPayment));
  const archived=quotes.filter((q,i)=>q.workflowStatus==='submittedCommission'||q.workflowStatus==='archived');

  // Summary cards
  const allActive=[...readyForSub,...active];
  const totSell=allActive.reduce((a,q)=>a+(q.totalSell||0),0);
  const totNet=allActive.reduce((a,q)=>a+(q.totalNetCost||0),0);
  const totRep=allActive.reduce((a,q)=>a+(q.totalRepComm||0),0);
  const totGP=totSell-totNet;
  const avgMg=totSell>0?Math.round((1-totNet/totSell)*1000)/10:0;

  cards.innerHTML=`
    <div class="card"><div class="card-lbl">Active quotes</div><div class="card-val">${allActive.length}</div></div>
    <div class="card"><div class="card-lbl">Total sell</div><div class="card-val green">${fmt(totSell)}</div></div>
    <div class="card"><div class="card-lbl">Gross profit</div><div class="card-val green">${fmt(totGP)}</div></div>
    <div class="card"><div class="card-lbl">Avg margin</div><div class="card-val ${avgMg<30?'red':avgMg<35?'orange':'green'}">${pct(avgMg)}</div></div>
    <div class="card"><div class="card-lbl">My commission</div><div class="card-val brown">${fmt(totRep)}</div></div>
    ${needsApproval.length?'<div class="card"><div class="card-lbl">Needs attention</div><div class="card-val red">'+needsApproval.length+'</div></div>':''}
  `;

  const TH='<thead><tr><th>Project</th><th class="r">Cost</th><th class="r">Sell</th><th class="r">Margin</th><th class="r">Commission</th><th>Split</th><th>Status</th><th></th></tr></thead>';
  let html='';

  // ── Needs approval section ──────────────────────────────────────────────
  if(needsApproval.length){
    html+=`<div class="section-block">
      <div class="section-hdr approval">
        <span>&#9888; Approval Required (${needsApproval.length})</span>
      </div>
      <table>${TH}<tbody>`;
    needsApproval.forEach(q=>{ const i=quotes.indexOf(q); html+=quoteRow(q,i,false); });
    html+=`</tbody></table></div>`;
  }

  // ── Ready for submission ────────────────────────────────────────────────
  if(readyForSub.length){
    const subSell=readyForSub.reduce((a,q)=>a+(q.totalSell||0),0);
    const subNet=readyForSub.reduce((a,q)=>a+(q.totalNetCost||0),0);
    const subRep=readyForSub.reduce((a,q)=>a+(q.totalRepComm||0),0);
    const subMg=subSell>0?Math.round((1-subNet/subSell)*1000)/10:0;
    html+=`<div class="section-block">
      <div class="section-hdr ready">
        <span>&#9989; Ready for Commission Submission (${readyForSub.length})</span>
        <button class="btn btn-sm" style="background:#fff;color:var(--green);font-weight:700" onclick="submitForCommission()">Submit for Commission</button>
      </div>
      <div style="padding:8px 16px;background:#e6f4ee;border-bottom:1px solid #c8e6c9;font-size:12px;display:flex;gap:20px;flex-wrap:wrap">
        <span>Quotes: <strong>${readyForSub.length}</strong></span>
        <span>Total sell: <strong>${fmt(subSell)}</strong></span>
        <span>Gross profit: <strong>${fmt(subSell-subNet)}</strong></span>
        <span>Avg margin: <strong><span class="mg-pill ${subMg<30?'mg-red':subMg<35?'mg-yellow':'mg-green'}">${pct(subMg)}</span></strong></span>
        <span>My commission: <strong style="color:var(--brown)">${fmt(subRep)}</strong></span>
      </div>
      <table>${TH}<tbody>`;
    readyForSub.forEach(q=>{ const i=quotes.indexOf(q); html+=quoteRow(q,i,false); });
    html+=`</tbody></table></div>`;
  }

  // ── Active quotes ───────────────────────────────────────────────────────
  if(active.length){
    html+=`<div class="section-block">
      <div class="section-hdr active">
        <span>&#128203; Active Quotes (${active.length})</span>
      </div>
      <table>${TH}<tbody>`;
    active.forEach(q=>{ const i=quotes.indexOf(q); html+=quoteRow(q,i,false); });
    html+=`</tbody></table></div>`;
  }

  // ── Archive ─────────────────────────────────────────────────────────────
  if(archived.length){
    const arcSell=archived.reduce((a,q)=>a+(q.totalSell||0),0);
    const arcRep=archived.reduce((a,q)=>a+(q.totalRepComm||0),0);
    html+=`<div class="section-block">
      <details>
        <summary style="background:var(--bg);font-weight:700;color:var(--text3)">
          &#128229; Archived / Submitted (${archived.length}) &nbsp;
          <span style="font-weight:400;font-size:11px">Total sell: ${fmt(arcSell)} | Commission: ${fmt(arcRep)}</span>
          <button class="btn btn-outline btn-sm" style="margin-left:12px;font-size:10px" onclick="event.preventDefault();exportBundle()">&#128190; Export bundle</button>
        </summary>
        <table>${TH}<tbody>`;
    archived.forEach(q=>{ const i=quotes.indexOf(q); html+=quoteRow(q,i,true); });
    html+=`</tbody></table></details></div>`;
  }

  if(!html) html='<div class="section-block"><div class="empty">Drop exported quotes above to get started</div></div>';
  main.innerHTML=html;
}

// ── Init ──────────────────────────────────────────────────────────────────
async function init(){
  localStorage.removeItem('toro_portal_debbie'); // clear old v1/v2 data
  localStorage.removeItem('toro_portal_debbie_v2');
  await loadFromFirebase();
  startListeners();
}
init();

async function deleteQuote(idx){
  if(!confirm('Permanently remove this quote?')) return;
  const q=quotes[idx];
  quotes.splice(idx,1);
  localStorage.setItem(STORAGE_KEY,JSON.stringify(quotes));
  render();
  fbListenerActive=false;
  await fbDelete(q);
  setTimeout(()=>{ fbListenerActive=true; },2000);
}

</script>
</body>
</html>
