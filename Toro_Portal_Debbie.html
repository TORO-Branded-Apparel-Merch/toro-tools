<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TORO Debbie Commission Portal</title>
<style>
:root{
  --red:#C41E1E;--red-light:#fff0f0;--green:#1a7f4b;--green-bg:#e8f5ee;--bg:#F7F7F8;
  --surface:#fff;--border:#E2E3E6;--border2:#ccc;--text:#1a1a1f;
  --text2:#444;--text3:#888;--brown:#7B3F00;--radius:10px;--radius-sm:6px;
  --orange:#C46A1E;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.topbar{background:#1a1a2e;border-bottom:3px solid var(--red);padding:14px 28px;display:flex;align-items:center;justify-content:space-between}
.topbar h1{color:#fff;font-size:17px;font-weight:700}
.rep-badge{background:var(--red);color:#fff;font-size:12px;font-weight:700;padding:3px 10px;border-radius:10px;margin-left:12px}
.container{max-width:1140px;margin:0 auto;padding:24px}
.drop-zone{border:2px dashed var(--border2);border-radius:var(--radius);padding:28px;text-align:center;cursor:pointer;transition:all .2s;background:var(--surface);margin-bottom:20px}
.drop-zone:hover,.drop-zone.over{border-color:var(--red);background:var(--red-light)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px}
.card-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);margin-bottom:4px}
.card-val{font-size:20px;font-weight:700}
.green{color:var(--green)}.brown{color:var(--brown)}.red{color:var(--red)}.orange{color:var(--orange)}
.section-block{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:16px;overflow:hidden}
.section-hdr{padding:11px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:700}
.section-hdr.ready{background:#1a7f4b;color:#fff}
.section-hdr.active{background:#1a1a2e;color:#fff}
.section-hdr.archive{background:var(--bg);color:var(--text3)}
table{width:100%;border-collapse:collapse;font-size:12px}
th{padding:7px 10px;text-align:left;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text3);border-bottom:1px solid var(--border);background:var(--bg)}
th.r,td.r{text-align:right}
td{padding:8px 10px;border-bottom:1px solid #f5f5f5;vertical-align:middle}
tr:hover td{background:#fafafa}
.mg-pill{display:inline-block;padding:1px 6px;border-radius:8px;font-size:10px;font-weight:700}
.mg-green{background:#e6f4ee;color:var(--green)}
.mg-yellow{background:#FFF8E1;color:#7A4F00}
.mg-red{background:#FFEBEB;color:var(--red)}
.btn{padding:6px 12px;font-size:12px;font-weight:700;border-radius:6px;cursor:pointer;border:none;transition:all .15s}
.btn-primary{background:var(--red);color:#fff}.btn-primary:hover{background:#a51818}
.btn-green{background:var(--green);color:#fff}
.btn-outline{background:#fff;border:1px solid var(--border2);color:var(--text2)}.btn-outline:hover{border-color:var(--red);color:var(--red)}
.btn-sm{padding:3px 8px;font-size:11px}
.empty{padding:24px;text-align:center;color:var(--text3);font-size:13px}
.status-checks{display:flex;gap:12px;flex-wrap:wrap}
.status-check{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--text3);cursor:pointer;padding:3px 0}
.status-check input{width:13px;height:13px;accent-color:var(--green);cursor:pointer}
.status-check.checked{color:var(--green);font-weight:700}
.summary-bar{padding:10px 16px;background:#f0faf4;border-top:1px solid var(--border);font-size:12px;display:flex;gap:20px;flex-wrap:wrap}
.del-btn{background:#fff;border:1px solid #ddd;border-radius:4px;cursor:pointer;color:#aaa;font-size:12px;padding:2px 7px;font-weight:700}
.del-btn:hover{color:var(--red);border-color:var(--red);background:#fff0f0}
.locked-badge{font-size:10px;background:#e8e8e8;color:#888;padding:1px 6px;border-radius:6px;margin-left:4px}
details summary{padding:10px 16px;cursor:pointer;font-size:12px;color:var(--text3);user-select:none;list-style:none}
details summary::-webkit-details-marker{display:none}
.low-margin-note{background:#fff8e1;border-left:3px solid #ffd54f;padding:6px 10px;font-size:11px;color:#b8860b;border-radius:0 4px 4px 0;margin:4px 0;}
</style>
</head>

<script>
const REP = 'Debbie';
const REP_LOWER = 'debbie';
const STORAGE_KEY = 'toro_portal_debbie_v3';
const PW_KEY = 'toro_pw_debbie';
const DEFAULT_PW = 'Toro#Xp8sN';
const LOCK_KEY = 'toro_lock_debbie';
const ATTEMPTS_KEY = 'toro_attempts_debbie';
const PORTAL_VERSION = 'v2.3';
const FIREBASE_DB_URL = 'https://toro-commission-318b4-default-rtdb.firebaseio.com';
const FB_PATH = 'quotes/' + REP_LOWER;

let quotes = [];
let _saving = false;
let fbListenerActive = false;

// ── Password ───────────────────────────────────────────────────────────────
function getStoredPw(){ return localStorage.getItem(PW_KEY)||DEFAULT_PW; }
function getAttempts(){ return parseInt(localStorage.getItem(ATTEMPTS_KEY)||'0'); }
function setAttempts(n){ localStorage.setItem(ATTEMPTS_KEY,n); }
function isLocked(){ return localStorage.getItem(LOCK_KEY)==='locked'; }

function submitPw(){
  if(isLocked()){ document.getElementById('pw-error').textContent='Account locked. Contact your administrator.'; return; }
  const val=document.getElementById('pw-input').value;
  if(val===getStoredPw()){
    setAttempts(0);
    localStorage.setItem('toro_session_debbie', Date.now()+(4*60*60*1000));
    document.getElementById('gate').style.display='none';
    document.getElementById('version-label').textContent = PORTAL_VERSION;
  } else {
    const a=getAttempts()+1; setAttempts(a);
    const rem=5-a;
    if(a>=5){ localStorage.setItem(LOCK_KEY,'locked'); document.getElementById('pw-error').textContent='Account locked after 5 failed attempts.'; document.getElementById('pw-input').disabled=true; }
    else if(a>=3){ document.getElementById('pw-error').textContent='Incorrect. '+rem+' attempt'+(rem===1?'':'s')+' remaining.'; }
    else{ document.getElementById('pw-error').textContent='Incorrect password. Please try again.'; }
    document.getElementById('pw-input').value=''; document.getElementById('pw-input').focus();
  }
}
document.getElementById('pw-input').addEventListener('keydown', e=>{ if(e.key==='Enter') submitPw(); });
function showChangePw(){ document.getElementById('change-pw-modal').style.display='flex'; }
function hideChangePw(){ document.getElementById('change-pw-modal').style.display='none'; }
function submitChangePw(){
  const c=document.getElementById('pw-current').value,n=document.getElementById('pw-new').value,cf=document.getElementById('pw-confirm').value,m=document.getElementById('change-msg');
  if(c!==getStoredPw()){ m.textContent='Current password incorrect.'; return; }
  if(n.length<6){ m.textContent='Min 6 characters.'; return; }
  if(n!==cf){ m.textContent='Passwords do not match.'; return; }
  localStorage.setItem(PW_KEY,n); m.style.color='#1a7f4b'; m.textContent='Password changed.';
  setTimeout(hideChangePw,1500);
}
if(isLocked()){ document.getElementById('pw-error').textContent='Account locked.'; document.getElementById('pw-input').disabled=true; }

// ── Firebase ───────────────────────────────────────────────────────────────
function fbKey(q){
  if(q._fbKey) return q._fbKey;
  if(q.quoteNum) return q.quoteNum.replace(/[.#$\/\[\]]/g,'_');
  return 'q_'+Date.now();
}
async function fbSet(path, data){
  try{
    const method = data===null?'DELETE':'PUT';
    const opts = {method,headers:{'Content-Type':'application/json'}};
    if(data!==null) opts.body=JSON.stringify(data);
    const controller = new AbortController();
    const timer = setTimeout(()=>controller.abort(), 8000);
    try{
      const r=await fetch(FIREBASE_DB_URL+'/'+path+'.json',{...opts,signal:controller.signal});
      clearTimeout(timer);
      return r.ok;
    } catch(e){ clearTimeout(timer); throw e; }
  } catch(e){console.warn('fbSet failed:',e.message);return false;}
}
async function fbGet(path){
  try{
    const r=await fetch(FIREBASE_DB_URL+'/'+path+'.json');
    return r.ok?await r.json():null;
  } catch(e){console.warn('fbGet failed:',e.message);return null;}
}
function fbListen(path,cb){
  const url=FIREBASE_DB_URL+'/'+path+'.json';
  let retry=1000;
  function connect(){
    if(!fbListenerActive) return;
    const es=new EventSource(url);
    es.addEventListener('put',e=>{try{cb(JSON.parse(e.data));}catch(ex){}} );
    es.addEventListener('patch',e=>{try{cb(JSON.parse(e.data));}catch(ex){}} );
    es.onerror=()=>{es.close();if(fbListenerActive)setTimeout(connect,retry=Math.min(retry*2,30000));};
  }
  connect();
}

async function fbSave(q){
  _saving=true;
  const key=fbKey(q); q._fbKey=key;
  try{await fbSet(FB_PATH+'/'+key,q);}
  catch(e){console.error('fbSave error:',e);}
  finally{setTimeout(()=>{_saving=false;},1000);}
}

async function loadFromFirebase(){
  const data=await fbGet(FB_PATH);
  if(data&&typeof data==='object'){
    quotes=Object.values(data)
      .filter(q=>q&&typeof q==='object')
      .map(q=>{
        if(!q._fbKey) q._fbKey=fbKey(q);
        // Clean up any lingering approval states
        if(['needsApproval','waitingApproval'].includes(q.workflowStatus)) q.workflowStatus='active';
        if(!q.workflowStatus) q.workflowStatus='active';
        if(!q.statusChecks) q.statusChecks={quoteApproved:false,orderCompleted:false,paidByClient:false,readyForPayment:false};
        return q;
      });
  } else {
    quotes=[];
  }
  localStorage.setItem(STORAGE_KEY,JSON.stringify(quotes));
  render();
}

function startListeners(){
  fbListenerActive=true;
  let first=true;
  fbListen(FB_PATH,ev=>{
    if(!ev||!ev.data) return;
    if(first){first=false;return;}
    if(_saving) return;
    if(ev.path&&ev.path!=='/'&&ev.data!==undefined){
      const key=ev.path.replace(/^\//, '').split('/')[0];
      if(ev.data===null){
        quotes=quotes.filter(q=>fbKey(q)!==key);
      } else if(typeof ev.data==='object'){
        const idx=quotes.findIndex(q=>fbKey(q)===key);
        const updated={...ev.data,_fbKey:key};
        if(['needsApproval','waitingApproval'].includes(updated.workflowStatus)) updated.workflowStatus='active';
        if(idx>=0){if(!updated.workflowStatus)updated.workflowStatus=quotes[idx].workflowStatus;quotes[idx]=updated;}
        else quotes.push(updated);
      }
    } else if(ev.data&&typeof ev.data==='object'){
      quotes=Object.entries(ev.data).filter(([k,v])=>v&&typeof v==='object').map(([k,v])=>{
        if(['needsApproval','waitingApproval'].includes(v.workflowStatus)) v.workflowStatus='active';
        return {...v,_fbKey:k};
      });
    } else if(ev.data===null){
      quotes=[];
    }
    localStorage.setItem(STORAGE_KEY,JSON.stringify(quotes));
    render();
  });
}

// ── File loading ───────────────────────────────────────────────────────────
const dz=document.getElementById('drop-zone');
const fi=document.getElementById('file-input');
dz.addEventListener('dragover',e=>{e.preventDefault();dz.classList.add('over')});
dz.addEventListener('dragleave',()=>dz.classList.remove('over'));
dz.addEventListener('drop',e=>{e.preventDefault();dz.classList.remove('over');loadFiles([...e.dataTransfer.files])});
fi.addEventListener('change',()=>{loadFiles([...fi.files]);fi.value=''});

function loadFiles(files){
  files.forEach(f=>{
    if(!f.name.endsWith('.json')) return;
    const r=new FileReader();
    r.onload=async e=>{
      try{
        const q=JSON.parse(e.target.result);
        if(!q.totalSell&&!q.quoteName&&!q.quoteNum) return;
        if(q.rep&&q.rep!==REP&&q.rep.toLowerCase()!==REP_LOWER){ alert('This quote belongs to '+q.rep+', not Debbie.'); return; }
        q.rep=REP;
        if(!q._fbKey) q._fbKey=fbKey(q);
        // Always start as active — no approval states
        if(!q.workflowStatus||['needsApproval','waitingApproval'].includes(q.workflowStatus)) q.workflowStatus='active';
        if(!q.statusChecks) q.statusChecks={quoteApproved:false,orderCompleted:false,paidByClient:false,readyForPayment:false};
        if(q.page1){
          q.clientName=q.page1.clientName||q.clientName||'';
          q.clientCompany=q.page1.clientCompany||q.clientCompany||'';
          q.rep=q.page1.rep||REP;
          q.quoteNum=q.page1.quoteNum||q.quoteNum||'';
          q.quoteName=q.page1.quoteName||q.quoteName||'';
          q.ihd=q.page1.shipDate||q.ihd||'';
          q.commissionSplit=q.page1.commSplit||q.commissionSplit||'standard';
        }
        const existing=quotes.findIndex(x=>fbKey(x)===fbKey(q));
        if(existing>=0){
          q.statusChecks=quotes[existing].statusChecks||q.statusChecks;
          quotes[existing]=q;
        } else quotes.push(q);
        render();
        await fbSave(q);
        localStorage.setItem(STORAGE_KEY,JSON.stringify(quotes));
      } catch(err){console.error(err);}
    };
    r.readAsText(f);
  });
}

// ── Status updates ─────────────────────────────────────────────────────────
async function toggleStatus(qKey,field){
  const q=quotes.find(x=>fbKey(x)===qKey);
  if(!q) return;
  if(q.workflowStatus==='submittedCommission') return;
  if(!q.statusChecks) q.statusChecks={quoteApproved:false,orderCompleted:false,paidByClient:false,readyForPayment:false};
  q.statusChecks[field]=!q.statusChecks[field];
  if(field==='readyForPayment'&&q.statusChecks[field]) q.workflowStatus='readyForSubmission';
  if(field==='readyForPayment'&&!q.statusChecks[field]&&q.workflowStatus==='readyForSubmission') q.workflowStatus='active';
  localStorage.setItem(STORAGE_KEY,JSON.stringify(quotes));
  render();
  await fbSave(q);
}

async function submitForCommission(){
  const readyQuotes=quotes.filter(q=>q.statusChecks&&q.statusChecks.readyForPayment&&q.workflowStatus!=='submittedCommission'&&q.workflowStatus!=='paid');
  if(!readyQuotes.length){alert('No quotes ready for submission.');return;}
  if(!confirm('Submit '+readyQuotes.length+' quote'+(readyQuotes.length!==1?'s':'')+' for commission? They will be archived.')) return;
  const submittedAt=new Date().toISOString();
  for(const q of readyQuotes){
    q.workflowStatus='submittedCommission';
    q.submittedAt=submittedAt;
    await fbSave(q);
  }
  localStorage.setItem(STORAGE_KEY,JSON.stringify(quotes));
  render();
}

async function submitOneCommission(encKey){
  const key=decodeURIComponent(encKey);
  const q=quotes.find(x=>fbKey(x)===key);
  if(!q) return;
  if(!confirm('Submit this quote for commission payment? It will be archived.')) return;
  q.workflowStatus='submittedCommission';
  q.submittedAt=new Date().toISOString();
  localStorage.setItem(STORAGE_KEY,JSON.stringify(quotes));
  render();
  await fbSave(q);
}

async function deleteQuote(encKey){
  const key=decodeURIComponent(encKey);
  if(!confirm('Permanently remove this quote?')) return;
  const idx=quotes.findIndex(x=>fbKey(x)===key);
  if(idx<0) return;
  const q=quotes[idx];
  quotes.splice(idx,1);
  localStorage.setItem(STORAGE_KEY,JSON.stringify(quotes));
  render();
  fbListenerActive=false;
  try{await fbSet(FB_PATH+'/'+fbKey(q),null);}
  catch(e){console.error('deleteQuote error:',e);}
  finally{setTimeout(()=>{fbListenerActive=true;},2000);}
}

function exportBundle(){
  const submitted=quotes.filter(q=>q.workflowStatus==='submittedCommission');
  if(!submitted.length){alert('No submitted quotes to export.');return;}
  const bundle={type:'commission_bundle',rep:REP,exportedAt:new Date().toLocaleString(),quotes:submitted,
    totals:{totalSell:submitted.reduce((a,q)=>a+(q.totalSell||0),0),repPayout:submitted.reduce((a,q)=>a+(q.totalRepComm||0),0)}
  };
  const blob=new Blob([JSON.stringify(bundle,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='TORO_Commission_Debbie_'+new Date().toLocaleDateString('en-US').replace(/\//g,'-')+'.json';
  a.click();URL.revokeObjectURL(a.href);
}

// ── Helpers ────────────────────────────────────────────────────────────────
const fmt=v=>'$'+parseFloat(v||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const pct=v=>(Math.round((v||0)*10)/10)+'%';

function statusChecksHtml(q){
  const sc=q.statusChecks||{};
  const key=encodeURIComponent(fbKey(q));
  const checks=[['quoteApproved','Quote Approved'],['orderCompleted','Order Completed'],['paidByClient','Paid by Client'],['readyForPayment','Ready for Payment']];
  return '<div class="status-checks">'+checks.map(([field,label])=>{
    const checked=sc[field]||false;
    return '<label class="status-check'+(checked?' checked':'')+'">'+
      '<input type="checkbox"'+(checked?' checked':'')+
      ' data-key="'+key+'" data-field="'+field+'"'+
      ' onchange="toggleStatus(decodeURIComponent(this.dataset.key),this.dataset.field)"> '+label+
      '</label>';
  }).join('')+'</div>';
}

function quoteRow(q,locked,isReady){
  const sell=q.totalSell||0, net=q.totalNetCost||0, comm=q.totalRepComm||0;
  const mg=sell>0?Math.round((1-net/sell)*1000)/10:0;
  const mgCls=mg<30?'red':mg<35?'orange':'green';
  const key=fbKey(q); const encKey=encodeURIComponent(key);
  const project=[q.quoteName||q.quoteNum||'Untitled',q.clientName,q.clientCompany].filter(Boolean).join(' — ');

  // Low margin note (display only — no workflow action)
  const lowNote = (!locked&&mg>0&&mg<30)
    ? '<div class="low-margin-note">⚠️ Margin below 30% — management awareness required before presenting to client.</div>'
    : '';

  let actions='';
  if(!locked){
    if(isReady){
      actions+='<button class="btn btn-green btn-sm" onclick="submitOneCommission(''+encKey+'')" title="Submit this quote">📤 Submit</button> ';
    }
    actions+='<button class="del-btn" onclick="deleteQuote(''+encKey+'')" title="Delete">🗑</button>';
  }

  const checks=locked?'':statusChecksHtml(q);

  const paidBadge = q.workflowStatus==='paid' ? '<span style="display:inline-block;background:#16a34a;color:#fff;font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;margin-left:8px;vertical-align:middle;">✓ Paid</span>' : locked&&q.workflowStatus==='submittedCommission' ? '<span style="display:inline-block;background:#6366f1;color:#fff;font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;margin-left:8px;vertical-align:middle;">Submitted</span>' : '';
  return `<tr>
    <td>${lowNote}<strong>${project}</strong>${paidBadge}${q.ihd?'<br><span style="font-size:10px;color:var(--text3)">IHD: '+q.ihd+'</span>':''}</td>
    <td class="r">${fmt(net)}</td>
    <td class="r">${fmt(sell)}</td>
    <td class="r"><span class="${mgCls}">${pct(mg)}</span></td>
    <td class="r" style="color:var(--brown)">${fmt(comm)}</td>
    <td>${q.commissionSplit||'standard'}</td>
    <td>${checks}</td>
    <td style="white-space:nowrap">${actions}</td>
  </tr>`;
}

// ── Render ─────────────────────────────────────────────────────────────────
function render(){
  const status=document.getElementById('status-text');
  const cards=document.getElementById('summary-cards');
  const main=document.getElementById('main-content');

  if(!quotes.length){
    status.textContent='No quotes loaded';
    cards.innerHTML='';
    main.innerHTML='<div class="section-block"><div class="empty">Drop exported quotes above to get started</div></div>';
    return;
  }
  status.textContent=quotes.length+' quote'+(quotes.length!==1?'s':'')+' loaded';

  const ready=quotes.filter(q=>q.workflowStatus==='readyForSubmission'||(q.statusChecks&&q.statusChecks.readyForPayment&&q.workflowStatus!=='submittedCommission'));
  const active=quotes.filter(q=>!['readyForSubmission','submittedCommission','paid'].includes(q.workflowStatus)&&!(q.statusChecks&&q.statusChecks.readyForPayment));
  const archived=quotes.filter(q=>q.workflowStatus==='submittedCommission'||q.workflowStatus==='paid');
  const all=[...ready,...active];

  const totSell=all.reduce((a,q)=>a+(q.totalSell||0),0);
  const totNet=all.reduce((a,q)=>a+(q.totalNetCost||0),0);
  const totRep=all.reduce((a,q)=>a+(q.totalRepComm||0),0);
  const totGP=totSell-totNet;
  const avgMg=totSell>0?Math.round((1-totNet/totSell)*1000)/10:0;

  cards.innerHTML=`
    <div class="card"><div class="card-lbl">Active quotes</div><div class="card-val">${all.length}</div></div>
    <div class="card"><div class="card-lbl">Total sell</div><div class="card-val green">${fmt(totSell)}</div></div>
    <div class="card"><div class="card-lbl">Gross profit</div><div class="card-val green">${fmt(totGP)}</div></div>
    <div class="card"><div class="card-lbl">Avg margin</div><div class="card-val ${avgMg<30?'red':avgMg<35?'orange':'green'}">${pct(avgMg)}</div></div>
    <div class="card"><div class="card-lbl">My commission</div><div class="card-val brown">${fmt(totRep)}</div></div>
  `;

  const TH='<thead><tr><th>Project</th><th class="r">Cost</th><th class="r">Sell</th><th class="r">Margin</th><th class="r">Commission</th><th>Split</th><th>Status</th><th></th></tr></thead>';
  let html='';

  if(ready.length){
    const rSell=ready.reduce((a,q)=>a+(q.totalSell||0),0);
    const rNet=ready.reduce((a,q)=>a+(q.totalNetCost||0),0);
    const rRep=ready.reduce((a,q)=>a+(q.totalRepComm||0),0);
    const rMg=rSell>0?Math.round((1-rNet/rSell)*1000)/10:0;
    html+=`<div class="section-block">
      <div class="section-hdr ready">
        <span>&#9989; Ready for Commission Submission (${ready.length})</span>
        <button class="btn btn-sm" style="background:#fff;color:var(--green);font-weight:700" onclick="submitForCommission()">📤 Submit All</button>
      </div>
      <div class="summary-bar">
        <span>Quotes: <strong>${ready.length}</strong></span>
        <span>Total sell: <strong>${fmt(rSell)}</strong></span>
        <span>GP: <strong>${fmt(rSell-rNet)}</strong></span>
        <span>Avg margin: <strong><span class="mg-pill ${rMg<30?'mg-red':rMg<35?'mg-yellow':'mg-green'}">${pct(rMg)}</span></strong></span>
        <span>Commission: <strong style="color:var(--brown)">${fmt(rRep)}</strong></span>
      </div>
      <table>${TH}<tbody>`;
    ready.forEach(q=>{html+=quoteRow(q,false,true);});
    html+=`</tbody></table></div>`;
  }

  if(active.length){
    html+=`<div class="section-block">
      <div class="section-hdr active"><span>&#128203; Active Quotes (${active.length})</span></div>
      <table>${TH}<tbody>`;
    active.forEach(q=>{html+=quoteRow(q,false,false);});
    html+=`</tbody></table></div>`;
  }

  if(archived.length){
    const arcSell=archived.reduce((a,q)=>a+(q.totalSell||0),0);
    const arcRep=archived.reduce((a,q)=>a+(q.totalRepComm||0),0);
    html+=`<div class="section-block"><details>
      <summary>&#128229; Archived / Submitted (${archived.length}) &nbsp;
        <span style="font-weight:400;font-size:11px">Total sell: ${fmt(arcSell)} | Commission: ${fmt(arcRep)}</span>
        <button class="btn btn-outline btn-sm" style="margin-left:12px;font-size:10px" onclick="event.preventDefault();exportBundle()">&#128190; Export bundle</button>
      </summary>
      <table>${TH}<tbody>`;
    archived.forEach(q=>{html+=quoteRow(q,true,false);});
    html+=`</tbody></table></details></div>`;
  }

  if(!html) html='<div class="section-block"><div class="empty">Drop exported quotes above to get started</div></div>';
  main.innerHTML=html;
}

// ── Init ───────────────────────────────────────────────────────────────────
async function init(){
  try{ quotes=JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]'); } catch(e){ quotes=[]; }
  // Clean up any lingering approval states from old data
  quotes.forEach(q=>{
    if(['needsApproval','waitingApproval'].includes(q.workflowStatus)) q.workflowStatus='active';
    if(!q.workflowStatus) q.workflowStatus='active';
  });
  if(quotes.length) render();
  await loadFromFirebase();
  startListeners();
}

    const expiry=parseInt(localStorage.getItem('toro_session_debbie')||'0');
    if(Date.now()<expiry){
      document.getElementById('gate').style.display='none';
      document.getElementById('version-label').textContent = PORTAL_VERSION;
    }
  } catch(e){}
})();

document.getElementById('version-label').textContent = PORTAL_VERSION;
init();
</script>
